<style>
  *{box-sizing:border-box;margin:0;padding:0}
  button,input,textarea,select{font-family:inherit;letter-spacing:0}
  body{font-family:"PingFang SC","Hiragino Sans GB",serif;min-height:100vh;
     background:linear-gradient(180deg,#dfe9ef,#c9dbe4);color:#3d4c55;
     display:flex;align-items:center;justify-content:center;overflow:hidden}
  .back{position:fixed;left:18px;top:16px;z-index:40;color:#2f4651;text-decoration:none;font-size:15px;
     background:rgba(255,255,255,.92);padding:9px 16px;border-radius:999px;
     border:1px solid rgba(61,76,85,.16);box-shadow:0 10px 24px rgba(50,70,82,.22);
     backdrop-filter:blur(8px);font-weight:600}
  .travel-stage{position:relative;width:100vw;height:100vh;overflow:auto;border-radius:0;padding:28px 24px 54px;
     display:flex;flex-direction:column;align-items:center;
     background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.18));
     box-shadow:none;isolation:isolate}
  .travel-stage:before{content:"";position:fixed;inset:0;background:
     linear-gradient(180deg,rgba(239,247,250,.2),rgba(68,87,96,.38)),
     url("../assets/travel/travel_postcard.webp") center/cover no-repeat;z-index:-2}
  .travel-stage:after{content:"";position:fixed;inset:0;background:rgba(255,250,240,.14);z-index:-1}
  .travel-header{width:min(1080px,calc(100vw - 48px));text-align:center;margin-bottom:18px}
  h1{font-size:18px;margin-bottom:6px;letter-spacing:2px}
  .lead{color:#6d7c85;font-size:13px}
  .travel-shell{width:min(1080px,calc(100vw - 48px));display:grid;gap:18px}
  .travel-layout{display:grid;grid-template-columns:350px minmax(0,1fr);gap:22px;align-items:start}
  [data-travel-panel]{width:100%;min-width:0}.travel-records{min-width:0}.travel-records-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px;padding:0 2px}.travel-records-head h2{font-size:15px;color:#345767}
  /* 拍立得 */
  .polaroids{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,300px));gap:18px;justify-content:start;width:100%}
  .polaroid{background:#fff;padding:12px 12px 40px;border-radius:4px;box-shadow:0 12px 30px rgba(60,80,95,.28);
     width:220px;position:relative;transition:transform .2s}
  .polaroid:hover{transform:rotate(0deg) scale(1.03)!important}
  .polaroid:nth-child(odd){transform:rotate(-3deg)}
  .polaroid:nth-child(even){transform:rotate(2deg)}
  .polaroid .pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:14px;height:14px;
     background:#d15b4c;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.3)}
  .polaroid .pic{width:100%;height:180px;object-fit:cover;background:#e7eef1;border-radius:2px;display:block}
  .polaroid .pic-fb{width:100%;height:180px;display:flex;align-items:center;justify-content:center;
     font-size:46px;background:linear-gradient(135deg,#cfe0e6,#b8ccd6);border-radius:2px}
  .polaroid .line{font-size:14px;margin-top:12px;text-align:center;color:#4a5a63;line-height:1.5}
  .polaroid .date{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#9aa8b0}
  .trip-card{width:100%;height:100%;min-height:390px;background:rgba(255,255,255,.9);border-radius:14px;padding:12px;
     box-shadow:0 12px 30px rgba(60,80,95,.24);display:flex;flex-direction:column;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease}.trip-card:hover{transform:translateY(-2px);box-shadow:0 17px 38px rgba(60,80,95,.3)}.trip-card:focus-visible{outline:3px solid rgba(84,132,155,.38);outline-offset:3px}
  .trip-photos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;min-height:220px;background:#edf3f5;border-radius:10px;overflow:hidden}
  .trip-photos img{width:100%;height:220px;object-fit:contain;border-radius:8px;background:#edf3f5}
  .trip-photos.photos-1 img{grid-column:1/-1}.trip-photos.photos-3 img:first-child{grid-row:span 2;height:446px}.trip-photos.photos-3 img:not(:first-child){height:220px}
  .trip-card h2{font-size:16px;margin:12px 2px 4px;color:#3d4c55}
  .trip-activity{margin:2px 2px 4px;color:#3f6f84;font-size:12px;font-weight:700}
  .trip-card p{font-size:13px;line-height:1.55;color:#5f707a;margin:4px 2px}
  .trip-card .date{font-size:11px;color:#8a99a2;margin:8px 2px 0}
  .trip-status{display:inline-flex;margin:7px 2px 0;padding:3px 8px;border-radius:999px;background:#e8f1f4;color:#547789;font-size:11px}
  .trip-actions{display:flex;gap:7px;flex-wrap:wrap;margin:auto 2px 2px;padding-top:12px}.trip-actions button{border:1px solid rgba(79,117,136,.18);border-radius:8px;background:#f4fafc;color:#4f7588;padding:7px 10px;font:inherit;font-size:11px;cursor:pointer}.trip-actions button.danger{color:#9b6558;background:#fff7f4}
  .trip-editor,.trip-detail{display:none;position:fixed;inset:0;z-index:80;align-items:stretch;justify-content:center;padding:0;background:#eef4f6;overflow:hidden}.trip-editor.show,.trip-detail.show{display:flex}.trip-editor-card,.trip-detail-card{width:100%;height:100%;min-width:0;max-width:none;max-height:none;overflow:auto;overflow-x:hidden;background:#f7fbfc;border-radius:0;padding:clamp(22px,4vw,56px);box-shadow:none}.trip-editor-head,.trip-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid #dce7eb}.trip-editor-head h2,.trip-detail-head h2{font-size:22px;color:#345767}.trip-detail-head p{margin-top:5px;font-size:12px;color:#83949c}.trip-editor-close{height:36px;border:1px solid #d5e2e7;border-radius:8px;background:#fff;color:#55717e;padding:0 12px;font:12px inherit;white-space:nowrap;cursor:pointer}.trip-editor-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.trip-editor-fields>*{min-width:0}.trip-editor-fields input,.trip-editor-fields textarea{display:block;width:100%;min-width:0;max-width:100%;border:1px solid #cbdbe2;border-radius:9px;padding:11px 12px;background:#fff;color:#3d4c55;font:inherit}.trip-editor-fields input[type="date"]{-webkit-appearance:none;appearance:none}.trip-editor-fields textarea{grid-column:1/-1;min-height:150px;resize:vertical;line-height:1.6}.trip-editor-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:20px 0}.trip-editor-empty{grid-column:1/-1;margin:5px 0;color:#83949c;font-size:12px;white-space:nowrap}.trip-editor-photo{position:relative;min-height:190px;border-radius:9px;overflow:hidden;background:#dfe9ed}.trip-editor-photo img{width:100%;height:190px;object-fit:contain}.trip-editor-photo button{position:absolute;right:5px;top:5px;width:26px;height:26px;border:0;border-radius:50%;background:rgba(76,54,47,.78);color:#fff;cursor:pointer}.trip-editor-actions{display:flex;justify-content:flex-end;gap:8px}.trip-editor-actions button{height:40px;border:0;border-radius:8px;padding:0 16px;background:#6f9db3;color:#fff;font:inherit;cursor:pointer}.trip-editor-actions .secondary{background:#e6f0f4;color:#4f7181}.trip-detail-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.trip-detail-gallery img{width:100%;height:min(440px,52vh);object-fit:contain;border-radius:10px;background:#e2ecef}.trip-detail-copy{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.72fr);gap:18px;margin-top:20px}.trip-detail-section{padding:18px;border-radius:8px;background:#fff;border:1px solid rgba(86,124,143,.12)}.trip-detail-section h3{font-size:14px;color:#436979;margin-bottom:9px}.trip-detail-section p{font-size:13px;line-height:1.75;color:#5f7078;white-space:pre-wrap}.trip-detail-record{padding:10px 0;border-bottom:1px dashed rgba(86,124,143,.15)}.trip-detail-record:last-child{border-bottom:0}.trip-detail-record b{display:block;font-size:11px;color:#486b7a}.trip-detail-record span{display:block;margin-top:4px;font-size:12px;line-height:1.6;color:#667b85}
  .trip-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:100%;
     background:rgba(255,255,255,.72);border:1px solid rgba(80,96,108,.12);border-radius:14px;padding:13px;margin:0;
     backdrop-filter:blur(8px)}
  .trip-form input{min-width:0;border:1px solid #cfdce2;border-radius:9px;padding:10px 12px;font:inherit;background:#fff;color:#3d4c55}
  .trip-field{min-width:0;display:grid;gap:4px}.trip-field span{padding-left:2px;font-size:10px;color:#647f8c}.trip-field input{display:block;width:100%;min-width:0;max-width:100%;height:41px}
  .trip-form button{border:0;border-radius:9px;background:#55798c;color:#fff;padding:10px 15px;font:inherit;cursor:pointer;white-space:nowrap}.trip-photo-picker{display:flex;align-items:center;gap:10px;min-width:0}.trip-photo-picker button{background:#e6f0f4;color:#4f7181}.trip-photo-count{min-width:0;color:#6c818b;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trip-submit{width:100%}
  .new-trip-photo-preview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;grid-column:1/-1}.new-trip-photo-preview:empty{display:none}.new-trip-photo-item{position:relative;min-width:0;height:96px;border-radius:8px;overflow:hidden;background:#e7eff2}.new-trip-photo-item img{display:block;width:100%;height:100%;object-fit:contain}.new-trip-photo-remove{position:absolute;right:5px;top:5px;width:26px!important;height:26px!important;min-height:0!important;padding:0!important;border:0!important;border-radius:50%!important;background:rgba(55,68,75,.82)!important;color:#fff!important;font-size:16px!important;line-height:1!important;display:grid;place-items:center;box-shadow:0 2px 8px rgba(32,43,49,.2)}
  .reflection-panel{width:100%;background:rgba(246,252,255,.78);border:1px solid rgba(107,154,179,.2);
     border-radius:14px;padding:15px;margin:0;box-shadow:0 14px 34px rgba(50,70,82,.16);
     backdrop-filter:blur(10px)}
  .reflection-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:12px;margin-bottom:12px}
  .reflection-head h2{font-size:16px;color:#345767;font-weight:700}
  .reflection-head span{display:block;margin-top:4px;font-size:11px;color:#78909a}
  .reflection-clear{height:30px;border:1px solid rgba(107,154,179,.24);border-radius:8px;background:rgba(255,255,255,.58);color:#5b7c8b;padding:0 10px;font-family:inherit;font-size:11px;cursor:pointer}
  .reflection-clear:hover{background:rgba(255,255,255,.86);color:#365d70}
  .reflection-grid{display:grid;grid-template-columns:1fr;gap:9px;align-items:start}
  .reflection-panel select,.reflection-panel textarea{border:1px solid rgba(107,154,179,.22);border-radius:16px;
     padding:10px 12px;background:rgba(255,255,255,.78);font:inherit;color:#3d4c55;outline:none}
  .reflection-panel textarea{min-height:82px;resize:vertical;line-height:1.65}
  .reflection-actions{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:center}
  .mic-btn{width:40px;height:40px;border:1px solid rgba(81,151,190,.28);border-radius:50%;
     background:rgba(151,213,241,.5);color:#2d6c8a;cursor:pointer;display:grid;place-items:center;
     box-shadow:0 10px 22px rgba(75,140,174,.18);backdrop-filter:blur(8px)}
  .mic-btn:hover{background:rgba(151,213,241,.72)}
  .mic-btn.active{background:#5d8fa7;color:#fff;box-shadow:0 0 0 5px rgba(93,143,167,.16)}
  .travel-mic-icon{position:relative;width:18px;height:24px;display:block}
  .travel-mic-icon:before{content:"";position:absolute;left:50%;top:0;width:9px;height:15px;border:2px solid currentColor;border-radius:7px;transform:translateX(-50%)}
  .travel-mic-icon:after{content:"";position:absolute;left:50%;top:11px;width:16px;height:9px;border:2px solid currentColor;border-top:0;border-radius:0 0 9px 9px;transform:translateX(-50%)}
  .travel-mic-stem{position:absolute;left:50%;top:19px;width:2px;height:5px;background:currentColor;transform:translateX(-50%)}
  .travel-mic-stem:after{content:"";position:absolute;left:50%;bottom:0;width:11px;height:2px;border-radius:2px;background:currentColor;transform:translate(-50%,2px)}
  .reflection-actions button:not(.mic-btn){height:40px;border:0;border-radius:8px;background:#6f9db3;color:#fff;
     padding:8px 10px;font:inherit;font-size:11px;cursor:pointer;white-space:nowrap}
  .reflection-ai{margin-top:10px;background:rgba(255,255,255,.62);border:1px solid rgba(107,154,179,.16);
     border-radius:16px;padding:10px 12px;color:#516975;font-size:13px;line-height:1.65;white-space:pre-line}
  .reflection-ai:empty{display:none}
  .trip-insight{margin:10px 2px 0;padding:9px 10px;border-radius:14px;background:rgba(231,246,252,.72);
     color:#4e7283;font-size:12px;line-height:1.55}
  .travel-mobile-tabs{display:none}
  @media(max-width:900px){.travel-layout{grid-template-columns:1fr}.reflection-panel{max-width:none}.polaroids{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}}
  @media(max-width:760px){
    .back{display:none}.travel-stage{height:calc(100dvh - var(--mobile-nav-h,62px));padding:14px 14px 30px;align-items:stretch}.travel-stage:before{background-image:linear-gradient(180deg,rgba(238,249,255,.3),rgba(233,246,252,.56)),url("../assets/travel/travel_postcard_mobile.webp");background-position:center center}.travel-header,.travel-shell{width:100%}.travel-header{margin:0 0 10px;text-align:left;padding:0 2px}.travel-header h1{font-size:19px;line-height:1.3;margin:0}.travel-header .lead{display:none}.travel-shell{gap:10px}.travel-mobile-tabs{position:sticky;top:-14px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:4px;background:rgba(237,245,247,.94);border:1px solid rgba(77,107,121,.13);border-radius:10px;box-shadow:0 8px 22px rgba(50,70,82,.12);backdrop-filter:blur(14px)}.travel-mobile-tabs button{height:36px;border:0;border-radius:7px;background:transparent;color:#667b85;font:12px inherit;cursor:pointer}.travel-mobile-tabs button.active{background:#fff;color:#365d70;font-weight:700;box-shadow:0 2px 7px rgba(52,82,96,.13)}
    .trip-form,.reflection-panel,.travel-records{display:none}.trip-form.mobile-active{display:grid}.reflection-panel.mobile-active{display:block}.travel-records.mobile-active{display:block}.travel-layout{display:block}.travel-status{margin:0;min-height:0}.travel-status:empty{display:none}
    [data-travel-panel]{width:100%;max-width:none}.trip-form{grid-template-columns:minmax(0,1fr);gap:10px;padding:14px;border-radius:11px;background:rgba(248,252,253,.94);overflow-x:hidden}.trip-form>*{grid-column:1;width:100%;min-width:0}.trip-form input{height:44px;min-height:44px;max-height:44px;font-size:16px}.trip-field{display:grid;gap:5px;padding:0;overflow:hidden}.trip-field span{font-size:11px}.trip-field input[type="date"]{display:block;width:100%;min-width:0;max-width:100%;height:44px;min-height:44px;max-height:44px;margin:0;padding:0 12px;line-height:44px;font-size:16px;-webkit-appearance:none;appearance:none}.trip-form button{height:44px;padding:0 14px}.trip-photo-picker{display:grid;grid-template-columns:auto minmax(0,1fr)}.trip-photo-picker button{width:auto}.new-trip-photo-preview{grid-template-columns:repeat(2,minmax(0,1fr))}.new-trip-photo-item{height:118px}
    .reflection-panel{padding:14px;border-radius:11px;background:rgba(248,252,253,.94);box-shadow:0 10px 26px rgba(50,70,82,.13)}.reflection-head{margin-bottom:10px}.reflection-panel select,.reflection-panel textarea{border-radius:8px;background:#fff;font-size:16px}.reflection-panel textarea{min-height:130px}.reflection-actions{grid-template-columns:42px 1fr 1fr}.reflection-actions button:last-child{grid-column:auto}.reflection-ai{border-radius:8px;background:#f2f7f8}

<body>
<a class="back" href="../index.html">← 回家</a>
<main class="travel-stage">
<header class="travel-header"><h1>🧳 旅行</h1><p class="lead">每次出门，只带回一张拍立得和一句话。回来钉在小院外墙上。</p></header>
<div class="travel-shell"><nav class="travel-mobile-tabs" aria-label="旅行页面"><button type="button" data-travel-view="records" class="active" onclick="showMobileTravelView('records',this)">旅行记录</button><button type="button" data-travel-view="new" onclick="showMobileTravelView('new',this)">记旅程</button><button type="button" data-travel-view="reflection" onclick="showMobileTravelView('reflection',this)">写感悟</button></nav><div class="trip-form" data-travel-panel="new">
  <label class="trip-field"><span>目的地</span><input id="trip-place"></label>
  <label class="trip-field"><span>旅程主题</span><input id="trip-activity"></label>
  <label class="trip-field"><span>出发日期</span><input id="trip-start" type="date" aria-label="出发日期"></label>
  <label class="trip-field"><span>回家日期</span><input id="trip-end" type="date" aria-label="回家日期"></label>
  <div class="trip-photo-picker"><button type="button" onclick="pickNewTripPhotos()">选择旅程照片</button><span class="trip-photo-count" id="new-trip-photo-count">未选择照片</span></div>
  <div class="new-trip-photo-preview" id="new-trip-photo-preview" aria-live="polite"></div>
  <button class="trip-submit" type="button" onclick="saveTrip()">记录旅程</button>
</div>
<div class="travel-status" id="travel-status"></div>
<div class="travel-layout"><section class="reflection-panel" data-travel-panel="reflection">
  <div class="reflection-head">
    <div><h2>旅行感悟</h2></div>
    <button class="reflection-clear" type="button" onclick="clearReflectionDraft()">清空</button>
  </div>
  <div class="reflection-grid">
    <select id="reflection-trip" onchange="loadTripReflection()"></select>
    <textarea id="reflection-text" oninput="queueReflectionSummary()" placeholder="这段旅行给我的感觉、变化、想留下的话……"></textarea>
    <div class="reflection-actions">
      <button class="mic-btn" onclick="startReflectionVoice()" aria-label="语音修改" title="语音修改"><span class="travel-mic-icon"><span class="travel-mic-stem"></span></span></button>
      <button id="reflection-summary-button" onclick="summarizeReflection()">阿栗总结</button>
      <button id="reflection-save-button" onclick="saveReflection()">保存感悟</button>
    </div>
  </div>
  <div class="reflection-ai" id="reflection-ai"></div>
</section>
<section class="travel-records mobile-active" data-travel-panel="records"><div class="travel-records-head"><h2>旅行记录</h2></div><div class="polaroids" id="polaroids"></div></section></div></div>
<input id="new-trip-photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden onchange="setNewTripPhotos(this.files)">
<input id="trip-photo-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden onchange="uploadTripPhotos(this.files)">
<div class="trip-editor" id="trip-editor"><section class="trip-editor-card"><header class="trip-editor-head"><h2>编辑旅程</h2><button class="trip-editor-close" type="button" onclick="closeTripEditor()" aria-label="返回旅行">← 返回旅行</button></header><div class="trip-editor-fields"><label class="trip-field"><span>目的地</span><input id="edit-trip-place"></label><label class="trip-field"><span>旅程主题</span><input id="edit-trip-activity"></label><label class="trip-field"><span>出发日期</span><input id="edit-trip-start" type="date" aria-label="编辑出发日期"></label><label class="trip-field"><span>回家日期</span><input id="edit-trip-end" type="date" aria-label="编辑回家日期"></label><textarea id="edit-trip-summary" placeholder="这段旅行的描述"></textarea></div><div class="trip-editor-photos" id="edit-trip-photos"></div><div class="trip-editor-actions"><button class="secondary" type="button" onclick="pickTripPhotos(editingTripId)">添加照片</button><button type="button" onclick="saveTripEdits()">保存修改</button></div></section></div>
<div class="trip-detail" id="trip-detail" onclick="if(event.target===this)closeTripDetail()"><section class="trip-detail-card" id="trip-detail-card"></section></div>
</main>

<script>
function localCalendarDate(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function showMobileTravelView(view,button){
  document.querySelectorAll('[data-travel-panel]').forEach(panel=>panel.classList.toggle('mobile-active',panel.dataset.travelPanel===view));
  document.querySelectorAll('[data-travel-view]').forEach(tab=>tab.classList.toggle('active',tab.dataset.travelView===view));
  if(button)button.blur();
  document.querySelector('.travel-stage')?.scrollTo({top:0,behavior:'smooth'});
}
let CORE = {};
async function load(){
  CORE = window.CozyRuntime ? await window.CozyRuntime.loadJson('../core/estate_state.json',{travel:{history:[]}},'estate_state') : ((window.COZY && window.COZY.estate_state) || {travel:{history:[]}});
  render();
}
function render(){
  const h = getAllTrips();
  const box = document.getElementById('polaroids');
  renderReflectionOptions(h);
  if(!h.length){ box.innerHTML = '<div style="color:#8a99a2">还没有旅行记录。点下面出发一次。</div>'; return; }
  const reflections = getReflections();
  const grouped = {};
  h.forEach(t=>{
    const place = t.place || '未命名地点';
    if(!grouped[place]) grouped[place] = [];
    grouped[place].push(t);
  });
  box.innerHTML = Object.keys(grouped).map(place=>{
    const trips = grouped[place].slice(0,3);
    const first = trips[0] || {};
    const photoFiles = trips.flatMap(t=>(t.photos&&t.photos.length?t.photos:[t.file]).filter(Boolean)).slice(0,3);
    const displayedPhotos=photoFiles.length?photoFiles:['../assets/travel/travel_postcard.webp'];
    const imgs = displayedPhotos.map(file=>'<img src="'+travelAsset(file)+'" alt="'+escapeTravel(place)+'">').join('');
    const start = first.start || first.date || '';
    const end = first.end || '';
    const insight = combinedPlaceReflection(trips,reflections);
    const status=tripStatus(first);
    const local=isLocalTrip(first.id);
    const description=tripCardDescription(first,insight);
    return '<article class="trip-card" tabindex="0" role="button" aria-label="查看 '+escapeTravel(place)+' 的旅行记录" onclick="openTripDetail(\''+escapeTravel(first.id)+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();openTripDetail(\''+escapeTravel(first.id)+'\')}"><div class="trip-photos photos-'+displayedPhotos.length+'">'+imgs+'</div><h2>'+escapeTravel(place)+'</h2>'+
      (first.activity?'<div class="trip-activity">'+escapeTravel(first.activity)+'</div>':'')+
      (description?'<p>'+escapeTravel(description)+'</p>':'')+
      '<div class="date">'+start+(end?(' → '+end):'')+' · '+trips.length+' 条记录</div>'+
      '<span class="trip-status">'+escapeTravel(status.label)+'</span>'+
      '<div class="trip-actions"><button onclick="event.stopPropagation();openTripEditor(\''+escapeTravel(first.id)+'\')">编辑旅程</button>'+(local?'<button class="danger" onclick="event.stopPropagation();removeTrip(\''+escapeTravel(first.id)+'\')">删除</button>':'')+'</div>'+
      '</article>';
  }).join('');
}
function getAllTrips(){
  const localTrips = JSON.parse(localStorage.getItem('cozy_trips') || '[]');
  const coreTrips = (CORE.travel && CORE.travel.history) || [];
  const seen=new Set();
  return localTrips.concat(coreTrips).filter(t=>{const key=String(t.id||getTripKey(t));if(seen.has(key))return false;seen.add(key);return true;}).map(t=>Object.assign({_key:getTripKey(t)}, t)).sort((a,b)=>String(b.start||b.date||'').localeCompare(String(a.start||a.date||'')));
}
function getTripKey(t){
  return String(t.id || [t.place || '未命名地点',t.start || t.date || '',t.end || ''].join('|'));
}
function travelAsset(file){const value=String(file||'');return /^(?:https?:|data:|blob:|\/|\.\.\/)/.test(value)?value:'../'+value.replace(/^\.\//,'');}
function localTrips(){return JSON.parse(localStorage.getItem('cozy_trips')||'[]');}
function isLocalTrip(id){return localTrips().some(t=>String(t.id)===String(id));}
function tripStatus(trip){
  const today=localCalendarDate(),start=trip.start||trip.date||'',end=trip.end||'';
  if(trip.status==='completed'||(end&&end<=today))return {key:'completed',label:'已回家'};
  if(trip.date&&!trip.start&&!trip.status)return {key:'completed',label:'已回家'};
  if(trip.status==='away'||(start&&start<=today&&!end))return {key:'away',label:'旅行中'};
  return {key:'planned',label:'计划中'};
}
function getReflections(){
  return JSON.parse(localStorage.getItem('cozy_trip_reflections') || '{}');
}
function reflectionPieces(data){if(!data)return[];if(Array.isArray(data.entries)&&data.entries.length)return data.entries.map(item=>String(item.text||'').trim()).filter(Boolean);return data.text?[String(data.text).trim()]:[];}
function combinedPlaceReflection(trips,reflections=getReflections()){
  const summaries=trips.map(trip=>reflections[trip._key]).filter(Boolean).map(item=>String(item.summary||item.text||'').trim()).filter(Boolean);
  return Array.from(new Set(summaries)).join(' ').slice(0,260);
}
function tripCardDescription(trip,insight){const saved=String(trip.summary||trip.line||'').trim();if(insight)return insight;if(!saved||/^这趟旅行先记下地点和时间/.test(saved))return'';return saved;}
function travelRecentMemoryIds(){try{return JSON.parse(localStorage.getItem('cozy_travel_recent_memory_ids')||'[]').slice(0,6);}catch(error){return[];}}
function travelRecentReplyStyles(){try{return JSON.parse(localStorage.getItem('cozy_travel_reply_styles')||'[]').slice(0,4);}catch(error){return[];}}
function rememberTravelResponse(data){
  const ids=Array.isArray(data?.memory_usage?.selected_ids)?data.memory_usage.selected_ids:[];
  if(ids.length)localStorage.setItem('cozy_travel_recent_memory_ids',JSON.stringify(Array.from(new Set(ids.concat(travelRecentMemoryIds()))).slice(0,6)));
  const style=String(data?.result?.response_style||'').trim();
  if(style)localStorage.setItem('cozy_travel_reply_styles',JSON.stringify([style].concat(travelRecentReplyStyles().filter(value=>value!==style)).slice(0,4)));
}
function reflectionResultText(reply,summary,saved=false){
  const parts=[];
  if(reply)parts.push('阿栗：'+reply);
  if(summary)parts.push((saved?'已保存摘要：':'整理摘要：')+summary);
  return parts.join('\n\n')||'这段旅行还没有感悟。';
}
let loadedReflectionTripKey=null;
function renderReflectionOptions(trips){
  const select = document.getElementById('reflection-trip');
  if(!select) return;
  if(!trips.length){
    select.innerHTML = '<option value="">还没有旅行</option>';
    select.disabled = true;
    return;
  }
  const current = select.value;
  select.disabled = false;
  select.innerHTML = '<option value="">选择一段旅行</option>'+trips.map(t=>{
    const date = (t.start || t.date || '未写日期') + (t.end ? ' → '+t.end : '');
    return '<option value="'+escapeTravel(t._key)+'">'+escapeTravel((t.place || '未命名地点')+' · '+date)+'</option>';
  }).join('');
  select.value = current && trips.some(t=>t._key === current) ? current : '';
  loadTripReflection();
}
function loadTripReflection(){
  const select = document.getElementById('reflection-trip');
  const textarea = document.getElementById('reflection-text');
  const ai = document.getElementById('reflection-ai');
  if(!select || !textarea || !ai) return;
  if(reflectionSummaryBusy)return;
  if(select.value===loadedReflectionTripKey)return;
  loadedReflectionTripKey=select.value;
  if(!select.value){
    textarea.value = '';
    ai.dataset.summary = '';
    ai.dataset.reply = '';
    ai.textContent = '';
    return;
  }
  const data = getReflections()[select.value];
  textarea.value = '';
  ai.dataset.summary = data&&data.summary ? data.summary : '';
  ai.dataset.reply = data&&data.companionReply ? data.companionReply : '';
  ai.textContent = data ? reflectionResultText(data.companionReply||'',data.summary || data.text || '',true) : '';
}
function resetReflectionInput(){
  clearTimeout(reflectionTimer);
  if(reflectionVoice?.isActive())reflectionVoice.stop();
  const textarea=document.getElementById('reflection-text');
  if(textarea)textarea.value='';
}
let reflectionVoice=null;
function clearReflectionDraft(){
  clearTimeout(reflectionTimer);
  if(reflectionVoice?.isActive())reflectionVoice.stop();
  const select=document.getElementById('reflection-trip');
  const textarea=document.getElementById('reflection-text');
  const ai=document.getElementById('reflection-ai');
  if(select)select.value='';
  loadedReflectionTripKey='';
  if(textarea)textarea.value='';
  if(ai){ai.dataset.summary='';ai.dataset.reply='';ai.textContent='';}
  textarea?.focus();
}
function setReflectionVoiceState(state,message){
  const textarea = document.getElementById('reflection-text');
  const ai = document.getElementById('reflection-ai');
  const button=document.querySelector('.mic-btn');
  const active=['starting','listening','stopping'].includes(state);
  button?.classList.toggle('active',active);button?.setAttribute('aria-pressed',String(active));button?.setAttribute('aria-label',active?'停止语音输入':'语音修改');
  if(ai)ai.textContent=message||(state==='idle'&&textarea?.value.trim()?'语音已经实时写进输入框，保存时会自动总结。':'');
}
function startReflectionVoice(){
  const textarea=document.getElementById('reflection-text');
  if(!textarea)return;
  if(!window.CozyButler?.createDictation){setReflectionVoiceState('error','语音组件正在准备，请稍后再试。');return;}
  if(!reflectionVoice)reflectionVoice=CozyButler.createDictation({input:textarea,onState:setReflectionVoiceState,onTranscript:()=>queueReflectionSummary()});
  reflectionVoice.toggle();
}
let reflectionSummaryBusy=false;
let reflectionSaveBusy=false;
async function summarizeReflection(options={}){
  const select = document.getElementById('reflection-trip');
  const textarea = document.getElementById('reflection-text');
  const ai = document.getElementById('reflection-ai');
  if(!select || !textarea || !ai) return null;
  const text = textarea.value.trim();
  if(!select.value){ ai.textContent = '先选择一段旅行。'; return null; }
  if(!text){ ai.textContent = '先写一点或说一点感悟，阿栗再帮你总结。'; return null; }
  if(reflectionSummaryBusy)return null;
  const button=document.getElementById('reflection-summary-button');
  clearTimeout(reflectionTimer);
  reflectionSummaryBusy=true;
  if(button){button.disabled=true;button.textContent='总结中…';button.setAttribute('aria-busy','true');}
  ai.textContent = '阿栗正在总结这段旅行感悟…';
  try{
    const trip=getSelectedTrip();
    const data=window.CozyButler?await CozyButler.api('/api/room',{room:'travel',message:text,context:{place:trip.place,start:trip.start||trip.date,end:trip.end,trip_id:select.value,commit:!!options.commit,latest_entry:String(options.latestEntry||text),memory_event_id:String(options.memoryEventId||''),recent_memory_ids:travelRecentMemoryIds(),recent_reply_styles:travelRecentReplyStyles()}}):null;
    const summary=String(data?.result?.summary||buildReflectionSummary(text,trip));
    const reply=String(data?.result?.reply||'');
    ai.dataset.summary=summary;ai.dataset.reply=reply;ai.textContent=reflectionResultText(reply,summary,false);rememberTravelResponse(data);
    return {data,summary,reply};
  }catch(error){const summary=buildReflectionSummary(text,getSelectedTrip());ai.dataset.summary=summary;ai.dataset.reply='';ai.textContent=reflectionResultText('',summary,false)+'\n\n阿栗暂时没连上模型，摘要先保存在本机。';return {data:null,summary,reply:''};}
  finally{reflectionSummaryBusy=false;if(button){button.disabled=false;button.textContent='阿栗总结';button.removeAttribute('aria-busy');}}
}
let reflectionTimer = null;
function queueReflectionSummary(){
  clearTimeout(reflectionTimer);
  reflectionTimer = setTimeout(()=>{
    if(reflectionSummaryBusy)return;
    const text = document.getElementById('reflection-text');
    const ai = document.getElementById('reflection-ai');
    if(text && text.value.trim() && ai) ai.textContent='写好了可以点“阿栗总结”，再按你的想法继续修改。';
  }, 650);
}
async function saveReflection(){
  const select = document.getElementById('reflection-trip');
  const textarea = document.getElementById('reflection-text');
  const ai = document.getElementById('reflection-ai');
  if(!select || !textarea || !ai || reflectionSaveBusy) return;
  const text = textarea.value.trim();
  if(!select.value || !text){ ai.textContent = '先选择旅行，并写下一点感悟。'; return; }
  const saveButton=document.getElementById('reflection-save-button');
  reflectionSaveBusy=true;if(saveButton){saveButton.disabled=true;saveButton.textContent='保存中…';saveButton.setAttribute('aria-busy','true');}
  ai.textContent='阿栗正在总结并保存这段感悟…';
  try{
  const tripKey=select.value;
  const all = getReflections();
  const previous=all[tripKey]||{},createdAt=new Date().toISOString(),memoryEventId='travel_reflection_'+tripKey.replace(/[^a-zA-Z0-9_-]/g,'_')+'_'+Date.now(),entries=[...(previous.entries||reflectionPieces(previous).map(value=>({text:value,createdAt:previous.updatedAt||''}))),{id:memoryEventId,text,createdAt}].slice(-30);
  const combined=entries.map(item=>item.text).join('\n');
  textarea.value=combined;
  const generated=await summarizeReflection({commit:true,latestEntry:text,memoryEventId});
  const summary = ai.dataset.summary || buildReflectionSummary(combined, getSelectedTrip());
  const companionReply=String(ai.dataset.reply||'');
  all[tripKey] = {text:combined,entries,summary,companionReply,updatedAt:createdAt};
  localStorage.setItem('cozy_trip_reflections', JSON.stringify(all));
  try{
    const synced=await CozyButler.api('/api/local-state',{changes:{cozy_trip_reflections:{type:'object',upserts:{[tripKey]:all[tripKey]},deleted:[],revive:[tripKey]}}},20000);
    const cloudReflections=synced.state&&synced.state.values&&synced.state.values.cozy_trip_reflections;
    if(cloudReflections)localStorage.setItem('cozy_trip_reflections',JSON.stringify(cloudReflections));
  }catch(error){ai.textContent='感悟没有保存到云端：'+error.message;return;}
  if(window.CozyMemory&&!generated?.data?.memory_event){
    CozyMemory.add({
      id:memoryEventId,
      source:'travel',
      type:'travel_reflection',
      layer:'long',
      scope:'travel_only',
      room_id:tripKey,
      weight:2,
      content:text,
      summary:'旅行感悟：'+summary
    });
  }
  textarea.value='';
  ai.dataset.summary=summary;
  ai.dataset.reply=companionReply;
  ai.textContent = reflectionResultText(companionReply,summary,true);
  render();
  if(matchMedia('(max-width:760px)').matches)showMobileTravelView('records');
  }finally{reflectionSaveBusy=false;if(saveButton){saveButton.disabled=false;saveButton.textContent='保存感悟';saveButton.removeAttribute('aria-busy');}}
}
function getSelectedTrip(){
  const select = document.getElementById('reflection-trip');
  const trips = getAllTrips();
  return trips.find(t=>t._key === (select && select.value)) || {};
}
function buildReflectionSummary(text, trip){
  const clean = text.replace(/\s+/g,' ').trim();
  const core = clean.length > 72 ? clean.slice(0,72)+'...' : clean;
  const place = trip.place || '这段旅行';
  return place+'：'+core;
}
function escapeTravel(str){
  return String(str || '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
let editingTripId='';
function ensureLocalTrip(id){
  const trips=localTrips();let trip=trips.find(item=>String(item.id)===String(id));
  if(trip)return {trips,trip};
  const source=getAllTrips().find(item=>String(item.id)===String(id));
  if(!source)return {trips,trip:null};
  trip=JSON.parse(JSON.stringify(source));delete trip._key;trips.unshift(trip);return {trips,trip};
}
function tripPhotoFiles(trip){return (trip.photos&&trip.photos.length?trip.photos:[trip.file]).filter(Boolean);}
function openTripDetail(id){
  const selected=getAllTrips().find(item=>String(item.id)===String(id));if(!selected)return;
  const trips=getAllTrips().filter(item=>item.place===selected.place).slice(0,12),reflections=getReflections();
  const photos=trips.flatMap(trip=>tripPhotoFiles(trip)).slice(0,12);
  const gallery=(photos.length?photos:['../assets/travel/travel_postcard.webp']).map(file=>'<img src="'+travelAsset(file)+'" alt="'+escapeTravel(selected.place||'旅行照片')+'">').join('');
  const records=trips.map(trip=>{const description=tripCardDescription(trip,'');return '<div class="trip-detail-record"><b>'+escapeTravel((trip.start||trip.date||'未写日期')+(trip.end?' → '+trip.end:''))+'</b>'+(trip.activity?'<span class="trip-activity">'+escapeTravel(trip.activity)+'</span>':'')+(description?'<span>'+escapeTravel(description)+'</span>':'')+'</div>';}).join('');
  const insight=combinedPlaceReflection(trips,reflections);
  document.getElementById('trip-detail-card').innerHTML='<header class="trip-detail-head"><div><h2>'+escapeTravel(selected.place||'一段旅行')+'</h2><p>'+trips.length+' 条旅行记录 · '+photos.length+' 张照片</p></div><button class="trip-editor-close" type="button" onclick="closeTripDetail()" aria-label="返回旅行">← 返回旅行</button></header><div class="trip-detail-gallery">'+gallery+'</div><div class="trip-detail-copy"><section class="trip-detail-section"><h3>旅行记录</h3>'+records+'</section><section class="trip-detail-section"><h3>旅行感悟</h3><p>'+escapeTravel(insight||'这段旅行还没有留下感悟。')+'</p></section></div>';
  document.getElementById('trip-detail').classList.add('show');
}
function closeTripDetail(){document.getElementById('trip-detail').classList.remove('show');}
function openTripEditor(id){
  const trip=getAllTrips().find(item=>String(item.id)===String(id));if(!trip)return;
  editingTripId=String(id);document.getElementById('edit-trip-place').value=trip.place||'';document.getElementById('edit-trip-activity').value=trip.activity||'';document.getElementById('edit-trip-start').value=trip.start||trip.date||'';document.getElementById('edit-trip-end').value=trip.end||'';document.getElementById('edit-trip-summary').value=tripCardDescription(trip,'');renderEditTripPhotos(trip);document.getElementById('trip-editor').classList.add('show');
}
function closeTripEditor(){document.getElementById('trip-editor').classList.remove('show');editingTripId='';}
function renderEditTripPhotos(trip){
  const photos=tripPhotoFiles(trip);document.getElementById('edit-trip-photos').innerHTML=photos.length?photos.map((file,index)=>'<div class="trip-editor-photo"><img src="'+travelAsset(file)+'" alt="旅行照片"><button type="button" onclick="removeTripPhoto('+index+')" aria-label="删除照片">×</button></div>').join(''):'<p class="trip-editor-empty">暂无照片</p>';
}
async function removeTripPhoto(index){
  const state=ensureLocalTrip(editingTripId);if(!state.trip)return;const photo=tripPhotoFiles(state.trip)[index];if(!photo)return;
  const status=document.getElementById('travel-status');status.textContent='正在删除照片…';
  try{
    const data=await CozyButler.api('/api/travel/photo/delete',{trip_id:editingTripId,file:photo});
    const values=data.local_state&&data.local_state.values||{};if(values.cozy_trips)localStorage.setItem('cozy_trips',JSON.stringify(values.cozy_trips));CORE=data.estate_state||CORE;
    const trip=getAllTrips().find(item=>String(item.id)===String(editingTripId));if(trip)renderEditTripPhotos(trip);status.textContent=data.deleted_file_count?'照片和 R2 原图已删除。':'照片已从旅程移除。';render();
  }catch(error){status.textContent='照片删除失败：'+error.message;}
}
async function summarizeTripDescription(text,trip){
  const clean=String(text||'').trim();if(!clean)return '';
  try{
    const data=window.CozyButler?await CozyButler.api('/api/room',{room:'travel',message:clean,context:{intent:'summarize_trip_description',place:trip.place,start:trip.start||trip.date,end:trip.end,requirement:'忠于原文，把零散记录整理成80字以内的旅行描述，不添加感悟或虚构经历'}}):null;
    return data&&data.result&&data.result.summary?data.result.summary:clean;
  }catch(error){return clean.length>100?clean.slice(0,100)+'…':clean;}
}
async function saveTripEdits(){
  const state=ensureLocalTrip(editingTripId);if(!state.trip)return;const place=document.getElementById('edit-trip-place').value.trim(),activity=document.getElementById('edit-trip-activity').value.trim(),start=document.getElementById('edit-trip-start').value,end=document.getElementById('edit-trip-end').value,summary=document.getElementById('edit-trip-summary').value.trim();
  if(!place){document.getElementById('travel-status').textContent='地点不能为空。';return;}if(start&&end&&end<start){document.getElementById('travel-status').textContent='回家日期不能早于出发日期。';return;}
  document.getElementById('travel-status').textContent='阿栗正在整理旅行描述…';
  const concise=await summarizeTripDescription(summary,Object.assign({},state.trip,{place,start,end}));
  Object.assign(state.trip,{place,activity,start,end,summary:concise,line:concise,rawDescription:summary,status:end&&end<=localCalendarDate()?'completed':(start&&start<=localCalendarDate()?'away':'planned'),updatedAt:new Date().toISOString()});localStorage.setItem('cozy_trips',JSON.stringify(state.trips));await window.CozyButler?.persistLocal(['cozy_trips']);document.getElementById('travel-status').textContent='旅程内容已更新。';closeTripEditor();render();
}
let newTripPhotos=[],newTripPhotoUrls=[];
function pickNewTripPhotos(){const input=document.getElementById('new-trip-photo-input');input.value='';input.click();}
function clearNewTripPhotoPreview(){newTripPhotoUrls.forEach(url=>URL.revokeObjectURL(url));newTripPhotoUrls=[];const preview=document.getElementById('new-trip-photo-preview');if(preview)preview.innerHTML='';}
function renderNewTripPhotoPreview(){document.getElementById('new-trip-photo-count').textContent=newTripPhotos.length?'已选择 '+newTripPhotos.length+' 张':'未选择照片';document.getElementById('new-trip-photo-preview').innerHTML=newTripPhotoUrls.map((url,index)=>'<div class="new-trip-photo-item"><img src="'+url+'" alt="待上传旅行照片 '+(index+1)+'"><button class="new-trip-photo-remove" type="button" aria-label="移除第 '+(index+1)+' 张照片" title="移除照片" onclick="removeNewTripPhoto('+index+')">×</button></div>').join('');}
function setNewTripPhotos(files){clearNewTripPhotoPreview();newTripPhotos=Array.from(files||[]).slice(0,6);newTripPhotoUrls=newTripPhotos.map(file=>URL.createObjectURL(file));renderNewTripPhotoPreview();}
function removeNewTripPhoto(index){if(index<0||index>=newTripPhotos.length)return;URL.revokeObjectURL(newTripPhotoUrls[index]);newTripPhotos.splice(index,1);newTripPhotoUrls.splice(index,1);renderNewTripPhotoPreview();}
async function saveTrip(){
  const place = document.getElementById('trip-place').value.trim();
  const activity = document.getElementById('trip-activity').value.trim();
  const start = document.getElementById('trip-start').value;
  const end = document.getElementById('trip-end').value;
  const status=document.getElementById('travel-status');
  if(!place){status.textContent='先写下要去的地方。';return;}
  if(start&&end&&end<start){status.textContent='回家日期不能早于出发日期。';return;}
  const trips = localTrips();
  const today=localCalendarDate();
  const state=end&&end<=today?'completed':(start&&start<=today?'away':'planned');
  const tripId='trip_'+Date.now();
  trips.unshift({id:tripId,place,activity,start,end,status:state,line:'',summary:'',photos:[],updatedAt:new Date().toISOString()});
  localStorage.setItem('cozy_trips', JSON.stringify(trips.slice(0,100)));
  status.textContent=newTripPhotos.length?'正在保存旅程并上传照片…':'正在保存旅程…';
  await window.CozyButler?.persistLocal(['cozy_trips']);
  if(window.CozyMemory){
    CozyMemory.add({
      source:'travel',
      type:'trip',
      layer:'short',
      weight:1,
      content:[place,activity,start,end].filter(Boolean).join(' '),
      summary:'旅行记录：'+place+(activity?'，'+activity:'')+'。'
    });
  }
  document.getElementById('trip-place').value = '';
  document.getElementById('trip-activity').value = '';
  document.getElementById('trip-start').value = '';
  document.getElementById('trip-end').value = '';
  if(newTripPhotos.length){uploadTripId=tripId;const files=newTripPhotos.slice();newTripPhotos=[];document.getElementById('new-trip-photo-count').textContent='未选择照片';await uploadTripPhotos(files);clearNewTripPhotoPreview();}else status.textContent='旅程已经记下。';
  render();
  if(matchMedia('(max-width:760px)').matches)showMobileTravelView('records');
}
window.addEventListener('beforeunload',clearNewTripPhotoPreview);
function finishTrip(id){
  const trips=localTrips(),trip=trips.find(t=>String(t.id)===String(id));if(!trip)return;
  trip.end=localCalendarDate();trip.status='completed';trip.updatedAt=new Date().toISOString();localStorage.setItem('cozy_trips',JSON.stringify(trips));window.CozyButler?.persistLocal(['cozy_trips']);
  document.getElementById('travel-status').textContent='欢迎回家，这段旅程已经收好。';render();
}
async function removeTrip(id){
  if(!confirm('确定删除这段旅程吗？旅程记录、感悟和已上传的原图都会一起删除。'))return;
  const status=document.getElementById('travel-status');status.textContent='正在删除旅程和原图…';
  try{
    const data=await CozyButler.api('/api/travel/delete',{trip_id:id});
    const values=data.local_state&&data.local_state.values||{};localStorage.setItem('cozy_trips',JSON.stringify(values.cozy_trips||[]));localStorage.setItem('cozy_trip_reflections',JSON.stringify(values.cozy_trip_reflections||{}));if(values.cozy_photo_albums)localStorage.setItem('cozy_photo_albums',JSON.stringify(values.cozy_photo_albums));CORE=data.estate_state||CORE;
    status.textContent='旅程已删除，清理了 '+Number(data.deleted_file_count||0)+' 张 R2 原图。';render();
  }catch(error){status.textContent='旅程删除失败：'+error.message;}
}
let uploadTripId='';
function pickTripPhotos(id){const state=ensureLocalTrip(id);if(state.trip&&!isLocalTrip(id)){localStorage.setItem('cozy_trips',JSON.stringify(state.trips));window.CozyButler?.persistLocal(['cozy_trips']);}uploadTripId=String(id);const input=document.getElementById('trip-photo-input');input.value='';input.click();}
function travelFileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('照片读取失败'));reader.readAsDataURL(file);});}
async function uploadTripPhotos(files){
  const status=document.getElementById('travel-status');if(!files||!files.length||!uploadTripId)return;
  status.textContent='正在把 '+files.length+' 张照片放进旅程…';
  try{
    for(const file of Array.from(files).slice(0,6)){
      const data=await CozyButler.api('/api/media/upload',{kind:'travel',trip_id:uploadTripId,name:file.name,title:file.name.replace(/\.[^.]+$/,''),data_url:await travelFileData(file)},120000);
      const values=data.local_state&&data.local_state.values||{};
      if(values.cozy_trips)localStorage.setItem('cozy_trips',JSON.stringify(values.cozy_trips));
      CORE=data.estate_state||CORE;
    }
    status.textContent='照片已经放进这段旅程。';render();if(editingTripId){const trip=getAllTrips().find(item=>String(item.id)===String(editingTripId));if(trip)renderEditTripPhotos(trip);}uploadTripId='';
  }catch(error){status.textContent='照片没有放进去：'+error.message;}
}
window.addEventListener('cozy:state-synced',render);
window.addEventListener('beforeunload',()=>{if(reflectionVoice?.isActive())reflectionVoice.stop();});
window.addEventListener('pageshow',()=>setTimeout(resetReflectionInput,0));
load();
</script>
