<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#75604a" />
<link rel="manifest" href="../manifest.webmanifest" />
<title>智慧果园</title>
<script src="../core/runtime-config.js"></script>
<script src="../core/runtime.js"></script>
<script src="../core/data.js"></script>
<script src="../core/memory.js"></script>
<script src="../logger.js"></script>
<script src="../core/pwa.js" defer></script>
<script src="../core/butler_widget.js" defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;overflow:hidden;color:#fff4d8;
     background:#314323}
  .orchard-stage{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate}
  .orchard-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-3}
  .orchard-stage:before{content:"";position:absolute;inset:0;background:
     linear-gradient(180deg,rgba(30,42,20,.04),rgba(30,42,20,.2) 58%,rgba(30,42,20,.38));z-index:-2}
  .orchard-stage:after{content:"";position:absolute;inset:0;background:
     radial-gradient(circle at 50% 44%,rgba(255,238,178,0) 0 42%,rgba(28,33,18,.28) 100%);z-index:-1}
  .back{position:fixed;left:18px;top:16px;z-index:3;color:#fff5d8;text-decoration:none;font-size:14px;
     background:rgba(45,31,16,.46);border:1px solid rgba(255,246,214,.24);padding:7px 13px;
     border-radius:999px;backdrop-filter:blur(6px);box-shadow:0 8px 20px rgba(24,18,10,.18)}
  .caption{position:absolute;left:22px;bottom:20px;max-width:420px;color:#fff8e8;
     background:rgba(45,31,16,.34);border:1px solid rgba(255,246,214,.2);
     padding:14px 16px;box-shadow:0 12px 28px rgba(24,18,10,.2);backdrop-filter:blur(6px)}
  .caption h1{font-size:18px;margin-bottom:4px}
  .caption p{font-size:13px;line-height:1.6;color:rgba(255,248,232,.9)}
  .seed-btn{position:fixed;right:22px;bottom:22px;z-index:3;border:1px solid rgba(255,246,214,.26);
     border-radius:999px;background:rgba(45,31,16,.48);color:#fff5d8;padding:11px 18px;
     font:inherit;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 10px 24px rgba(24,18,10,.2)}
  .seed-panel{position:fixed;right:22px;bottom:76px;width:min(420px,calc(100vw - 44px));z-index:4;
     background:rgba(255,250,238,.9);color:#4d3828;border-radius:24px;padding:18px;
     box-shadow:0 24px 70px rgba(28,18,8,.28);display:none;max-height:min(78vh,720px);overflow:auto}
  .seed-panel.show{display:block}
  .seed-panel h2{font-size:17px;margin-bottom:8px}
  .seed-panel p{font-size:13px;line-height:1.65;color:#6c5942;margin-bottom:10px}
  .seed-input-wrap{position:relative}
  .seed-panel textarea{width:100%;min-height:110px;border:1px solid #dec4a7;border-radius:16px;
     padding:12px 54px 12px 12px;font:inherit;resize:vertical;background:#fffdf8;color:#4d3828;outline:none}
  .seed-panel textarea:focus{border-color:#a5ad73;box-shadow:0 0 0 3px rgba(127,139,84,.12)}
  .seed-mic{position:absolute;right:11px;bottom:12px;width:34px;height:34px;display:grid;place-items:center;
     margin:0!important;padding:0!important;border:1px solid rgba(101,112,65,.2)!important;border-radius:50%!important;
     background:rgba(127,139,84,.1)!important;color:#687442!important;transition:.18s ease}
  .seed-mic:hover{background:rgba(127,139,84,.18)!important}
  .seed-mic.active{background:#7f8b54!important;color:#fff!important;box-shadow:0 0 0 5px rgba(127,139,84,.14)}
  .seed-mic:disabled{opacity:.45;cursor:default}
  .seed-mic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .seed-voice-status{min-height:17px;padding:4px 3px 0;font-size:10px;line-height:1.4;color:#88775e}
  .seed-panel button{border:0;border-radius:999px;background:#7f8b54;color:#fff8e8;padding:9px 15px;margin-top:10px;cursor:pointer}
  .growth-actions{display:flex;gap:8px;flex-wrap:wrap}.growth-actions button{flex:1}.growth-actions button:disabled{opacity:.5;cursor:default}
  .growth-actions .soft{background:#c7a96e;color:#fffdf4}
  .orchard-reply{display:none;margin-top:12px;border-radius:18px;background:rgba(255,255,255,.68);
     border:1px solid rgba(126,98,58,.12);padding:12px 14px;color:#5a4630}
  .orchard-reply.show{display:block}
  .orchard-reply h3{font-size:14px;margin-bottom:6px;color:#5b6b36}
  .orchard-reply p{margin:5px 0}
  .crystals{display:grid;gap:8px;margin-top:12px;max-height:220px;overflow:auto}
  .crystal{font-size:12px;border-radius:14px;background:#f2e8ca;color:#5f5734;padding:9px 10px;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
  .crystal small{display:block;color:#8b7b58;margin-top:3px}.crystal-actions{display:flex;gap:5px}.crystal-actions button{margin:0;padding:5px 8px;background:#fffaf0;color:#6a7448;border:1px solid rgba(95,87,52,.12);font-size:10px}.crystal.resolved{opacity:.72;background:#e2e5c9}
  .knowledge-library{margin-top:15px;padding-top:13px;border-top:1px solid rgba(94,75,47,.14)}
  .knowledge-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.knowledge-head h3{font-size:14px;color:#5b6b36}.knowledge-head span{font-size:10px;color:#8b7b58}
  .knowledge-category{margin-top:10px;font-size:10px;color:#8c744e}.knowledge-topic{border-bottom:1px solid rgba(94,75,47,.1)}
  .knowledge-topic summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 1px;cursor:pointer}.knowledge-topic summary::-webkit-details-marker{display:none}
  .knowledge-topic summary strong{min-width:0;flex:1;font-size:12px;color:#55452f}.knowledge-topic summary small{font-size:9px;color:#9a896d}.knowledge-topic summary:after{content:"+";color:#8a9561}.knowledge-topic[open] summary:after{content:"−"}
  .knowledge-body{padding:0 2px 10px}.knowledge-body>p{font-size:11px;line-height:1.65;color:#6c5942;margin:0 0 7px}
  .knowledge-entities{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}.knowledge-entities span{font-size:9px;padding:3px 6px;border-radius:999px;background:#eee1be;color:#776541}
  .knowledge-entry{padding:7px 0;border-top:1px dashed rgba(94,75,47,.11)}.knowledge-entry b{display:block;font-size:10px;color:#5d6c39;margin-bottom:3px}.knowledge-entry p{font-size:10px;line-height:1.55;color:#76634a;margin:0}
</style>
</head>
<body>
<main class="orchard-stage">
  <img class="orchard-bg" id="orchard-bg" src="../assets/plants/orchard_summer.jpg" alt="" />
  <a class="back" href="../index.html">← 回小院</a>
  <section class="caption">
    <h1>智慧果园</h1>
    <p id="season-line">一块田一块田，慢慢种想法。今天只挑一小块地，把一个模糊念头放进去。</p>
  </section>
  <button class="seed-btn" onclick="toggleSeedPanel()">成长田</button>
  <section class="seed-panel" id="seed-panel">
    <h2>成长田</h2>
    <p>把今天的困惑放进土里，先听一声回响，再让答案慢慢长成自己的方向。</p>
    <div class="seed-input-wrap">
      <textarea id="seed-input" placeholder="比如：我最近想往 AI 产品走，但不知道该补技术还是补作品集……"></textarea>
      <button class="seed-mic" id="seed-mic" type="button" aria-label="语音输入" title="语音输入" aria-pressed="false" onclick="toggleOrchardVoice()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line><line x1="8" x2="16" y1="22" y2="22"></line></svg>
      </button>
    </div>
    <div class="seed-voice-status" id="seed-voice-status" aria-live="polite"></div>
    <div class="growth-actions">
      <button id="orchard-plant" onclick="plantSeed()">问田播种</button>
    </div>
    <div class="orchard-reply" id="orchard-reply"></div>
    <div class="crystals" id="crystals"></div>
    <section class="knowledge-library">
      <div class="knowledge-head"><h3>成长知识专题</h3><span id="knowledge-count"></span></div>
      <div id="knowledge-topics"></div>
    </section>
  </section>
</main>
<script>
  function localCalendarDate(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  const seasonMap = [
    {name:'冬', file:'orchard_winter.jpg', line:'冬天把想法盖进雪里，先保温，不急着发芽。'},
    {name:'冬', file:'orchard_winter.jpg', line:'冬天把想法盖进雪里，先保温，不急着发芽。'},
    {name:'春', file:'orchard_spring.jpg', line:'春天适合播种，把小念头一格一格放进土里。'},
    {name:'春', file:'orchard_spring.jpg', line:'春天适合播种，把小念头一格一格放进土里。'},
    {name:'春', file:'orchard_spring.jpg', line:'春天适合播种，把小念头一格一格放进土里。'},
    {name:'夏', file:'orchard_summer.jpg', line:'夏天光照很足，适合把正在长大的计划多浇一点水。'},
    {name:'夏', file:'orchard_summer.jpg', line:'夏天光照很足，适合把正在长大的计划多浇一点水。'},
    {name:'夏', file:'orchard_summer.jpg', line:'夏天光照很足，适合把正在长大的计划多浇一点水。'},
    {name:'秋', file:'orchard_autumn.jpg', line:'秋天适合收成，也适合把经验晒干、收进仓库。'},
    {name:'秋', file:'orchard_autumn.jpg', line:'秋天适合收成，也适合把经验晒干、收进仓库。'},
    {name:'秋', file:'orchard_autumn.jpg', line:'秋天适合收成，也适合把经验晒干、收进仓库。'},
    {name:'冬', file:'orchard_winter.jpg', line:'冬天把想法盖进雪里，先保温，不急着发芽。'}
  ];
  const season = seasonMap[new Date().getMonth()];
  document.getElementById('orchard-bg').src = '../assets/plants/' + season.file;
  document.querySelector('.caption h1').textContent = season.name + '日田园';
  document.getElementById('season-line').textContent = season.line;

  function getSeeds(){
    return JSON.parse(localStorage.getItem('cozy_orchard_seeds') || '[]');
  }
  function getKnowledgeTopics(){
    try{const value=JSON.parse(localStorage.getItem('cozy_orchard_topics')||'[]');return Array.isArray(value)?value:[];}catch(error){return [];}
  }
  function renderKnowledgeTopics(){
    const topics=getKnowledgeTopics().sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));
    document.getElementById('knowledge-count').textContent=topics.length?topics.length+' 个专题':'';
    if(!topics.length){document.getElementById('knowledge-topics').innerHTML='<div class="empty">还没有知识专题</div>';return;}
    const groups={};topics.forEach(topic=>{const category=topic.category||'其他';(groups[category]||(groups[category]=[])).push(topic);});
    document.getElementById('knowledge-topics').innerHTML=Object.entries(groups).map(([category,items])=>'<section><div class="knowledge-category">'+escapeOrchard(category)+'</div>'+items.map(topic=>{
      const entries=Array.isArray(topic.entries)?topic.entries:[];
      const entities=(topic.entities||[]).slice(0,8).map(value=>'<span>'+escapeOrchard(value)+'</span>').join('');
      const history=entries.slice(0,6).map(entry=>'<article class="knowledge-entry"><b>'+escapeOrchard(entry.question||'一次更新')+'</b><p>'+escapeOrchard(entry.answer||entry.insight||'')+'</p></article>').join('');
      return '<details class="knowledge-topic"><summary><strong>'+escapeOrchard(topic.title||'未命名专题')+'</strong><small>'+entries.length+' 次更新</small></summary><div class="knowledge-body"><p>'+escapeOrchard(topic.summary||'')+'</p>'+(entities?'<div class="knowledge-entities">'+entities+'</div>':'')+history+'</div></details>';
    }).join('')+'</section>').join('');
  }
  function renderCrystals(){
    const seeds = getSeeds();
    document.getElementById('crystals').innerHTML = seeds.length
      ? seeds.slice(0,20).map((seed,index)=>'<article class="crystal '+(seed.status==='resolved'?'resolved':'')+'"><div>'+escapeOrchard(seed.text)+'<small>'+(seed.status==='resolved'?'已收成':'生长中')+' · '+escapeOrchard(seed.date||'')+'</small></div><div class="crystal-actions">'+(seed.status==='resolved'?'':'<button onclick="continueSeed(\''+escapeOrchard(seed.id||String(index))+'\')">继续聊</button><button onclick="resolveSeed(\''+escapeOrchard(seed.id||String(index))+'\')">收成</button>')+'<button onclick="removeSeed(\''+escapeOrchard(seed.id||String(index))+'\')">移除</button></div></article>').join('')
      : '<article class="crystal">还没有种子</article>';
  }
  function toggleSeedPanel(){
    document.getElementById('seed-panel').classList.toggle('show');
    renderCrystals();
    renderKnowledgeTopics();
  }
  let orchardVoice = null;
  function setOrchardVoiceState(state,message){
    const active=['starting','listening','stopping'].includes(state);
    const mic=document.getElementById('seed-mic');
    mic.classList.toggle('active',active);
    mic.setAttribute('aria-pressed',String(active));
    mic.setAttribute('aria-label',active?'停止语音输入':'语音输入');
    mic.title=active?'停止语音输入':'语音输入';
    document.getElementById('seed-voice-status').textContent=message||'';
    document.getElementById('orchard-plant').disabled=active||orchardBusy;
    if(state==='idle'&&document.getElementById('seed-input').value.trim())document.getElementById('seed-input').focus();
  }
  function toggleOrchardVoice(){
    if(!window.CozyButler?.createDictation){setOrchardVoiceState('error','语音组件正在准备，请稍后再试');return;}
    if(!orchardVoice)orchardVoice=CozyButler.createDictation({
      input:document.getElementById('seed-input'),
      onState:setOrchardVoiceState
    });
    orchardVoice.toggle();
  }
  let orchardBusy = false;
  let orchardEditingSeedId = '';
  function mergeKnowledgeTopic(text,result){
    const payload=result.knowledge_topic&&typeof result.knowledge_topic==='object'?result.knowledge_topic:{};
    const topics=getKnowledgeTopics();
    const entities=Array.isArray(payload.entities)?payload.entities.map(value=>String(value).trim()).filter(Boolean):[];
    const normalize=value=>String(value||'').toLowerCase().replace(/[\s·・:：/\-]+/g,'');
    let topic=topics.find(item=>payload.match_id&&String(item.id)===String(payload.match_id));
    if(!topic&&payload.title)topic=topics.find(item=>normalize(item.title)===normalize(payload.title));
    if(!topic&&entities.length)topic=topics.find(item=>entities.filter(entity=>(item.entities||[]).some(old=>normalize(old)===normalize(entity))).length>=Math.min(2,entities.length));
    if(!topic){topic={id:'topic_'+Date.now(),title:payload.title||result.seed_summary||'成长探索',category:payload.category||'成长与方向',entities:[],summary:'',entries:[],createdAt:new Date().toISOString()};topics.unshift(topic);}
    topic.title=payload.title||topic.title;
    topic.category=payload.category||topic.category||'其他';
    topic.entities=Array.from(new Set([...(topic.entities||[]),...entities])).slice(0,20);
    topic.summary=payload.summary||topic.summary||result.key_insight||result.reply;
    topic.updatedAt=new Date().toISOString();
    topic.entries=Array.isArray(topic.entries)?topic.entries:[];
    const entry={id:'knowledge_'+Date.now(),question:text,answer:result.reply,insight:result.key_insight||'',nextStep:result.next_step||'',knowledgePoints:Array.isArray(payload.knowledge_points)?payload.knowledge_points.slice(0,8):[],date:localCalendarDate()};
    const duplicate=topic.entries.find(item=>normalize(item.question)===normalize(text));
    if(duplicate)Object.assign(duplicate,entry,{id:duplicate.id});else topic.entries.unshift(entry);
    topic.entries=topic.entries.slice(0,30);
    localStorage.setItem('cozy_orchard_topics',JSON.stringify(topics.slice(0,60)));
    window.CozyButler?.persistLocal(['cozy_orchard_topics']);
    renderKnowledgeTopics();
    return topic;
  }
  function persistSeed(text,result,topic){
    const input = document.getElementById('seed-input');
    const seeds = getSeeds();
    const existing=orchardEditingSeedId&&seeds.find(seed=>String(seed.id)===String(orchardEditingSeedId));
    const record={
      id:existing?.id||'seed_'+Date.now(),text:result.seed_summary||text,original:text,reply:result.reply,
      insight:result.key_insight||'',nextStep:result.next_step||'',date:existing?.date||localCalendarDate(),
      status:'growing',topicId:topic?.id||existing?.topicId||'',updatedAt:new Date().toISOString()
    };
    if(existing)Object.assign(existing,record);else seeds.unshift(record);
    localStorage.setItem('cozy_orchard_seeds', JSON.stringify(seeds.slice(0,50)));
    window.CozyButler?.persistLocal(['cozy_orchard_seeds']);
    if(window.CozyMemory){
      CozyMemory.add({
        source:'orchard',
        type:'growth_seed',
        layer:'long',
        weight:3,
        content:'成长主题：'+(result.seed_summary||text)+'\n关键判断：'+(result.key_insight||result.reply)+'\n下一步：'+(result.next_step||''),
        summary:'果园成长种子：'+String(result.seed_summary||text).slice(0,54)
      });
      CozyMemory.add({
        source:'orchard',type:'knowledge_interest',layer:'short',weight:2,
        content:'最近关注专题：'+(topic?.title||result.seed_summary||'成长探索')+'；本次提问：'+text,
        summary:'成长田关注：'+(topic?.title||result.seed_summary||'成长探索')+'（'+(topic?.category||'未分类')+'）'
      });
    }
    input.value = '';
    orchardEditingSeedId='';
    renderCrystals();
  }
  async function plantSeed(){
    if(orchardBusy||orchardVoice?.isActive())return;
    const input = document.getElementById('seed-input');
    const text = input.value.trim();
    const box = document.getElementById('orchard-reply');
    if(!text){
      box.className = 'orchard-reply show';
      box.innerHTML = '<h3>阿栗在田边</h3><p>先说出此刻最想弄清楚的一件事，不需要整理好再开口。</p>';
      return;
    }
    orchardBusy=true;
    document.getElementById('orchard-plant').disabled=true;
    box.className = 'orchard-reply show';
    box.innerHTML = '<h3>种子正在入土</h3><p>阿栗正在辨认这件事真正指向哪里……</p>';
    try{
      const compactTopics=getKnowledgeTopics().slice(0,20).map(topic=>({id:topic.id,title:topic.title,category:topic.category,entities:topic.entities||[],summary:topic.summary||'',recent_questions:(topic.entries||[]).slice(0,3).map(entry=>entry.question)}));
      const data = window.CozyButler ? await CozyButler.api('/api/room',{room:'orchard',message:text,context:{intent:'answer_plant_and_update_topic',recent_seeds:getSeeds().slice(0,8),knowledge_topics:compactTopics}}) : null;
      const fallback=buildOrchardResult(text);
      const result=data?.result?.reply?{...fallback,...data.result}:fallback;
      const topic=mergeKnowledgeTopic(text,result);persistSeed(text,result,topic);
      box.innerHTML = '<h3>田野签语</h3><p>'+escapeOrchard(result.reply)+'</p>'+(result.key_insight?'<p><strong>留下的判断：</strong>'+escapeOrchard(result.key_insight)+'</p>':'')+(result.next_step?'<p><strong>下一步：</strong>'+escapeOrchard(result.next_step)+'</p>':'')+'<p><strong>知识专题：</strong>'+escapeOrchard(topic.title)+'</p>';
    }catch(error){
      const result=buildOrchardResult(text);const topic=mergeKnowledgeTopic(text,result);persistSeed(text,result,topic);
      box.innerHTML='<h3>田野签语</h3><p>'+escapeOrchard(result.reply)+'</p><p><strong>下一步：</strong>'+escapeOrchard(result.next_step)+'</p>';
    }finally{
      orchardBusy=false;
      document.getElementById('orchard-plant').disabled=false;
    }
  }
  function buildOrchardResult(text){
    const t = text.length > 60 ? text.slice(0,60)+'...' : text;
    return {reply:'你现在缺的不是一个永久正确的答案，而是一条能产生新证据的路。把“'+t+'”缩小到一次真实尝试，方向会在行动留下的反馈里显形。',seed_summary:t,key_insight:'先用行动获得证据，再决定是否长期投入。',next_step:'设计一个 3 天内能完成的小实验，并记下结果。',knowledge_topic:{title:'成长探索',category:'成长与方向',entities:[],summary:'通过小实验把模糊困惑转化为可验证的成长方向。',knowledge_points:['先获得真实反馈，再决定长期投入。']}};
  }
  function escapeOrchard(str){
    return String(str || '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function seedById(id){const seeds=getSeeds();return {seeds,seed:seeds.find((item,index)=>String(item.id||index)===String(id))};}
  function continueSeed(id){const found=seedById(id);if(!found.seed)return;orchardEditingSeedId=String(found.seed.id||id);document.getElementById('seed-input').value=found.seed.original||found.seed.text;document.getElementById('orchard-reply').classList.remove('show');document.getElementById('seed-input').focus();}
  function resolveSeed(id){const found=seedById(id);if(!found.seed)return;found.seed.status='resolved';found.seed.resolvedAt=localCalendarDate();found.seed.updatedAt=new Date().toISOString();localStorage.setItem('cozy_orchard_seeds',JSON.stringify(found.seeds));window.CozyButler?.persistLocal(['cozy_orchard_seeds']);if(window.CozyMemory)CozyMemory.add({source:'orchard',type:'growth_harvest',layer:'long',weight:3,content:found.seed.text,summary:'果园收成：'+found.seed.text.slice(0,60)});renderCrystals();}
  function removeSeed(id){const found=seedById(id);if(!found.seed)return;localStorage.setItem('cozy_orchard_seeds',JSON.stringify(found.seeds.filter(item=>item!==found.seed)));window.CozyButler?.persistLocal(['cozy_orchard_seeds']);renderCrystals();}
  window.addEventListener('cozy:state-synced',()=>{renderCrystals();renderKnowledgeTopics();});
  window.addEventListener('beforeunload',()=>{if(orchardVoice?.isActive())orchardVoice.stop();});
  renderCrystals();
  renderKnowledgeTopics();
</script>
</body>
</html>
