<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#55653d" />
<link rel="manifest" href="../manifest.webmanifest" />
<title>成长田</title>
<script src="../core/runtime-config.js"></script>
<script src="../core/runtime.js"></script>
<script src="../core/data.js"></script>
<script src="../core/memory.js"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  button,textarea{font:inherit}
  button{color:inherit}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;overflow:hidden;color:#fff8e9;background:#314323}
  .orchard-stage{position:relative;width:100vw;height:100vh;min-height:620px;overflow:hidden;isolation:isolate}
  .orchard-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-4}
  .orchard-stage:before{content:"";position:absolute;inset:0;z-index:-3;background:linear-gradient(180deg,rgba(24,35,17,.06),rgba(23,31,14,.18) 52%,rgba(20,26,13,.5))}
  .orchard-stage:after{content:"";position:absolute;inset:0;z-index:-2;background:radial-gradient(circle at 50% 42%,transparent 0 44%,rgba(20,25,12,.25) 100%)}
  .back{position:fixed;left:18px;top:16px;z-index:8;color:#fff6dc;text-decoration:none;font-size:13px;background:rgba(43,35,22,.43);border:1px solid rgba(255,247,220,.2);padding:8px 13px;border-radius:999px;backdrop-filter:blur(8px);box-shadow:0 8px 20px rgba(20,16,10,.18)}
  .caption{position:absolute;left:22px;bottom:18px;z-index:3;width:min(380px,calc(100vw - 44px));text-shadow:0 2px 10px rgba(20,23,12,.55)}
  .caption h1{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:22px;font-weight:700;letter-spacing:0;text-shadow:0 2px 12px rgba(20,23,12,.62)}
  .caption p{max-width:350px;margin-top:4px;font-size:12px;line-height:1.65;color:rgba(255,249,231,.86)}
  .field-tools{position:fixed;right:20px;top:18px;z-index:8;display:flex;gap:9px}
  .water-all svg{width:21px;height:21px}
  .icon-control{position:relative;width:42px;height:42px;border:1px solid rgba(255,247,220,.2);border-radius:50%;display:grid;place-items:center;background:rgba(43,35,22,.43);color:#fff6dc;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 8px 20px rgba(20,16,10,.18);transition:.18s ease}
  .icon-control:hover{background:rgba(61,53,34,.62);transform:translateY(-1px)}
  .icon-control svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .icon-control .count{position:absolute;right:-3px;top:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;display:grid;place-items:center;background:#d9ae55;color:#4b3518;border:2px solid rgba(255,250,232,.9);font-size:9px;font-weight:700}
  .garden{position:absolute;inset:0;z-index:2;perspective:900px;pointer-events:none}
  .plot{position:absolute;border:0;background:transparent;cursor:pointer;color:#fff8e9;outline:none;filter:drop-shadow(0 10px 11px rgba(24,20,12,.3));pointer-events:auto;transform:translate(-50%,-50%)}
  .plot:nth-child(1){left:37.5%;top:42.5%;width:21%;height:18%}
  .plot:nth-child(2){left:53%;top:46.5%;width:23%;height:19%}
  .plot:nth-child(3){left:72.5%;top:54%;width:22%;height:20%}
  .plot:nth-child(4){left:30.7%;top:55.2%;width:23%;height:20%}
  .plot:nth-child(5){left:51.2%;top:69.5%;width:28%;height:24%}
  .plot:focus-visible .soil{outline:2px solid #fff4c7;outline-offset:5px}
  .soil{position:absolute;left:5%;right:5%;bottom:2px;height:64px;border:1px solid transparent;border-radius:50%;background:transparent;box-shadow:none;transform:rotateX(54deg);transition:.2s ease}
  .plot:hover .soil{background:rgba(255,241,198,.08);border-color:rgba(255,244,214,.22)}
  .plot.empty .soil:after{content:"·";position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,244,212,.42);font:28px/1 Georgia,serif;transform:rotateX(-54deg) translateY(-3px)}
  .plot-copy{position:absolute;left:8%;right:8%;bottom:-24px;text-align:center;text-shadow:0 2px 8px rgba(24,18,10,.7)}
  .plot-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:600}
  .plot-copy small{display:block;margin-top:2px;color:rgba(255,246,222,.72);font-size:9px}
  .plant{--leaf:#668a4c;--leaf2:#8ba765;position:absolute;left:50%;bottom:42px;width:94px;height:102px;transform:translateX(-50%);transform-origin:50% 100%;transition:transform .28s ease,filter .28s ease}
  .stem{position:absolute;left:46px;bottom:3px;width:4px;height:63px;border-radius:4px;background:linear-gradient(90deg,#415e30,#759252)}
  .leaf{position:absolute;width:34px;height:18px;border-radius:100% 0 100% 0;background:linear-gradient(135deg,var(--leaf2),var(--leaf));box-shadow:inset 2px 1px 0 rgba(255,255,255,.12)}
  .leaf.l1{left:15px;bottom:25px;transform:rotate(16deg)}.leaf.l2{right:12px;bottom:39px;transform:scaleX(-1) rotate(12deg)}.leaf.l3{left:20px;bottom:55px;transform:rotate(24deg)}.leaf.l4{right:18px;bottom:66px;transform:scaleX(-1) rotate(22deg)}
  .bud{position:absolute;left:33px;top:8px;width:30px;height:30px;border-radius:52% 48% 55% 45%;background:#d9b565;box-shadow:inset -5px -5px 0 rgba(119,73,36,.13);transform:scale(.25);opacity:0;transition:.25s ease}
  .fruit{position:absolute;left:32px;top:9px;width:32px;height:34px;border-radius:47% 53% 52% 48%;background:#b45f4b;box-shadow:inset -6px -5px 0 rgba(92,40,30,.16),inset 4px 4px 0 rgba(255,230,177,.12);transform:scale(.2);opacity:0;transition:.25s ease}
  .plant.buried{opacity:0}.plant.sprout{transform:translateX(-50%) scale(.47);transform-origin:50% 100%}.plant.leafy{transform:translateX(-50%) scale(.76)}.plant.bloom .bud{opacity:1;transform:scale(1)}.plant.fruiting .fruit{opacity:1;transform:scale(1)}.plant.fruiting .bud{opacity:0}
  .plant.type-fern{--leaf:#497b58;--leaf2:#8eb77e}.plant.type-flower{--leaf:#64805a;--leaf2:#9aae74}.plant.type-flower .bud{background:#e4a985}.plant.type-vine{--leaf:#527b49;--leaf2:#82a758}.plant.type-crystal{--leaf:#587a71;--leaf2:#8bad8c}.plant.type-crystal .bud,.plant.type-crystal .fruit{border-radius:10% 50% 42% 48%;background:#9dc4ba;transform:rotate(45deg) scale(.2)}.plant.type-crystal.bloom .bud,.plant.type-crystal.fruiting .fruit{transform:rotate(45deg) scale(1)}.plant.type-golden{--leaf:#7c8846;--leaf2:#b0aa60}.plant.type-golden .fruit{background:#d6a64e}
  .plot.resting .plant{filter:saturate(.78);transform:translateX(-50%) scale(.58)}
  .plot.watering .plant{animation:drink .8s ease}.plot.watering:after{content:"";position:absolute;left:50%;top:34px;width:8px;height:12px;border-radius:60% 40% 55% 45%;background:#b9e1ea;box-shadow:-15px 12px 0 #b9e1ea,14px 18px 0 #b9e1ea;animation:drops .75s ease forwards}
  .plot.harvesting .plant{animation:harvest .75s ease forwards}.plot.harvesting .soil:before,.plot.harvesting .soil:after{content:"";position:absolute;left:50%;top:50%;width:3px;height:52px;background:#fff2b8;box-shadow:0 0 14px #ffe598;transform-origin:50% 100%;animation:ray .7s ease forwards}.plot.harvesting .soil:after{transform:rotate(72deg)}
  @keyframes drink{0%,100%{transform:translateX(-50%) rotate(0)}35%{transform:translateX(-50%) rotate(-3deg)}70%{transform:translateX(-50%) rotate(3deg)}}
  @keyframes drops{0%{opacity:0;transform:translate(26px,-16px)}45%{opacity:1}100%{opacity:0;transform:translate(-6px,42px)}}
  @keyframes harvest{0%{opacity:1;transform:translateX(-50%) scale(1)}55%{opacity:1;transform:translateX(-50%) scale(1.18)}100%{opacity:0;transform:translateX(-50%) scale(.3)}}
  @keyframes ray{0%{opacity:0;transform:translate(-50%,-50%) scaleY(.2)}50%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scaleY(1.7)}}
  .drawer{position:fixed;right:18px;top:70px;bottom:18px;z-index:12;width:min(390px,calc(100vw - 36px));display:none;grid-template-rows:auto 1fr;background:rgba(255,251,241,.96);color:#4c3a29;border:1px solid rgba(89,67,43,.14);border-radius:16px;box-shadow:0 24px 70px rgba(26,19,11,.3);overflow:hidden;backdrop-filter:blur(14px)}
  .drawer.show{display:grid}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:15px 16px;background:#f1e4ca;border-bottom:1px solid rgba(90,68,43,.1)}
  .drawer-head h2{flex:1;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:17px;font-weight:680;color:#54432f}.drawer-head small{font-size:10px;color:#8f7a61}
  .close{width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.65);color:#6c5844;font-size:20px;cursor:pointer}
  .drawer-body{padding:15px 16px;overflow:auto}
  .empty-note{padding:26px 10px;text-align:center;color:#907d66;font-size:12px;line-height:1.7}
  .harvest-card{padding:12px 2px;border-bottom:1px solid rgba(91,68,42,.11)}.harvest-card:first-child{padding-top:2px}
  .harvest-card h3{font-size:13px;color:#52633c}.harvest-card p{margin-top:5px;font-size:11px;line-height:1.65;color:#6d5b47}.harvest-card small{display:block;margin-top:7px;font-size:9px;color:#a08d75}
  .source-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.source-tags span{padding:3px 6px;border-radius:999px;background:#ede4cf;color:#78654d;font-size:8px}
  .seed-panel{position:fixed;right:18px;top:70px;bottom:18px;z-index:13;width:min(430px,calc(100vw - 36px));display:none;grid-template-rows:auto 1fr;background:rgba(255,251,241,.97);color:#4d3928;border:1px solid rgba(89,67,43,.14);border-radius:16px;box-shadow:0 24px 70px rgba(26,19,11,.3);overflow:hidden;backdrop-filter:blur(14px)}
  .seed-panel.show{display:grid}.seed-scroll{padding:15px 16px 28px;overflow:auto}
  .seed-panel h2{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:17px;font-weight:680;letter-spacing:0}.seed-panel .intro{font-size:12px;line-height:1.65;color:#7a684f;margin-bottom:10px}
  .chat-examples{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.chat-examples button{border:1px solid rgba(113,130,85,.18);border-radius:999px;background:#f3eddf;color:#6d614b;padding:6px 9px;font-size:10px;cursor:pointer}.chat-examples button:hover{background:#e8e1cf;color:#56643d}
  .seed-input-wrap{position:relative}.seed-panel textarea{width:100%;min-height:104px;border:1px solid #dac6a9;border-radius:12px;padding:11px 50px 11px 11px;resize:vertical;background:#fffdf8;color:#4d3828;outline:none}.seed-panel textarea:focus{border-color:#8b9a68;box-shadow:0 0 0 3px rgba(127,139,84,.12)}
  .seed-mic{position:absolute;right:9px;bottom:10px;width:34px;height:34px;border:0;border-radius:50%;display:grid;place-items:center;background:rgba(108,125,73,.11);color:#697c4c;cursor:pointer}.seed-mic.active{background:#718255;color:#fff;box-shadow:0 0 0 4px rgba(113,130,85,.13)}.seed-mic:disabled{opacity:.4}.seed-mic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .seed-voice-status{min-height:17px;padding:4px 2px 0;font-size:10px;color:#8a765d}
  .primary{width:100%;height:40px;margin-top:9px;border:0;border-radius:10px;background:#718255;color:#fffaf0;cursor:pointer}.primary:disabled{opacity:.45}
  .orchard-reply{display:none;margin-top:12px;padding:12px 13px;border-left:3px solid #b99953;background:#f5ecd9;color:#5d4934}.orchard-reply.show{display:block}.orchard-reply h3{font-size:13px;color:#5c6c3e;margin-bottom:6px}.orchard-reply p{margin-top:5px;font-size:11px;line-height:1.7}
  .plot-detail{margin-top:13px;padding-top:13px;border-top:1px solid rgba(91,68,42,.12)}.plot-detail h3{font-size:14px}.plot-detail p{margin-top:5px;color:#745f48;font-size:11px;line-height:1.65}.plot-actions{display:flex;gap:7px;margin-top:10px}.plot-actions button{height:34px;flex:1;border:1px solid rgba(93,74,49,.15);border-radius:9px;background:#eee4cd;color:#5f513c;cursor:pointer}.plot-actions button.emphasis{background:#8b7049;color:#fff;border-color:transparent}.plot-actions button:disabled{opacity:.38;cursor:default}
  .water-picker{margin-top:10px;padding:11px;border-radius:12px;background:#f2ead8}.water-picker h4{font-size:12px;color:#59683d}.water-options{display:grid;gap:7px;margin-top:8px}.water-option{width:100%;padding:9px 10px;text-align:left;border:1px solid rgba(91,68,42,.12);border-radius:9px;background:#fffaf0;color:#594833;cursor:pointer}.water-option b{display:block;font-size:11px}.water-option small{display:block;margin-top:2px;font-size:9px;color:#8b785f}.water-empty{font-size:10px;color:#8b785f;line-height:1.6}
  .knowledge-library{margin-top:17px;padding-top:14px;border-top:1px solid rgba(94,75,47,.13)}.knowledge-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.knowledge-head h3{font-size:13px;color:#5b6b36}.knowledge-head span{font-size:9px;color:#8b7b58}
  .knowledge-category{margin-top:10px;font-size:9px;color:#8c744e}.knowledge-topic{border-bottom:1px solid rgba(94,75,47,.1)}.knowledge-topic summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 1px;cursor:pointer}.knowledge-topic summary::-webkit-details-marker{display:none}.knowledge-topic summary strong{min-width:0;flex:1;font-size:11px;color:#55452f}.knowledge-topic summary small{font-size:8px;color:#9a896d}.knowledge-topic summary:after{content:"+";color:#8a9561}.knowledge-topic[open] summary:after{content:"−"}.knowledge-body{padding:0 2px 10px}.knowledge-body>p{font-size:10px;line-height:1.65;color:#6c5942;margin-bottom:7px}.knowledge-entities{display:flex;flex-wrap:wrap;gap:5px}.knowledge-entities span{font-size:8px;padding:3px 6px;border-radius:999px;background:#eee1be;color:#776541}.knowledge-entry{padding:7px 0;border-top:1px dashed rgba(94,75,47,.11)}.knowledge-entry b{display:block;font-size:9px;color:#5d6c39}.knowledge-entry p{font-size:9px;line-height:1.55;color:#76634a;margin-top:3px}
  .toast{position:fixed;right:20px;top:70px;z-index:30;width:max-content;max-width:min(300px,calc(100vw - 40px));padding:9px 12px 9px 30px;border:1px solid rgba(255,247,220,.28);border-radius:10px;background:rgba(245,239,218,.9);color:#52613d;font-size:11px;line-height:1.45;box-shadow:0 10px 28px rgba(23,27,14,.16);backdrop-filter:blur(12px);opacity:0;transform:translateY(-5px);pointer-events:none;transition:.2s ease}.toast:before{content:"✓";position:absolute;left:11px;top:8px;font-size:12px;font-weight:700;color:#718255}.toast.is-note:before{content:"·";font-size:22px;line-height:10px;color:#a6854e}.toast.show{opacity:1;transform:translateY(0)}
  .reveal{position:fixed;inset:0;z-index:28;display:none;place-items:center;background:rgba(28,24,16,.42);backdrop-filter:blur(5px)}.reveal.show{display:grid}.reveal-card{width:min(330px,calc(100vw - 40px));padding:26px 24px;text-align:center;background:#fff9eb;color:#493927;border:1px solid rgba(114,82,45,.14);border-radius:16px;box-shadow:0 24px 80px rgba(24,18,10,.34);animation:revealIn .5s ease}.reveal-mark{width:58px;height:58px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#e9d7aa;color:#78603a}.reveal-mark svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.reveal-card h2{font-family:"STKaiti","KaiTi",serif;font-size:21px}.reveal-card p{margin-top:7px;font-size:11px;line-height:1.7;color:#78654d}.reveal-card button{margin-top:16px;border:0;border-radius:9px;background:#746246;color:#fff;padding:9px 18px;cursor:pointer}@keyframes revealIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
  @media(max-width:760px){.orchard-stage{min-height:560px}.plot{width:28%;height:21%}.soil{height:52px}.plant{bottom:34px;transform:translateX(-50%) scale(.78)}.plant.sprout{transform:translateX(-50%) scale(.38)}.plant.leafy{transform:translateX(-50%) scale(.58)}.plot-copy{bottom:-18px}.plot-copy strong{font-size:10px}.plot-copy small{display:none}.caption{bottom:14px}.caption h1{font-size:20px}.caption p{max-width:260px;font-size:10px}.field-tools{right:12px;top:12px}.icon-control{width:39px;height:39px}.toast{right:12px;top:61px}.drawer,.seed-panel{left:8px;right:8px;top:62px;bottom:8px;width:auto;border-radius:14px}}
</style>
</head>
<body>
<main class="orchard-stage">
  <img class="orchard-bg" id="orchard-bg" src="../assets/plants/orchard_field.jpg" alt="" />
  <a class="back" href="../index.html">← 回小院</a>
  <nav class="field-tools" aria-label="成长田工具">
    <button class="icon-control" type="button" onclick="openSeedPanel()" aria-label="和田聊聊" title="和田聊聊"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></button>
    <button class="icon-control water-all" type="button" onclick="waterAllPlots()" aria-label="一键浇水" title="一键浇水：照料今天还没浇过的地"><svg viewBox="0 0 24 24"><path d="M4 10h10l2 8H6l-2-8Z"></path><path d="M12 10V7a3 3 0 0 0-6 0v3M14 12l4-3 2 2-5 4M19 15v.01M21 17v.01"></path></svg></button>
    <button class="icon-control" type="button" onclick="toggleBackpack()" aria-label="打开背包" title="收成背包"><svg viewBox="0 0 24 24"><path d="M8 8V6a4 4 0 0 1 8 0v2"></path><rect x="4" y="8" width="16" height="13" rx="3"></rect><path d="M8 12h8M9 16h6"></path></svg><span class="count" id="backpack-count" hidden>0</span></button>
  </nav>
  <section class="garden" id="garden" aria-label="五块成长田地"></section>
  <section class="caption"><h1>成长田</h1><p id="season-line">有些变化发生在土里。你不必知道最后会长成什么。</p></section>
</main>

<aside class="seed-panel" id="seed-panel" aria-label="与成长田聊聊">
  <header class="drawer-head"><h2 id="seed-panel-title">和田聊聊</h2><small id="selected-plot-label"></small><button class="close" type="button" onclick="closeSeedPanel()" aria-label="关闭">×</button></header>
  <div class="seed-scroll">
    <div class="chat-examples"><button type="button" onclick="useChatExample('我对这个知识还不太懂：')">有个知识没弄懂</button><button type="button" onclick="useChatExample('今天发生了一件事：')">说说今天发生的事</button><button type="button" onclick="useChatExample('我最近一直在想：')">聊聊最近的困惑</button><button type="button" onclick="useChatExample('我刚学到一个东西：')">记下刚学到的东西</button></div>
    <div class="seed-input-wrap">
      <textarea id="seed-input" placeholder="随便和田说说，不一定会变成新的种子。"></textarea>
      <button class="seed-mic" id="seed-mic" type="button" aria-label="语音输入" title="语音输入" aria-pressed="false" onclick="toggleOrchardVoice()"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line><line x1="8" x2="16" y1="22" y2="22"></line></svg></button>
    </div>
    <div class="seed-voice-status" id="seed-voice-status" aria-live="polite"></div>
    <button class="primary" id="orchard-plant" type="button" onclick="plantSeed()">和田聊聊</button>
    <div class="orchard-reply" id="orchard-reply"></div>
    <section class="plot-detail" id="plot-detail" hidden></section>
    <section class="knowledge-library"><div class="knowledge-head"><h3>知识专题</h3><span id="knowledge-count"></span></div><div id="knowledge-topics"></div></section>
  </div>
</aside>

<aside class="drawer" id="backpack" aria-label="收成背包">
  <header class="drawer-head"><h2>收成背包</h2><small id="backpack-summary"></small><button class="close" type="button" onclick="toggleBackpack(false)" aria-label="关闭">×</button></header>
  <div class="drawer-body" id="backpack-list"></div>
</aside>

<div class="reveal" id="harvest-reveal" role="dialog" aria-modal="true"><section class="reveal-card"><div class="reveal-mark"><svg viewBox="0 0 24 24"><path d="m12 3 2.4 5.2L20 10l-4 4 .9 5.8L12 17l-4.9 2.8L8 14l-4-4 5.6-1.8Z"></path></svg></div><h2 id="reveal-title"></h2><p id="reveal-copy"></p><button type="button" onclick="closeReveal()">收进背包</button></section></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const GARDEN_KEY='cozy_orchard_garden',BACKPACK_KEY='cozy_orchard_backpack',EVENTS_KEY='cozy_orchard_growth_events',PENDING_HARVEST_KEY='cozy_orchard_pending_harvest';
  const STAGES=['buried','sprout','leafy','bloom','fruiting'];
  const STAGE_LABELS={buried:'土里有动静',sprout:'刚刚探头',leafy:'正在舒展',bloom:'悄悄开花',fruiting:'可以收成',resting:'重新蓄力'};
  const SOURCE_LABELS={orchard:'成长田',blackboard:'黑板',heart_hollow:'树洞',life:'生活'};

  function broadGrowthTheme(value,source=''){const text=String(value||'').toLowerCase();if(/agent|智能体|蜂群|mcp|模型|ai|评测|记忆系统|原型/.test(text)||source==='blackboard')return'AI 产品与系统';if(/工作|效率|职业|项目|协作|方法/.test(text))return'工作与方法';if(/旅行|城市|地点|路上|生活/.test(text))return'生活与见闻';return'个人成长';}

  function ensureGarden(persist=true){
    let garden=getGarden();
    if(!garden.length)garden=Array.from({length:5},(_,index)=>blankPlot(index));
    const visible=garden.slice(0,5),overflow=garden.slice(5).filter(plot=>plot&&plot.seedId);
    while(visible.length<5)visible.push(blankPlot(visible.length));
    overflow.forEach(plot=>{const emptyIndex=visible.findIndex(item=>!item.seedId);if(emptyIndex>=0)visible[emptyIndex]=plot;});
    garden=visible.slice(0,5).map((plot,index)=>{const next=Object.assign(blankPlot(index),plot,{id:'plot_'+(index+1),slot:index});if(next.seedId&&((next.sources||[]).includes('blackboard')||/蜂群架构落地评估|成本与体验|agent落地|agent边界|默认agent/i.test(next.title||''))){next.title='AI 产品与系统';next.hint='模型、智能体、评测与产品判断正在汇入同一条成长脉络。';}return next;});
    const aiPlots=garden.filter(plot=>plot.seedId&&plot.title==='AI 产品与系统');if(aiPlots.length>1){const keeper=aiPlots[0];aiPlots.slice(1).forEach(extra=>{keeper.growth=Math.max(keeper.growth||0,extra.growth||0)+1;keeper.stage=stageFor(keeper.growth);keeper.sources=Array.from(new Set([...(keeper.sources||[]),...(extra.sources||[])]));keeper.eventIds=Array.from(new Set([...(keeper.eventIds||[]),...(extra.eventIds||[])])).slice(-24);keeper.waterLog=[...(keeper.waterLog||[]),...(extra.waterLog||[])].slice(0,20);Object.assign(extra,blankPlot(extra.slot));});}
    const occupied=new Set(garden.map(plot=>plot.seedId).filter(Boolean));
    getSeeds().filter(seed=>seed.status!=='resolved'&&!occupied.has(seed.id)).slice(0,garden.filter(plot=>!plot.seedId).length).forEach(seed=>{
      const plot=garden.find(item=>!item.seedId);if(!plot)return;
      plot.seedId=seed.id||'legacy_'+Date.now();plot.title=cleanTitle(seed.text,'一枚旧种子');plot.hint=seed.insight||seed.reply||'这件事还在慢慢形成自己的方向。';plot.plantType=PLANT_TYPES[hashText(plot.title)%PLANT_TYPES.length];plot.growth=3;plot.stage=stageFor(plot.growth);plot.sources=['orchard'];plot.lastNourishedAt=seed.updatedAt||seed.date||new Date().toISOString();
    });
    if(persist)writeJson(GARDEN_KEY,garden);return garden;
  }
  function importBlackboardEvents(){

    readJson('cozy_blackboard_answers',[]).forEach((answer,index)=>{const id='blackboard_'+hashText([answer.date,answer.title,answer.answer,index].join('|'));if(known.has(id))return;events.unshift({id,source:'blackboard',sourceDate:answer.date||localCalendarDate(),title:broadGrowthTheme(answer.title,'blackboard'),detailTitle:cleanTitle(answer.title,'一次产品思考'),hint:'今天完成了“'+cleanTitle(answer.title,'一次产品思考')+'”，其中的判断会继续滋养这个主题。',nourishment:2,createdAt:new Date().toISOString(),consumed:false});known.add(id);changed=true;});
    if(changed)writeJson(EVENTS_KEY,events.slice(0,240));
  }
  function titleTokens(value){return new Set(String(value||'').toLowerCase().replace(/[，。！？、：；,.!?;:()（）]/g,' ').split(/\s+/).flatMap(part=>part.length>4?[part,...Array.from({length:part.length-1},(_,i)=>part.slice(i,i+2))]:[part]).filter(part=>part.length>1));}
  function relatedPlot(garden,event){const incoming=titleTokens(event.title);let best=null,score=0;garden.filter(plot=>plot.seedId).forEach(plot=>{const tokens=titleTokens(plot.title);let current=0;incoming.forEach(token=>{if(tokens.has(token))current+=1;});if(current>score){score=current;best=plot;}});return score>0?best:null;}
  function applyGrowthEvents(includeExternal=true){
    if(includeExternal)importBlackboardEvents();const garden=ensureGarden(includeExternal),events=getGrowthEvents();let gardenChanged=false,eventChanged=false;
    events.filter(event=>!event.consumed&&event.title).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||''))).forEach(event=>{
      let plot=(event.preferredPlotId&&garden.find(item=>item.id===event.preferredPlotId))||relatedPlot(garden,event)||garden.find(item=>!item.seedId);
      if(!plot)return;
      if(!plot.seedId){plot.seedId='event_'+event.id;plot.title=cleanTitle(event.title);plot.hint=String(event.hint||'这段经历会在这里继续形成新的判断。').slice(0,90);plot.plantType=PLANT_TYPES[hashText(plot.title+event.id)%PLANT_TYPES.length];plot.growth=0;plot.sources=[];plot.eventIds=[];}
      plot.growth+=Math.max(1,Math.min(3,Number(event.nourishment)||1));plot.stage=stageFor(plot.growth);plot.harvestReady=plot.stage==='fruiting';plot.sources=Array.from(new Set([...(plot.sources||[]),event.source||'life']));plot.eventIds=Array.from(new Set([...(plot.eventIds||[]),event.id])).slice(-24);plot.topicIds=Array.from(new Set([...(plot.topicIds||[]),event.topicId].filter(Boolean))).slice(-12);plot.lastNourishedAt=event.createdAt||new Date().toISOString();event.consumed=true;event.plotId=plot.id;event.consumedAt=new Date().toISOString();gardenChanged=true;eventChanged=true;

  }

  function waterAllPlots(){const garden=getGarden(),items=todaysNourishment(),today=localCalendarDate(),targets=garden.filter(plot=>plot.seedId&&!(plot.waterLog||[]).some(log=>log.date===today));if(!targets.length){showToast('今天的地已经照料好了','note');return;}if(!items.length){showToast('今天还没有可带进田里的记录','note');return;}let watered=0;targets.forEach((plot,index)=>{plot.waterLog=Array.isArray(plot.waterLog)?plot.waterLog:[];const item=items.find(candidate=>!plot.waterLog.some(log=>log.id===candidate.id))||items[index%items.length];if(!item)return;plot.careCount=(plot.careCount||0)+1;plot.growth+=item.amount||1;plot.stage=stageFor(plot.growth);plot.harvestReady=plot.stage==='fruiting';plot.lastNourishedAt=new Date().toISOString();plot.sources=Array.from(new Set([...(plot.sources||[]),item.source]));plot.waterLog.unshift({id:item.id,date:today,title:item.title,source:item.source});plot.waterLog=plot.waterLog.slice(0,20);plot.hint='今天用“'+cleanTitle(item.title)+'”浇过水。';document.querySelector('[data-plot="'+CSS.escape(plot.id)+'"]')?.classList.add('watering');watered+=1;});writeJson(GARDEN_KEY,garden);setTimeout(()=>renderGarden(),900);showToast('已照料 '+watered+' 块地');}

  function setOrchardVoiceState(state,message){const active=['starting','listening','stopping'].includes(state),mic=document.getElementById('seed-mic');mic.classList.toggle('active',active);mic.setAttribute('aria-pressed',String(active));mic.setAttribute('aria-label',active?'停止语音输入':'语音输入');document.getElementById('seed-voice-status').textContent=message||'';document.getElementById('orchard-plant').disabled=active||orchardBusy;}
  function toggleOrchardVoice(){if(!window.CozyButler?.createDictation){setOrchardVoiceState('error','语音组件正在准备，请稍后再试');return;}if(!orchardVoice)orchardVoice=CozyButler.createDictation({input:document.getElementById('seed-input'),onState:setOrchardVoiceState});orchardVoice.toggle();}
  function mergeKnowledgeTopic(text,result){const payload=result.knowledge_topic&&typeof result.knowledge_topic==='object'?result.knowledge_topic:{},topics=getKnowledgeTopics(),entities=Array.isArray(payload.entities)?payload.entities.map(value=>String(value).trim()).filter(Boolean):[],category=normalizeTopicCategory(payload.category,payload.title+' '+text),normalize=value=>String(value||'').toLowerCase().replace(/[\s·・:：/\-]+/g,'');let topic=topics.find(item=>payload.match_id&&String(item.id)===String(payload.match_id));if(!topic&&entities.length)topic=topics.find(item=>normalizeTopicCategory(item.category,item.title)===category&&entities.some(entity=>(item.entities||[]).some(old=>normalize(old)===normalize(entity))));if(!topic&&category==='AI 产品与系统')topic=topics.find(item=>normalizeTopicCategory(item.category,item.title)===category);if(!topic){topic={id:'topic_'+Date.now(),title:category==='AI 产品与系统'?'AI 产品与系统':(payload.title||result.seed_summary||'成长探索'),category,entities:[],summary:'',entries:[],createdAt:new Date().toISOString()};topics.unshift(topic);}topic.title=category==='AI 产品与系统'?'AI 产品与系统':(topic.title||payload.title);topic.category=category;topic.entities=Array.from(new Set([...(topic.entities||[]),...entities])).slice(0,20);topic.summary=payload.summary||topic.summary||result.key_insight||result.reply;topic.updatedAt=new Date().toISOString();topic.entries=Array.isArray(topic.entries)?topic.entries:[];topic.entries.unshift({id:'knowledge_'+Date.now(),question:text,answer:result.reply,insight:result.key_insight||'',nextStep:result.next_step||'',date:localCalendarDate()});topic.entries=topic.entries.slice(0,30);writeJson('cozy_orchard_topics',topics.slice(0,60));renderKnowledgeTopics();return topic;}
  function nourishFromOrchard(text,result,topic){const seeds=getSeeds(),record={id:'seed_'+Date.now(),text:result.seed_summary||text,original:text,reply:result.reply,insight:result.key_insight||'',nextStep:result.next_step||'',date:localCalendarDate(),status:'growing',topicId:topic?.id||'',updatedAt:new Date().toISOString()};seeds.unshift(record);writeJson('cozy_orchard_seeds',seeds.slice(0,50));const events=getGrowthEvents();events.unshift({id:'orchard_'+record.id,source:'orchard',sourceDate:record.date,title:cleanTitle(result.seed_summary||text,'一个正在生长的问题'),hint:String(result.key_insight||result.reply||'这件事正在慢慢形成方向。').slice(0,90),nourishment:1,topicId:topic?.id||'',createdAt:new Date().toISOString(),consumed:false,preferredPlotId:activePlotId});writeJson(EVENTS_KEY,events.slice(0,240));if(window.CozyMemory){CozyMemory.add({source:'orchard',type:'growth_seed',layer:'long',weight:2,content:'成长主题：'+record.text+'\n关键判断：'+(record.insight||record.reply)+'\n下一步：'+record.nextStep,summary:'成长田关注：'+record.text.slice(0,54)});}document.getElementById('seed-input').value='';renderGarden();const plot=getGarden().find(item=>item.id===activePlotId);if(plot?.seedId){document.getElementById('seed-panel-title').textContent='继续聊聊';renderPlotDetail(plot);}}
  async function plantSeed(){if(orchardBusy||orchardVoice?.isActive())return;const input=document.getElementById('seed-input'),text=input.value.trim(),box=document.getElementById('orchard-reply');if(!text){box.className='orchard-reply show';box.innerHTML='<h3>田边还空着</h3><p>先放下一件此刻真正想弄明白的事。</p>';return;}orchardBusy=true;document.getElementById('orchard-plant').disabled=true;box.className='orchard-reply show';box.innerHTML='<h3>阿栗正在辨认</h3><p>先把问题讲清楚，再看看它会落进哪块土里。</p>';try{const compactTopics=getKnowledgeTopics().slice(0,16).map(topic=>({id:topic.id,title:topic.title,category:topic.category,entities:topic.entities||[],summary:topic.summary||''}));const data=window.CozyButler?await CozyButler.api('/api/room',{room:'orchard',message:text,context:{intent:'answer_and_nourish_garden',active_plot:activePlotId,recent_plots:getGarden().filter(plot=>plot.seedId).map(plot=>({id:plot.id,title:plot.title,hint:plot.hint,sources:plot.sources})),knowledge_topics:compactTopics}}):null;const result=data?.result?.reply?data.result:buildOrchardResult(text),topic=mergeKnowledgeTopic(text,result);nourishFromOrchard(text,result,topic);box.innerHTML='<h3>田野回响</h3><p>'+escapeOrchard(result.reply)+'</p>'+(result.key_insight?'<p><strong>留下的判断：</strong>'+escapeOrchard(result.key_insight)+'</p>':'')+(result.next_step?'<p><strong>接下来可以试：</strong>'+escapeOrchard(result.next_step)+'</p>':'');}catch(error){const result=buildOrchardResult(text),topic=mergeKnowledgeTopic(text,result);nourishFromOrchard(text,result,topic);box.innerHTML='<h3>田野回响</h3><p>'+escapeOrchard(result.reply)+'</p><p><strong>接下来可以试：</strong>'+escapeOrchard(result.next_step)+'</p>';}finally{orchardBusy=false;document.getElementById('orchard-plant').disabled=false;}}
  function buildOrchardResult(text){const topic=cleanTitle(text.length>38?text.slice(0,38)+'…':text);return{reply:'现在不必替这件事找到永久答案。先做一次能产生真实反馈的小尝试，方向会从证据里慢慢显出来。',seed_summary:topic,key_insight:'先用一个小实验获得证据，再决定是否长期投入。',next_step:'在三天内做一次最小尝试，并记下它改变了什么判断。',knowledge_topic:{title:'成长探索',category:'成长与方向',entities:[],summary:'用小实验把模糊困惑变成可以继续验证的方向。',knowledge_points:['先获得真实反馈，再决定长期投入。']}};}
  function renderKnowledgeTopics(plot=null){let topics=getKnowledgeTopics().map(topic=>({...topic,category:normalizeTopicCategory(topic.category,topic.title)})).sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')));if(plot){const ids=new Set(plot.topicIds||[]),title=String(plot.title||'').toLowerCase();topics=topics.filter(topic=>ids.has(topic.id)||String(topic.title||'').toLowerCase()===title||String(topic.category||'').toLowerCase()===title);}document.getElementById('knowledge-count').textContent=topics.length?topics.length+' 个专题':'';if(!topics.length){document.getElementById('knowledge-topics').innerHTML='<div class="empty-note">这里会随着对话慢慢长出知识专题。</div>';return;}const groups={};topics.forEach(topic=>{(groups[topic.category]||(groups[topic.category]=[])).push(topic);});const order=Object.keys(groups).sort((a,b)=>Math.max(...groups[b].map(item=>Date.parse(item.updatedAt||0)||0))-Math.max(...groups[a].map(item=>Date.parse(item.updatedAt||0)||0)));document.getElementById('knowledge-topics').innerHTML=order.map(category=>'<section><div class="knowledge-category">'+escapeOrchard(category)+'</div>'+groups[category].map(topic=>{const entries=Array.isArray(topic.entries)?topic.entries:[],entities=(topic.entities||[]).slice(0,8).map(value=>'<span>'+escapeOrchard(value)+'</span>').join(''),history=entries.slice(0,4).map(entry=>'<article class="knowledge-entry"><b>'+escapeOrchard(entry.question||'一次更新')+'</b><p>'+escapeOrchard(entry.answer||entry.insight||'')+'</p></article>').join('');return'<details class="knowledge-topic"><summary><strong>'+escapeOrchard(topic.title||'未命名专题')+'</strong><small>'+entries.length+' 次更新</small></summary><div class="knowledge-body"><p>'+escapeOrchard(topic.summary||'')+'</p>'+(entities?'<div class="knowledge-entities">'+entities+'</div>':'')+history+'</div></details>';}).join('')+'</section>').join('');}
  window.addEventListener('cozy:state-synced',()=>{stateSyncSeen=true;const pending=readJson(PENDING_HARVEST_KEY,[]),remote=getBackpack(),remoteIds=new Set(remote.map(item=>item.id));if(pending.length&&pending.every(item=>remoteIds.has(item.id)))localStorage.removeItem(PENDING_HARVEST_KEY);else mergePendingHarvest();renderGarden(true);renderKnowledgeTopics();renderBackpackCount();});
  window.addEventListener('beforeunload',()=>{if(orchardVoice?.isActive())orchardVoice.stop();});
  seasonSetup();renderGarden(false);renderKnowledgeTopics();renderBackpackCount();setTimeout(()=>{if(!stateSyncSeen)renderGarden(true);},1600);
</script>
