<main class="orchard-stage">

    </div>

<script>
  const GARDEN_KEY='cozy_orchard_garden',BACKPACK_KEY='cozy_orchard_backpack',EVENTS_KEY='cozy_orchard_growth_events',PENDING_HARVEST_KEY='cozy_orchard_pending_harvest',CHAT_KEY='cozy_orchard_chat_sessions',CHAT_HISTORY_COLLAPSED_KEY='cozy_orchard_chat_history_collapsed',KNOWLEDGE_SEEN_KEY='cozy_orchard_topics_seen_at',BACKPACK_SEEN_KEY='cozy_orchard_backpack_seen_at',UNREAD_BASELINE_VERSION_KEY='cozy_orchard_unread_baseline_v3';
  const STAGES=['buried','germinating','sprout','young','leafy','bloom','fruiting'];
  const STAGE_THRESHOLDS=[0,3,6,9,13,17,22];
  const STAGE_LABELS={buried:'种子安静着',germinating:'正在萌动',sprout:'刚刚探头',young:'长出新叶',leafy:'枝叶舒展',bloom:'悄悄开花',fruiting:'可以收成'};
  const SOURCE_LABELS={orchard:'成长田',blackboard:'黑板',heart_hollow:'树洞',life:'生活'};
  const PLANT_TYPES=['fern','flower','vine','crystal','golden'];
  const HARVEST_KINDS=['一枚果实','一束花','一粒种荚','一份专题笔记','一个方法','一段经验'];
  let activePlotId='',orchardBusy=false,orchardVoice=null,toastTimer=0,stateSyncSeen=false,activeChatId='',knowledgeRenderFingerprint='';

  function readJson(key,fallback){try{const value=JSON.parse(localStorage.getItem(key)||'null');return value==null?fallback:value;}catch(error){return fallback;}}
  function writeJson(key,value){if(window.CozyRuntime?.readOnly)return;localStorage.setItem(key,JSON.stringify(value));window.CozyButler?.persistLocal([key]);}
  function localCalendarDate(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function escapeOrchard(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
  function hashText(value){let h=2166136261;for(const char of String(value||'')){h^=char.charCodeAt(0);h=Math.imul(h,16777619);}return Math.abs(h>>>0);}
  function cleanTitle(value,fallback='尚未显露'){const text=String(value||'').replace(/[\r\n]+/g,' ').replace(/^(成长主题|主题)[:：]\s*/,'').trim();return (text||fallback).slice(0,28);}
  function broadGrowthTheme(value,source=''){const text=String(value||'').toLowerCase();if(/agent|智能体|蜂群|mcp|模型|ai|评测|记忆系统|原型/.test(text)||source==='blackboard')return'AI 产品与系统';if(/工作|效率|职业|项目|协作|方法/.test(text))return'工作与方法';if(/旅行|城市|地点|路上|生活/.test(text))return'生活与见闻';return'个人成长';}
  function normalizeTopicCategory(value,title=''){const supplied=cleanTitle(value,'');if(supplied&&!/^(成长与方向|成长探索|其他|未分类)$/.test(supplied))return supplied;const text=String(title||'');if(/ai|产品|技术|模型|agent|智能体|评测|蜂群|编程|cursor|claude|codex/i.test(text))return'AI 产品与系统';if(/工作|方法|效率|职业|项目/.test(text))return'工作与方法';if(/生活|旅行|见闻|经历/.test(text))return'生活与见闻';return'个人成长';}
  function stageFor(growth){const value=Math.max(0,Number(growth)||0);for(let index=STAGE_THRESHOLDS.length-1;index>=0;index-=1){if(value>=STAGE_THRESHOLDS[index])return STAGES[index];}return'buried';}
  function progressedStage(current,growth){const currentIndex=STAGES.indexOf(current),nextIndex=STAGES.indexOf(stageFor(growth));return STAGES[Math.max(currentIndex,0,nextIndex)];}
  function getGarden(){const value=readJson(GARDEN_KEY,[]);return Array.isArray(value)?value:[];}
  function getBackpack(){const value=readJson(BACKPACK_KEY,[]);return Array.isArray(value)?value:[];}
  function getGrowthEvents(){const value=readJson(EVENTS_KEY,[]);return Array.isArray(value)?value:[];}
  function getSeeds(){const value=readJson('cozy_orchard_seeds',[]);return Array.isArray(value)?value:[];}
  function getKnowledgeTopics(){const value=readJson('cozy_orchard_topics',[]);return Array.isArray(value)?value:[];}
  function getChatSessions(){const value=readJson(CHAT_KEY,[]);return Array.isArray(value)?value:[];}
  function itemFreshness(item){const direct=Date.parse(item?.updatedAt||item?.harvestedAt||item?.createdAt||'');if(Number.isFinite(direct))return direct;const match=String(item?.id||'').match(/(\d{10,})/);if(match)return Number(match[1]);const dated=Date.parse(item?.date||'');return Number.isFinite(dated)?dated:0;}
  function latestFreshness(items){return items.reduce((latest,item)=>Math.max(latest,itemFreshness(item)),0);}
  function markSeen(key,items){const latest=latestFreshness(items);localStorage.setItem(key,String(latest||Date.now()));}
  function initializeUnreadBaselines(){const needsReset=localStorage.getItem(UNREAD_BASELINE_VERSION_KEY)!=='3';[[KNOWLEDGE_SEEN_KEY,getKnowledgeTopics()],[BACKPACK_SEEN_KEY,mergePendingHarvest()]].forEach(([key,items])=>{const seen=Number(localStorage.getItem(key)||0);if(!needsReset&&seen>0)return;const latest=latestFreshness(items);localStorage.setItem(key,String(latest||Date.now()));});localStorage.setItem(UNREAD_BASELINE_VERSION_KEY,'3');}
  function blankPlot(index){return{id:'plot_'+(index+1),slot:index,seedId:'',title:'',hint:'',plantType:'',growth:0,stage:'buried',sources:[],eventIds:[],topicIds:[],careCount:0,cycle:0,lastNourishedAt:'',harvestReady:false};}

  async function plantSeed(){
    if(orchardBusy||orchardVoice?.isActive())return;
    const input=document.getElementById('seed-input'),text=input.value.trim(),send=document.getElementById('orchard-plant'),mic=document.getElementById('seed-mic');
    if(!text){document.getElementById('seed-voice-status').textContent='先写下一个想弄明白的问题。';return;}
    if(!activeChatId)startNewOrchardChat(false);
    saveChatMessage('owner',text);input.value='';orchardBusy=true;send.disabled=true;mic.disabled=true;renderOrchardChat(true);
    try{
      const chat=currentChat(),compactTopics=getKnowledgeTopics().slice(0,16).map(topic=>({id:topic.id,title:topic.title,category:topic.category,entities:topic.entities||[],summary:topic.summary||''})),conversation=(chat?.messages||[]).slice(0,-1).slice(-8).map(item=>({role:item.role,text:item.text}));
      if(!window.CozyButler)throw new Error('AI 服务未连接');
      const data=await CozyButler.api('/api/room',{room:'orchard',message:text,context:{intent:'multi_turn_learning_coach',current_topic_id:chat?.topicId||'',conversation,knowledge_topics:compactTopics}},90000);
      if(!data?.result?.reply)throw new Error('AI 没有返回有效内容');
      const result=data.result,topic=mergeKnowledgeTopic(text,result);attachTopicToPlot(topic,result);saveChatMessage('butler',result.reply,{topicId:topic.id,insight:result.key_insight||'',nextStep:result.next_step||''});rememberOrchardAttention(text,result,topic);
    }catch(error){
      const timedOut=error?.name==='AbortError',message=timedOut?'这次回复超过 90 秒，问题已经保留。请稍后重试。':'这次没有连接上 AI，问题已经保留，但不会写进专题笔记。请稍后重试。';
      saveChatMessage('butler',message,{error:true});document.getElementById('seed-voice-status').textContent=timedOut?'回复超时，请重试':String(error?.message||'AI 服务未连接');
    }finally{orchardBusy=false;send.disabled=false;mic.disabled=false;renderOrchardChat();}
  }

  function renderKnowledgeTopics(){

    const container=document.getElementById('knowledge-topics'),fingerprint=JSON.stringify(topics),openTopicIds=new Set([...container.querySelectorAll('details[open][data-topic-id]')].map(item=>item.dataset.topicId));

    renderKnowledgeBadge();
  }
  window.addEventListener('cozy:state-synced',()=>{stateSyncSeen=true;const pending=readJson(PENDING_HARVEST_KEY,[]),remote=getBackpack(),remoteIds=new Set(remote.map(item=>item.id));if(pending.length&&pending.every(item=>remoteIds.has(item.id)))localStorage.removeItem(PENDING_HARVEST_KEY);else mergePendingHarvest();reconcileTopicPlots();renderGarden(true);if(document.getElementById('knowledge-panel').classList.contains('show'))renderKnowledgeTopics();const current=getGarden().find(item=>item.id===activePlotId);if(current?.seedId&&document.getElementById('plot-panel').classList.contains('show'))renderPlotStatus(current);renderBackpackCount();if(document.getElementById('seed-panel').classList.contains('show'))renderOrchardChat();});
  document.addEventListener('click',event=>{if(!event.target.closest('.batch-care-wrap'))closeBatchCareMenu();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape')closeBatchCareMenu();});
  window.addEventListener('beforeunload',()=>{if(orchardVoice?.isActive())orchardVoice.stop();});
  seasonSetup();reconcileTopicPlots();initializeUnreadBaselines();renderGarden(false);renderKnowledgeTopics();renderBackpackCount();setTimeout(()=>{if(!stateSyncSeen)renderGarden(true);},1600);
</script>
</body>
</html>
