<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="refresh" content="0; url=memory_nook.html" />
<meta name="theme-color" content="#75604a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="栗壳小院" />
<link rel="manifest" href="../manifest.webmanifest" />
<link rel="apple-touch-icon" href="../assets/app/icon-192.png" />
<title>📖 私人密室</title>
<script src="../core/runtime-config.js"></script>
<script src="../core/runtime.js"></script>
<script src="../core/data.js"></script>
<script src="../core/memory.js"></script>
<script src="../logger.js"></script>
<script src="../core/pwa.js" defer></script>
<script src="../core/butler_widget.js" defer></script>
<script src="../core/mobile.js" defer></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Hiragino Sans GB",serif;min-height:100vh;
     background:radial-gradient(circle at 50% 0%,#3b2f24,#241a12 70%);color:#e7dcc5;
     display:flex;align-items:center;justify-content:center;overflow:hidden}
  .back{position:fixed;left:18px;top:16px;color:#d9c9a8;text-decoration:none;font-size:14px;
     background:rgba(0,0,0,.3);padding:6px 12px;border-radius:20px}
  .private-stage{position:relative;width:100vw;height:100vh;overflow:auto;border-radius:0;padding:28px 16px;
     display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.12);
     box-shadow:none}
  h1{font-size:18px;margin-bottom:6px;letter-spacing:2px}
  .lead{color:#b6a480;font-size:13px;margin-bottom:22px;text-align:center;max-width:520px;line-height:1.7}
  .wrap{max-width:820px;width:100%;display:flex;flex-direction:column;gap:22px}
  .section{background:rgba(0,0,0,.22);border:1px solid #4a3826;border-radius:14px;padding:18px 20px}
  .section h2{font-size:14px;color:#c9b184;margin-bottom:14px;letter-spacing:1px}
  /* 铜牌墙 */
  .plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .plate{background:linear-gradient(135deg,#9a7b3f,#7a5f2c);color:#fff6df;border-radius:8px;
     padding:14px 16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15),0 6px 14px rgba(0,0,0,.4)}
  .plate .kind{font-size:11px;opacity:.85;letter-spacing:1px;margin-bottom:6px}
  .plate .txt{font-size:15px;line-height:1.6}
  .plate .date{font-size:11px;opacity:.7;margin-top:8px}
  /* 玻璃匣 */
  .glass{background:linear-gradient(135deg,rgba(180,210,220,.18),rgba(255,255,255,.06));
     border:1px solid rgba(200,220,230,.35);border-radius:12px;padding:22px;text-align:center;
     box-shadow:inset 0 0 30px rgba(180,210,230,.15)}
  .glass .word{font-size:20px;font-weight:600;color:#f0e7cf}
  .glass .lock{font-size:12px;color:#a89877;margin-top:10px}
  /* 牛皮日记 */
  .diary .entry{border-bottom:1px dashed #4a3826;padding:10px 0}
  .diary .entry:last-child{border-bottom:0}
  .diary .d{font-size:12px;color:#a89877;margin-bottom:4px}
  .diary .c{font-size:15px;line-height:1.7}
  .locked-hint{color:#8f7d5c;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<a class="back" href="../index.html">← 回小院</a>
<main class="private-stage">
<h1>📖 私人密室</h1>
<p class="lead">书房古树后面的暗格。这里不记录发生了什么，只记录——你这个人，是怎么运转的。</p>

<div class="wrap">
  <div class="section">
    <h2>🥇 铜牌墙 · 思维习惯 / 情绪模式</h2>
    <div class="plates" id="plates"></div>
    <div class="locked-hint">铜牌由树洞每累积 7 条记录后自动铸一块（source: heart_hollow_analysis）。</div>
  </div>

  <div class="section">
    <h2>🔒 玻璃匣 · 年度一句话</h2>
    <div class="glass">
      <div class="word" id="glass-word">——</div>
      <div class="lock" id="glass-lock"></div>
    </div>
  </div>

  <div class="section diary">
    <h2>📓 牛皮日记 · 我怎么运转</h2>
    <div id="diary"></div>
  </div>
</div>
</main>

<script>
let CORE = {};
async function load(){
  CORE = window.CozyRuntime ? await window.CozyRuntime.loadJson('../core/private_wing.json',{plates:[],diary:[],glass_case:{}},'private_wing') : ((window.COZY && window.COZY.private_wing) || {plates:[],diary:[],glass_case:{}});
  render();
}
function render(){
  const plates = CORE.plates||[];
  document.getElementById('plates').innerHTML = plates.length ? plates.map(p=>(
    '<div class="plate"><div class="kind">'+(p.kind||'')+'</div><div class="txt">'+(p.content||'')+'</div><div class="date">'+(p.date||'')+'</div></div>'
  )).join('') : '<div style="color:#8f7d5c;font-size:13px">还没有铜牌。去树洞多说几句。</div>';

  const g = CORE.glass_case||{};
  document.getElementById('glass-word').textContent = g.content || '（还没写下今年那句话）';
  document.getElementById('glass-lock').textContent = g.next_modifiable ? ('封存中 · '+g.next_modifiable+' 才能改') : '';

  const d = CORE.diary||[];
  document.getElementById('diary').innerHTML = d.length ? d.slice().reverse().map(x=>(
    '<div class="entry"><div class="d">'+(x.date||'')+'</div><div class="c">'+(x.content||'')+'</div></div>'
  )).join('') : '<div style="color:#8f7d5c;font-size:13px">日记还空着。</div>';
}
load();
</script>
</body>
</html>
