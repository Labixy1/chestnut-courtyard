name = "cozy-estate"
account_id = "42d36bec076af7c710aa8b8d50246870"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "demo.neuralnode.top", custom_domain = true }
]

# The interview build uses an isolated KV namespace. It never shares owner data.
[vars]
ALLOW_UNAUTHENTICATED = "true"
PUBLIC_READ_ONLY = "false"
DEMO_MODE = "true"
COZY_TEXT_PROVIDER = "workers-ai"
COZY_WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "COZY_STATE"
id = "8e44a6b1cd834024b2b147f3c2f1eabc"
