name = "cozy-estate-api"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
COZY_TEXT_PROVIDER = "deepseek"
COZY_OPENAI_MODEL = "gpt-5-mini"
COZY_OPENAI_IMAGE_MODEL = "gpt-image-2"
COZY_DEEPSEEK_MODEL = "deepseek-chat"
COZY_GLM_MODEL = "glm-4.7-flash"
COZY_QWEN_MODEL = "qwen3.7-flash"
COZY_SEEDREAM_MODEL = "doubao-seedream-5-0-pro-260628"
COZY_SEEDANCE_MODEL = "doubao-seedance-2-0-260128"

[[kv_namespaces]]
binding = "COZY_STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "COZY_PRIVATE"
bucket_name = "cozy-estate-private"

[[r2_buckets]]
binding = "COZY_MEDIA"
bucket_name = "cozy-estate-media"

[triggers]
crons = ["30 15 * * *"]
