name = "chestnut-courtyard-owner"
account_id = "42d36bec076af7c710aa8b8d50246870"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "dcxin.neuralnode.top", custom_domain = true }
]

[vars]
COZY_TEXT_PROVIDER = "workers-ai"
COZY_TEXT_FALLBACK_PROVIDER = "deepseek"
COZY_OPENAI_MODEL = "gpt-5.6-luna"
COZY_OPENAI_IMAGE_MODEL = "gpt-image-2"
COZY_GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
COZY_DEEPSEEK_MODEL = "deepseek-v4-flash"
COZY_GLM_MODEL = "glm-4.7-flash"
COZY_QWEN_MODEL = "qwen3.7-flash"
COZY_SEEDREAM_MODEL = "doubao-seedream-4-0-250828"
COZY_SEEDANCE_MODEL = "doubao-seedance-2-0-mini-260615"
COZY_WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
COZY_SEEDREAM_DEFAULT_SIZE = "1K"
COZY_SEEDREAM_DEFAULT_FORMAT = "jpeg"
COZY_OPENAI_IMAGE_DEFAULT_SIZE = "1024x1024"
COZY_OPENAI_IMAGE_DEFAULT_QUALITY = "medium"
COZY_OPENAI_IMAGE_DEFAULT_FORMAT = "webp"
COZY_VIDEO_DEFAULT_RESOLUTION = "480p"
COZY_VIDEO_DEFAULT_DURATION = "5"
COZY_MEDIA_LIMIT_BYTES = "9000000000"
COZY_MEDIA_MAX_FILE_BYTES = "100000000"
PUBLIC_READ_ONLY = "false"
ALLOW_UNAUTHENTICATED = "false"
AUTH_MODE = "passcode"

[assets]
directory = "../dist-owner"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "COZY_STATE"
id = "f1a5e526ae484fc594639ca78d7ba7ac"

[[kv_namespaces]]
binding = "COZY_BACKUP"
id = "6e1a1d6c02934bf185c01e44046d99b5"

[[r2_buckets]]
binding = "COZY_MEDIA"
bucket_name = "chestnut-courtyard-media"

[triggers]
crons = ["0 0 * * 1,3,5"]
