name = "chestnut-courtyard-owner"
account_id = "42d36bec076af7c710aa8b8d50246870"
main = "worker.js"
compatibility_date = "2026-08-01"

routes = [
  { pattern = "dcxin.neuralnode.top", custom_domain = true }
]

[vars]
COZY_TEXT_PROVIDER = "deepseek"
COZY_OPENAI_MODEL = "gpt-5-mini"
COZY_OPENAI_IMAGE_MODEL = "gpt-image-2"
COZY_GEMINI_IMAGE_MODEL = "gemini-2.5-flash-image"
COZY_DEEPSEEK_MODEL = "deepseek-chat"
COZY_GLM_MODEL = "glm-4.7-flash"
COZY_QWEN_MODEL = "qwen3.7-flash"
COZY_SEEDREAM_MODEL = "doubao-seedream-4-0-250828"
COZY_SEEDANCE_MODEL = "doubao-seedance-2-0-mini-260615"
COZY_WORKERS_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
PUBLIC_READ_ONLY = "false"
ALLOW_UNAUTHENTICATED = "false"
AUTH_MODE = "passcode"

[assets]
directory = "../dist-owner"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "COZY_STATE"
id = "f1a5e526ae484fc594639ca78d7ba7ac"

[triggers]
crons = ["0 0 */2 * *"]
