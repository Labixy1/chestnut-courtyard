name: Validate public framework

on:
  push:
  pull_request:

jobs:
  privacy-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check private data boundary
        run: python3 scripts/privacy_scan.py
      - name: Check starter and runtime modes
        run: python3 scripts/repository_readiness_test.py
      - name: Check page syntax
        run: node scripts/html_syntax_test.js
      - name: Build public preview
        run: python3 scripts/build_cloud.py
      - name: Check preview privacy
        run: python3 scripts/cloud_privacy_test.py
