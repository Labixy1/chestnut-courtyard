<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#75604a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="阿栗" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/app/icon-180.png" />
<title>阿栗</title>
<script src="core/runtime-config.js"></script>
<script src="core/runtime.js"></script>
<script src="core/data.js"></script>
<script src="core/memory.js"></script>
<script src="logger.js"></script>
<script src="core/pwa.js" defer></script>
<script src="core/butler_widget.js" defer></script>
<script src="core/mobile.js" defer></script>
<style>
  :root{
    --sky1:#f3e6d0; --sky2:#e8d7c3; --grass1:#bcd39a; --grass2:#a3c17d;
    --hill:#cfe0a8; --wood:#b98a5e; --wood-d:#9c6f45; --roof:#c97b6a;
    --ink:#5b4a3a; --paper:#f7efe1; --leaf:#8fb46a; --leaf-d:#6f9a52;
    --shadow:rgba(90,74,58,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button,input,textarea,select{font-family:inherit;letter-spacing:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",serif;
    background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,#e2c9ab);
    color:var(--ink); overflow:hidden;
  }
  /* ---- 场景容器：保持 16:9 舞台并居中，贴合生成的游戏截图式全景 ---- */
  .stage-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .stage{
    position:relative;width:100vw;height:100vh;overflow:hidden;opacity:0;transition:opacity .18s ease;
    border-radius:0;box-shadow:none;
  }
  .stage.scene-ready{opacity:1}
  /* 可选：整幅生成图铺底，缺图则用 CSS 画的场景 */
  #estate-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;
     transition:opacity .35s ease}
  /* ---- CSS 手绘天空+山丘+草地 ---- */
  .sky{position:absolute;inset:0;background:
     radial-gradient(120px 120px at 78% 18%, #fbeecb 0%, rgba(251,238,203,0) 70%),
     linear-gradient(180deg,var(--sky1),var(--sky2) 60%);}
  .cloud{position:absolute;background:#fbf3e4;border-radius:50%;opacity:.85;filter:blur(.3px)}
  .hills{position:absolute;left:0;right:0;bottom:0;height:62%}
  .hill{position:absolute;bottom:0;border-radius:50% 50% 0 0/100% 100% 0 0}
  .h1{width:70%;height:52%;left:-8%;background:var(--hill);opacity:.9}
  .h2{width:66%;height:46%;right:-6%;background:#c3d79b}
  .ground{position:absolute;left:0;right:0;bottom:0;height:40%;
     background:linear-gradient(180deg,var(--grass1),var(--grass2));border-radius:40% 40% 0 0/12% 12% 0 0}
  /* 小径 */
  .path{position:absolute;bottom:0;left:46%;width:8%;height:34%;
     background:linear-gradient(180deg,#e7d3ad,#d8bd8f);border-radius:40% 40% 0 0;transform:translateX(-50%);opacity:.9}

  /* ---------- 热点通用 ---------- */
  .spot{position:absolute;z-index:5;cursor:pointer;border:0;background:transparent;
     display:flex;flex-direction:column;align-items:center;gap:4px;transform-origin:center bottom;
     transition:transform .18s ease, filter .18s ease}
  .spot:hover{transform:translateY(-3px) scale(1.04);filter:drop-shadow(0 8px 10px var(--shadow))}
  .spot .tag{font-size:12px;color:var(--ink);background:var(--paper);
     padding:2px 9px;border-radius:20px;box-shadow:0 2px 4px var(--shadow);white-space:nowrap;opacity:.95}
  .spot .art{filter:drop-shadow(0 6px 6px var(--shadow))}

  /* 全景图模式：panorama.png 存在时，用实景百分比坐标覆盖 CSS 场景坐标 */
  .stage.has-panorama .sky,
  .stage.has-panorama .hills,
  .stage.has-panorama .ground,
  .stage.has-panorama .path{display:none}
  .stage.has-panorama .spot{
     --pan-x:50;--pan-y:50;--pan-w:10;--pan-h:10;
     left:calc(var(--pan-x)*1%);top:calc(var(--pan-y)*1%);
     right:auto;bottom:auto;width:calc(var(--pan-w)*1%);height:calc(var(--pan-h)*1%);
     min-width:44px;min-height:44px;display:block;border-radius:18px;
     filter:none;
     transform:translate(-50%,-50%);
  }
  .stage.has-panorama .spot:hover{transform:translate(-50%,-50%)}
  .stage.has-panorama .spot:before{display:none}
  .stage.has-panorama .spot .art{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);pointer-events:none}
  .stage.has-panorama .spot .art > *{visibility:hidden}
  .stage.has-panorama .spot .tag{position:absolute;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);
     color:#fff9e9;background:transparent;border:0;border-radius:0;box-shadow:none;backdrop-filter:none;
     padding:5px 4px;font-size:13px;font-weight:700;opacity:.96;
     text-shadow:0 1px 2px rgba(39,25,12,.9),0 0 7px rgba(39,25,12,.5);
     transition:opacity .16s ease,color .16s ease,text-shadow .16s ease}
  .stage.has-panorama .spot .tag:after{
     content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:rgba(255,244,207,.88);
     transform:translateX(-50%);transition:width .16s ease;
  }
  .stage.has-panorama .spot:hover .tag{
     color:#fffdf3;background:transparent;transform:translate(-50%,-50%);text-shadow:0 1px 2px rgba(39,25,12,.95),0 0 9px rgba(255,238,190,.38);
  }
  .stage.has-panorama .spot:hover .tag:after{width:72%}
  .stage.has-panorama .noticeboard .tag{top:calc(50% + 28px)}
  .stage.has-panorama .oldtree .tag{top:calc(50% + 44px)}
  .stage.has-panorama .stump .tag{top:calc(50% + 36px)}
  .stage.has-panorama .luggage .tag{top:calc(50% + 42px)}
  .stage.has-panorama .cottage .tag{top:calc(50% + 36px)}
  .stage.has-panorama .cottage .art{visibility:visible}
  .stage.has-panorama .cottage .house-roof,
  .stage.has-panorama .cottage .house-body{visibility:hidden}
  .stage.has-panorama #wall{left:68.8%;top:44%;right:auto;bottom:auto;width:10.5%;height:13%;
     transform:rotate(-2deg);z-index:7}
  .stage.has-panorama #butler{left:18px;top:18px;width:auto;max-width:320px;min-height:0;
     display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(42,34,24,.34);
     color:#fff8e8;border-color:rgba(255,246,214,.22);border-radius:999px;
     box-shadow:0 8px 20px rgba(24,18,10,.18);backdrop-filter:blur(6px);font-size:12px;line-height:1.2}
  .stage.has-panorama #butler .who{margin:0;gap:7px}
  .stage.has-panorama #butler .fox{width:28px;height:28px}
  .stage.has-panorama #butler .butler-name{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stage.has-panorama #butler .butler-weather{display:block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;font-weight:400;color:rgba(255,248,232,.72);margin-top:2px}
  .stage.has-panorama #butler .row{display:none}
  .stage.has-panorama .title{color:#fff8e8;background:rgba(42,34,24,.42);border:1px solid rgba(255,246,214,.25);
     box-shadow:0 8px 22px rgba(24,18,10,.24);backdrop-filter:blur(8px)}

  /* ---------- 小屋（卧室入口） ---------- */
  .cottage{right:6%;bottom:20%}
  .house-body{width:150px;height:96px;background:var(--wood);border-radius:8px;position:relative;
     box-shadow:inset 0 -10px 0 rgba(0,0,0,.06)}
  .house-roof{position:absolute;top:-42px;left:-14px;width:178px;height:56px;background:var(--roof);
     border-radius:10px 10px 4px 4px;transform:skewX(0);clip-path:polygon(10% 100%,50% 0,90% 100%,100% 100%,0 100%);}
  .house-door{position:absolute;bottom:0;left:16px;width:30px;height:46px;background:var(--wood-d);border-radius:14px 14px 0 0}
  .house-win{position:absolute;top:26px;right:20px;width:34px;height:30px;background:#fdf3d8;border:4px solid var(--wood-d);border-radius:6px}
  /* 外墙照片墙 */
  #wall{position:absolute;right:6%;bottom:20%;width:150px;height:96px;pointer-events:none;z-index:7}
  .wall-photo{position:absolute;width:26px;height:32px;background:#fff;border:2px solid #fff;
     box-shadow:0 2px 5px var(--shadow);pointer-events:auto;cursor:pointer;overflow:hidden;
     transition:transform .15s ease}
  .wall-photo:hover{transform:scale(1.55) rotate(0deg)!important;z-index:9}
  .wall-photo img{width:100%;height:100%;object-fit:cover;display:block}
  .wall-photo .ph-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#efe3cc}

  /* ---------- 老树（树洞） ---------- */
  .oldtree{left:6%;bottom:22%}
  .trunk{width:40px;height:90px;background:linear-gradient(90deg,#9c6f45,#7d5836);border-radius:12px;margin:0 auto;position:relative}
  .hollow{position:absolute;left:50%;top:40px;width:20px;height:28px;background:#3c2b1c;border-radius:50% 50% 45% 45%;transform:translateX(-50%)}
  .canopy{width:150px;height:120px;background:radial-gradient(circle at 40% 35%,var(--leaf),var(--leaf-d));border-radius:50%;
     margin:0 auto -22px;position:relative;box-shadow:inset -14px -10px 0 rgba(0,0,0,.08)}
  .canopy:before,.canopy:after{content:"";position:absolute;background:var(--leaf);border-radius:50%}
  .canopy:before{width:80px;height:80px;left:-24px;top:26px;background:var(--leaf-d)}
  .canopy:after{width:74px;height:74px;right:-20px;top:30px}

  /* ---------- 书房古树（私人密室） ---------- */

  /* ---------- 公告板 ---------- */
  .noticeboard{left:37%;bottom:34%}
  .board{width:96px;height:66px;background:var(--paper);border:6px solid var(--wood-d);border-radius:6px;
     display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;padding:6px;line-height:1.4}
  .board-legs{width:70px;height:26px;margin:0 auto;position:relative}
  .board-legs:before,.board-legs:after{content:"";position:absolute;top:0;width:6px;height:26px;background:var(--wood-d)}
  .board-legs:before{left:8px;transform:rotate(12deg)} .board-legs:after{right:8px;transform:rotate(-12deg)}

  /* ---------- 黑板 ---------- */
  .blackboard{right:30%;bottom:34%}
  .bb{width:92px;height:64px;background:#33443a;border:7px solid #8a5a34;border-radius:6px;color:#efe7cf;
     display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;padding:6px}
  .bb-legs{width:64px;height:24px;margin:0 auto;position:relative}
  .bb-legs:before,.bb-legs:after{content:"";position:absolute;top:0;width:6px;height:24px;background:#8a5a34}
  .bb-legs:before{left:6px;transform:rotate(12deg)} .bb-legs:after{right:6px;transform:rotate(-12deg)}

  /* ---------- 树桩（工具箱） ---------- */
  .stump{left:53%;bottom:20%}
  .stump-top{width:60px;height:20px;background:#b98a5e;border-radius:50%;position:relative;z-index:2}
  .stump-top:after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid #9c6f45}
  .stump-body{width:56px;height:34px;background:#9c6f45;margin:-8px auto 0;border-radius:0 0 10px 10px}

  /* ---------- 小果园 ---------- */
  .orchard{left:63%;bottom:22%}
  .fruittree{position:relative}
  .fruittree .canopy{width:86px;height:70px;background:radial-gradient(circle at 45% 40%,#a9c785,#7ba158)}
  .fruittree .trunk{height:44px;width:26px}
  .apple{position:absolute;width:9px;height:9px;background:#d15b4c;border-radius:50%}

  /* ---------- 行李箱（旅行入口） ---------- */
  .luggage{left:44%;bottom:16%}
  .case{width:52px;height:40px;background:#b06a4b;border:3px solid #8a4f34;border-radius:8px;position:relative}
  .case:before{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:20px;height:12px;border:3px solid #8a4f34;border-bottom:0;border-radius:8px 8px 0 0}
  .case:after{content:"";position:absolute;top:10px;left:6px;right:6px;height:4px;background:#8a4f34}

  /* ---------- 照片墙 ---------- */
  .photowall{left:58%;bottom:34%}
  .photo-wall-art{width:82px;height:54px;background:rgba(255,255,255,.88);border:5px solid #d2b07a;
     box-shadow:0 6px 14px var(--shadow);display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px}
  .photo-wall-art span{background:#b9c9ad}
  .photo-wall-art span:nth-child(2){background:#d4b694}
  .photo-wall-art span:nth-child(3){background:#9eb3c4}
  .photo-wall-art span:nth-child(4){background:#c8a6a1}
  .photo-wall-art span:nth-child(5){background:#d9ca9a}
  .photo-wall-art span:nth-child(6){background:#a9b890}

  /* ---------- 管家晨报卡片 ---------- */
  #butler{position:absolute;left:16px;top:16px;z-index:8;width:280px;background:var(--paper);
     border-radius:16px;padding:14px 16px;box-shadow:0 10px 26px var(--shadow);
     border:1px solid #e6d6ba;font-size:13px;line-height:1.6}
  #butler .who{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
  #butler .butler-copy{display:grid;min-width:0}.butler-weather{font-size:10px;font-weight:400;color:#8c7865;margin-top:2px}
  #butler .fox{width:34px;height:34px;border-radius:50%;background:url("assets/estate/butler_dog.webp") center/116% no-repeat;
     position:relative;flex:none;box-shadow:0 2px 8px var(--shadow);border:0}
  #butler .row{margin:4px 0;color:#6b5949}
  #butler .row b{color:var(--ink)}

  .estate-top-actions{position:absolute;right:18px;top:14px;z-index:8;display:flex;align-items:center;justify-content:flex-end;gap:6px;max-width:calc(100vw - 36px)}
  .title{position:static;font-size:13px;color:#7d6a55;
     background:rgba(247,239,225,.7);padding:4px 12px;border-radius:20px}
  .demo-controls{display:flex;align-items:center;gap:5px}.demo-controls[hidden]{display:none}.demo-control{height:29px;border:1px solid rgba(255,246,214,.25);border-radius:8px;background:rgba(42,34,24,.42);color:#fff8e8;padding:0 9px;font-family:inherit;font-size:11px;cursor:pointer;box-shadow:0 8px 22px rgba(24,18,10,.18);backdrop-filter:blur(8px)}.demo-control:hover{background:rgba(42,34,24,.62)}.demo-control:disabled{opacity:.55;cursor:wait}.demo-control.ai-active{background:rgba(62,103,69,.72);border-color:rgba(198,235,194,.36)}
  .demo-dialog{position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:18px;background:rgba(35,27,20,.48);backdrop-filter:blur(5px)}.demo-dialog.show{display:grid}.demo-dialog-card{width:min(390px,100%);background:#fffaf1;border:1px solid rgba(101,72,45,.16);border-radius:12px;padding:22px;color:#49392d;box-shadow:0 24px 70px rgba(35,24,16,.34)}.demo-dialog-head{display:flex;align-items:start;justify-content:space-between;gap:12px}.demo-dialog-head h2{font-size:18px}.demo-dialog-head button{width:30px;height:30px;border:0;border-radius:50%;background:#f0e3d2;color:#715d49;cursor:pointer}.demo-dialog-card p{font-size:12px;line-height:1.7;color:#806d5c;margin:8px 0 14px}.demo-password-wrap{position:relative}.demo-password-wrap input{width:100%;height:42px;border:1px solid rgba(101,72,45,.22);border-radius:9px;background:#fff;padding:0 44px 0 12px;font:13px inherit;color:#49392d;outline:none}.demo-password-wrap button{position:absolute;right:3px;top:3px;width:36px;height:36px;border:0;background:transparent;color:#786451;cursor:pointer}.demo-dialog-actions{display:flex;gap:8px;margin-top:12px}.demo-dialog-actions button{flex:1;height:38px;border:0;border-radius:9px;background:#775d45;color:#fffaf1;font:12px inherit;cursor:pointer}.demo-dialog-actions button.secondary{background:#e9dbca;color:#624f3d}.demo-dialog-status{min-height:18px;margin-top:9px;font-size:11px;color:#9c5e4f}.demo-guide-list{display:grid;gap:10px;margin:14px 0}.demo-guide-step{display:grid;grid-template-columns:24px 1fr;gap:9px;align-items:start}.demo-guide-step b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#e7d7bd;color:#6f563f;font-size:11px}.demo-guide-step span{font-size:12px;line-height:1.6;color:#665342}
  @media(max-width:760px){.estate-top-actions{align-items:flex-end;flex-direction:column}.demo-controls{max-width:min(92vw,360px);overflow:auto}.demo-control{white-space:nowrap}.title{align-self:flex-end}}

  /* ---------- 弹层（工具箱 / 照片预览） ---------- */
  .overlay{position:fixed;inset:0;z-index:20;background:rgba(60,43,28,.42);display:none;
     align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(2px)}
  .overlay.show{display:flex}
  .panel{background:var(--paper);border-radius:0;padding:22px;max-width:760px;width:100%;max-height:82vh;
     overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .panel.scene-panel{width:100vw;height:100vh;max-width:none;max-height:none;padding:0;overflow:hidden;border-radius:0}
  .panel h2{font-size:18px;margin-bottom:4px}
  .panel .sub{color:#8a7963;font-size:12px;margin-bottom:16px}
  .close{float:right;border:0;background:#e7d6b9;border-radius:50%;width:30px;height:30px;cursor:pointer;font-size:16px;color:var(--ink)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .card{background:#fff;border:1px solid #ecddc2;border-radius:12px;padding:12px 14px}
  .card h3{font-size:14px;margin-bottom:6px}
  .card p{font-size:12px;color:#6b5949;margin:3px 0;line-height:1.5}
  .card .k{color:#a3927b}
  .card a{font-size:12px;color:#b06a4b;text-decoration:none}
  .tool-group{margin-top:14px}
  .tool-group h3{font-size:14px;margin-bottom:8px;color:#6b4b2e}
  .tool-group .cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .toolbox-panel,.notice-panel,.blackboard-panel{position:relative;width:min(920px,calc(100vw - 48px));height:min(680px,calc(100vh - 48px));
     max-width:none;max-height:none;border-radius:24px;padding:0;overflow:hidden}
  .toolbox-panel .close,.notice-panel .close,.blackboard-panel .close{position:absolute;right:16px;top:16px;float:none;background:rgba(255,248,239,.9);z-index:8}
  .toolbox-panel{background:#fff8ef;display:grid;grid-template-rows:auto minmax(0,1fr)}
  .toolbox-head{padding:22px 58px 14px 24px;background:#f8e7d4;border-bottom:1px solid #ead2ba}
  .toolbox-head h2{font-size:18px;margin-bottom:4px;color:#5a3a24}
  .toolbox-import{display:none;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:10px;padding:10px;
     border:1px solid #e1c6a8;border-radius:12px;background:rgba(255,253,249,.72)}
  .toolbox-import.is-open{display:grid}
  .toolbox-import input{min-width:0;height:40px;border:1px solid #d9b995;border-radius:10px;background:#fffdf9;
     padding:0 12px;color:#503a29;font-family:inherit;font-size:13px;outline:none}
  .toolbox-import input:focus{border-color:#9d704c;box-shadow:0 0 0 3px rgba(157,112,76,.12)}
  .toolbox-import button{height:40px;border:0;border-radius:10px;padding:0 15px;background:#765338;color:#fffaf2;
     font-family:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .toolbox-import button:disabled{opacity:.55;cursor:default}
  .toolbox-import-status{grid-column:1/-1;min-height:16px;font-size:11px;color:#846b56}
  .toolbox-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .toolbox-nav button{border:1px solid #dfc2a4;background:rgba(255,255,255,.58);color:#6b4b2e;
     border-radius:999px;padding:7px 13px;cursor:pointer;font:inherit;font-size:13px}
  .toolbox-nav .toolbox-filter.active,.toolbox-nav button:hover{background:#8f6240;color:#fff8ef;border-color:#8f6240}
  .toolbox-nav .toolbox-import-toggle{border-style:dashed;background:rgba(255,251,245,.36);color:#865e3e}
  .toolbox-nav .toolbox-import-toggle[aria-expanded="true"]{background:#765338;color:#fffaf2;border-style:solid;border-color:#765338}
  .toolbox-body{height:auto;min-height:0;padding:18px 24px 24px;overflow:auto}
  .toolbox-panel .tool-group{margin-top:0;margin-bottom:18px}
  .toolbox-panel .tool-group.is-hidden{display:none}
  .toolbox-panel .cards{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));align-items:stretch;grid-auto-rows:1fr}
  .toolbox-panel .card{border-radius:12px;background:#fffdf8}
  .tool-card{display:grid;grid-template-rows:auto auto auto auto auto 1fr auto;align-content:start;gap:11px;height:430px;overflow:auto;scrollbar-width:thin;padding:15px 16px!important;box-shadow:0 5px 18px rgba(91,65,41,.05)}
  .tool-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

<script>
function localCalendarDate(){
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
/* ---------- 数据加载：由运行模式决定本地实例或安全示例包 ---------- */
async function loadCore(){
  const fallback = window.COZY || {};
  const files = {estate_state:'core/estate_state.json',heart_hollow:'core/heart_hollow.json',
                 private_wing:'core/private_wing.json',manifest:'core/manifest.json',
                 notice_reports:'core/notice_reports.json',butler_sources:'core/butler_sources.json',
                 daily_questions:'core/daily_questions.json'};
  const entries=await Promise.all(Object.entries(files).map(async ([k,path])=>[
    k,window.CozyRuntime ? await window.CozyRuntime.loadJson(path,{},k) : (fallback[k] || {})
  ]));
  return Object.fromEntries(entries);
}

let CORE = {};
const CORE_READY = (async ()=>{
  CORE = await loadCore();
  renderWall();
  renderTitle();
  renderButlerState();
  return CORE;
})();

/* ---------- 外墙照片墙 ---------- */
function renderWall(){
  const wall = document.getElementById('wall');
  wall.innerHTML = '';
}
function fallbackBox(type){
  const b = document.createElement('div');
  b.className = 'ph-fallback';
  b.textContent = type === 'travel' ? '🏔️' : '📷';
  return b;
}
function renderTitle(){
  document.title = '阿栗';
}
function renderButlerState(){
  const events = window.CozyMemory ? CozyMemory.merged() : [];
  const today = localCalendarDate();
  const todayEvents = events.filter(e=>e.date === today);
  const bySource = {};
  todayEvents.forEach(e=>{ bySource[e.source || 'unknown'] = (bySource[e.source || 'unknown'] || 0) + 1; });
  const greeting = document.getElementById('b-greeting');
  const news = document.getElementById('b-news');
  const tip = document.getElementById('b-tip');
  const quiz = document.getElementById('b-quiz');
  if(greeting){
    const active = Object.keys(bySource).length;
    greeting.textContent = active ? '今天小院已经有 '+todayEvents.length+' 条新动静，阿栗都收进密阁索引了。' : '早安，小院主人。今天还很安静，阿栗在门口值班。';
  }
  if(news){
    const requests = readNoticeList('cozy_notice_requests').filter(x=>x.kind !== 'media_source');
    news.textContent = requests[0] ? '阿栗记得你想看：'+requests[0].text.slice(0,18) : '公告板等你给一个关注方向';
  }
  if(tip){
    const seeds = JSON.parse(localStorage.getItem('cozy_orchard_seeds') || '[]');
    tip.textContent = seeds[0] ? '果园最新种子：'+seeds[0].text.slice(0,18) : '可以去成长田丢一个困惑';
  }
  if(quiz){
    const answers = JSON.parse(localStorage.getItem('cozy_blackboard_answers') || '[]');
    quiz.textContent = answers[0] ? '最近答过：'+answers[0].title : '今日题还没答';
  }
}
/* ---------- 弹层 ---------- */
function openOverlay(html, panelClass=''){
  const panel = document.getElementById('panel');
  panel.className = 'panel' + (panelClass ? ' ' + panelClass : '');
  panel.innerHTML =
    '<button class="close '+(panelClass.includes('scene-panel')?'scene-close':'')+'" onclick="closeOverlay()">×</button>' + html;
  document.getElementById('overlay').classList.add('show');
}
function closeOverlay(){ document.getElementById('overlay').classList.remove('show'); window.CozyMobile?.activate('index'); }

function openPhoto(p){
  const fb = p.type === 'travel' ? '🏔️' : '📷';
  openOverlay(
    '<img class="preview-photo" src="'+p.file+'" onerror="this.outerHTML=\'<div class=&quot;preview-photo&quot; style=&quot;display:flex;align-items:center;justify-content:center;font-size:60px;background:#efe3cc&quot;>'+fb+'</div>\'">'+
    '<div class="preview-note">'+(p.note||'')+'</div>'+
    '<div class="preview-date">'+(p.date||'')+' · '+(p.type==='travel'?'旅行':'生活')+'</div>'
  );
}

async function openToolbox(){
  await CORE_READY;
  if(window.CozyRuntime?.dataSource==='remote'){
    try{
      const data=await cozyApi('/api/state',undefined,6000);
      applyButlerServerState(data.state,true);
    }catch(error){ /* 保留本机缓存，仍允许打开工具箱 */ }
  }
  skillZoneLoaded=false;
  const localItems = JSON.parse(localStorage.getItem('cozy_toolbox_local_items') || '[]');
  const combined = ((CORE.manifest && CORE.manifest.items)||[]).filter(i=>i.type==='toolbox').concat(localItems);
  const seen = new Set();
  const items = combined.slice().reverse().filter(item=>{
    const key = [item.title || '',item.url || ''].map(value=>String(value).trim().toLowerCase()).join('|');
    if(!key || seen.has(key)) return false;
    seen.add(key); return true;
  }).reverse().map(item=>Object.assign({},item,{category:toolboxCategory(item)}));
  window.TOOLBOX_ITEMS_BY_KEY={};
  items.forEach(item=>{window.TOOLBOX_ITEMS_BY_KEY[toolItemKey(item)]=item;});
  const preferred = ['写代码','学术','图像与视频','产品与原型','办公与中文','本地与协议','其他'];
  const categories = preferred.filter(name=>items.some(item=>item.category===name))
    .concat([...new Set(items.map(item=>item.category))].filter(name=>!preferred.includes(name)));
  const block = categories.map(name=>{
    const groupItems = items.filter(item=>item.category===name);
    return '<div class="tool-group" data-tool-group="'+escapeNotice(name)+'"><h3>'+escapeNotice(name)+'</h3><div class="cards">'+groupItems.map(toolCard).join('')+'</div></div>';
  }).join('');
  const nav = ['全部'].concat(categories).map((name,idx)=>
    '<button class="toolbox-filter '+(idx===0?'active':'')+'" onclick="setToolboxGroup(\''+name+'\',this)">'+name+'</button>').join('');
  openOverlay('<div class="toolbox-head"><h2>工具箱</h2><div class="sub">按使用场景收纳，需要新工具时从分类栏末尾加入。</div>'+
    '<nav class="toolbox-nav">'+nav+'<button class="toolbox-filter skill-zone-tab" onclick="setToolboxGroup(\'Skills\',this)">Skills</button><button class="toolbox-import-toggle" id="toolbox-import-toggle" aria-expanded="false" title="解析工具官网或资讯链接" onclick="toggleToolboxImport()">＋ 解析加入</button></nav>'+
    '<div class="toolbox-import" id="toolbox-import"><input id="toolbox-link-input" type="url" placeholder="粘贴工具官网或资讯链接" onkeydown="if(event.key===\'Enter\')importToolboxLink()" />'+
    '<button id="toolbox-import-btn" onclick="importToolboxLink()">解析并加入</button><div class="toolbox-import-status" id="toolbox-import-status"></div></div></div>'+
    '<div class="toolbox-body"><div id="toolbox-groups">'+(block || '<p class="sub">工具箱还是空的，先加入一个工具。</p>')+'</div>'+skillZoneShell()+'</div>', 'toolbox-panel');
  const zone=document.getElementById('skill-zone');
  if(zone)zone.hidden=false;
  loadSkillZone();
}

function toggleToolboxImport(force){
  const form=document.getElementById('toolbox-import');
  const toggle=document.getElementById('toolbox-import-toggle');
  if(!form||!toggle) return;
  const open=typeof force==='boolean'?force:!form.classList.contains('is-open');
  form.classList.toggle('is-open',open);
  toggle.setAttribute('aria-expanded',open?'true':'false');
  if(open){ const input=document.getElementById('toolbox-link-input'); if(input) input.focus(); }
}

function toolboxCategory(item){
  const raw=String(item.category||'').trim();
  const title=String(item.title||'');
  const text=[raw,title,item.purpose||'',...(item.key_capabilities||[]),...(item.use_cases||[])].join(' ');
  if(/科研|学术|论文|research|paper/i.test(text)) return '学术';
  if(/代码|编程|开发|code/i.test(text)) return '写代码';
  if(/图像|图片|视频|设计|生图|image|video/i.test(text)) return '图像与视频';
  if(/原型|产品|工作流|agent/i.test(text)) return '产品与原型';
  if(/办公|中文|文档|表格|office/i.test(text)) return '办公与中文';
  if(/本地|协议|MCP/i.test(text)) return '本地与协议';
  if(/Cursor|Claude Code|Codex/i.test(title)) return '写代码';
  if(/Science|Research|论文|科研/i.test(title)) return '学术';
  if(/Seedream|Seedance|Image|Midjourney/i.test(title)) return '图像与视频';
  if(/Qwen Work/i.test(title)) return '办公与中文';
  if(/Ollama|MCP/i.test(title)) return '本地与协议';
  return raw || '其他';
}

function toolItemKey(item){
  return [item&&item.title||'',item&&item.url||''].map(value=>String(value).trim().toLowerCase()).join('|');
}

function setToolboxGroup(name, btn){
  document.querySelectorAll('.toolbox-nav .toolbox-filter').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  const skills=name==='Skills';
  const includeSkills=skills||name==='全部';
  const groups=document.getElementById('toolbox-groups');
  const zone=document.getElementById('skill-zone');
  if(groups)groups.hidden=skills;
  if(zone)zone.hidden=!includeSkills;
  document.querySelectorAll('.toolbox-panel .tool-group').forEach(group=>{
    group.classList.toggle('is-hidden', skills || (name !== '全部' && group.dataset.toolGroup !== name));
  });
  if(includeSkills)loadSkillZone();
}

  showBlackboardMode('question');
  try{
    const savedAnswers=JSON.parse(localStorage.getItem('cozy_blackboard_answers')||'[]');

    delete state.answer;delete state.review;delete state.nextQuestion;delete state.nextQuestionReference;delete state.nextQuestionIdealAnswer;
    state.locked=false;
    const saved=findSavedBlackboardAnswer(JSON.parse(localStorage.getItem('cozy_blackboard_answers')||'[]'),state.questionData);
    if(saved){state.answer=saved.answer;state.review=saved.review;state.nextQuestion=saved.next_question||'';state.nextQuestionReference=saved.next_question_reference||[];state.nextQuestionIdealAnswer=saved.next_question_ideal_answer||'';state.locked=true;}

function blackboardQuestionSimilarity(left,right){

function blackboardScoreBand(awarded,max){

  if(score===0)return'absent';if(score/ceiling>=.9)return'excellent';if(score/ceiling>=.65)return'solid';if(score/ceiling>=1/3)return'developing';return'weak';

function normalizeNextBlackboardPractice(result){
  const question=String(result?.next_question||'').trim();
  const reference=(Array.isArray(result?.next_question_reference)?result.next_question_reference:[]).map(String).map(item=>item.trim()).filter(Boolean).slice(0,6);

}

const NOTICE_FOUND_SEEN_KEY='cozy_notice_found_seen_v1';
function readNoticeFoundSeen(){
  try{const value=JSON.parse(localStorage.getItem(NOTICE_FOUND_SEEN_KEY)||'{}');return value&&typeof value==='object'&&!Array.isArray(value)?value:{};}
  catch(_error){return {};}
}
function writeNoticeFoundSeen(value){
  const trimmed=Object.fromEntries(Object.entries(value).sort((left,right)=>String(right[1]).localeCompare(String(left[1]))).slice(0,240));
  localStorage.setItem(NOTICE_FOUND_SEEN_KEY,JSON.stringify(trimmed));
}
function markNoticeFoundItemsSeen(items){
  const seen=readNoticeFoundSeen(),seenAt=new Date().toISOString();let changed=false;
  (items||[]).forEach(item=>{const key=(item._request_id||'')+'|'+noticeItemKey(item);if(item._request_id&&noticeItemKey(item)&&!seen[key]){seen[key]=seenAt;changed=true;}});
  if(changed)writeNoticeFoundSeen(seen);
}
function noticeRequestIdentity(request,index){
  if(request.id||request.task_id)return String(request.id||request.task_id);
  const value=[request.date||'',request.text||'',index].join('|');
  let hash=2166136261;
  for(const char of value){hash^=char.charCodeAt(0);hash=Math.imul(hash,16777619);}
  return 'notice_request_'+(hash>>>0).toString(36);
}
function prepareNoticeFoundResults(){
  const requests=readNoticeList('cozy_notice_requests');
  const pending=[],seen=readNoticeFoundSeen();
  requests.forEach((request,index)=>{
    if(!Array.isArray(request.found_items)||!request.found_items.length)return;
    const requestId=noticeRequestIdentity(request,index);
    request.found_items.forEach(item=>{const key=requestId+'|'+noticeItemKey(item);if(noticeItemKey(item)&&!seen[key])pending.push({...item,_request_text:request.text||'未命名留言',_request_id:requestId});});
  });
  if(pending.length){NOTICE_FOUND_RESULTS=pending;markNoticeFoundItemsSeen(pending);}
  return pending;
}

async function syncNoticeFoundResultsFromCloud(){
  if(window.CozyRuntime?.dataSource==='remote'&&window.CozyButler?.syncLocalState){
    await window.CozyButler.syncLocalState(['cozy_notice_requests']).catch(()=>{});
  }
  return prepareNoticeFoundResults();
}

function acceptNoticeFollowupResponse(followups){
  const matches=Array.isArray(followups?.matches)?followups.matches:[];
  const incoming=[];
  matches.forEach(match=>{
    const requestText=String(match?.request_text||'未命名留言');
    const requestId=String(match?.request_id||'');
    (Array.isArray(match?.items)?match.items:[]).forEach(item=>incoming.push({...item,_request_text:requestText,_request_id:requestId}));
  });
  if(!incoming.length)return [];
  markNoticeFoundItemsSeen(incoming);
  const seen=new Set();
  NOTICE_FOUND_RESULTS=[...incoming,...NOTICE_FOUND_RESULTS].filter(item=>{
    const key=(item._request_id||'')+'|'+noticeItemKey(item);
    if(!noticeItemKey(item)||seen.has(key))return false;
    seen.add(key);return true;
  });
  return incoming;
}

async function refreshNoticeReportsFromCloud(){
  if(window.CozyRuntime?.dataSource!=='remote')return false;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),20000);
  try{
    const response=await fetch('/api/data?key=notice_reports&t='+Date.now(),{
      cache:'no-store',credentials:'same-origin',signal:controller.signal,
      headers:{accept:'application/json'}
    });
    if(!response.ok)throw new Error('HTTP '+response.status);
    const reports=await response.json();
    if(!reports||!Array.isArray(reports.reports))throw new Error('巡报数据格式不完整');
    CORE.notice_reports=reports;
    updateNoticeCadence();
    const active=document.querySelector('.notice-tabs button.active');
    if(active)showNoticeView(active.textContent.includes('往期')?'weeks':active.textContent.includes('分类')?'categories':active.textContent.includes('稍后')?'inbox':'current',active);

  }catch(error){

      if(status)status.textContent='真实巡报暂时没有读取成功，请点击“获取最新资讯”重试。';
    }
    return false;
  }finally{clearTimeout(timer);}
}

function getWeekRange(offset=0){
  const now = new Date();
  const day = now.getDay() || 7;
  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1 + offset * 7);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const fmt = d => (d.getMonth()+1)+'月'+d.getDate()+'日';
  return fmt(monday)+' - '+fmt(sunday);
}

const NOTICE_REFRESH_KEY='cozy_notice_refresh_status';
let noticeRefreshPollTimer=null;
let noticeManualRefreshPending=false;
function setNoticeRefreshState(status,message){
  const state={status,message:String(message||''),updated_at:new Date().toISOString()};
  localStorage.setItem(NOTICE_REFRESH_KEY,JSON.stringify(state));
  const button=document.getElementById('notice-refresh'),title=document.getElementById('notice-week-title');
  if(button){button.disabled=status==='running';button.classList.toggle('running',status==='running');button.textContent=status==='running'?'正在获取…':status==='failed'?'重新获取资讯':'获取最新资讯';button.title=status==='failed'?message:(status==='running'?'正在获取最新资讯':'获取最新资讯');button.setAttribute('aria-label',button.title);}
  if(title&&message)title.textContent=message;
  return state;
}
function readNoticeRefreshState(){try{return JSON.parse(localStorage.getItem(NOTICE_REFRESH_KEY)||'null');}catch(error){return null;}}
async function resumeNoticeRefresh(){
  clearTimeout(noticeRefreshPollTimer);noticeRefreshPollTimer=null;
  const cached=readNoticeRefreshState();if(cached)setNoticeRefreshState(cached.status,cached.message);
  try{
    const data=await cozyApi('/api/automation',undefined,15000),jobs=data.automation?.jobs||{},job=jobs.weekly_report||jobs.notice_report;
    if(job){const status=job.status==='ready'?'completed':job.status;setNoticeRefreshState(status,job.message||(status==='running'?'阿栗正在更新巡报。':status==='failed'?'巡报更新失败。':'巡报已经更新完成。'));if(status==='failed')noticeManualRefreshPending=false;if(status==='completed'){let reports=await cozyApi('/api/data?key=notice_reports',undefined,18000).catch(()=>null);if(!reports?.reports){reports=await fetch('core/notice_reports.json',{cache:'no-store'}).then(response=>response.ok?response.json():null).catch(()=>null);}if(reports?.reports){CORE.notice_reports=reports;await syncNoticeFoundResultsFromCloud();noticeManualRefreshPending=false;updateNoticeCadence();const active=document.querySelector('.notice-tabs button.active');if(active?.textContent.includes('最新'))showNoticeView('current',active);}}}
  }catch(error){
    const existing=(CORE.notice_reports?.reports||[]).filter(report=>report?.id!=='fallback');
    if(existing.length)setNoticeRefreshState('completed','云端状态暂时未连上，现有 '+existing.length+' 版巡报仍可正常阅读。');
  }
  if(readNoticeRefreshState()?.status==='running')noticeRefreshPollTimer=setTimeout(resumeNoticeRefresh,1800);
}

function noticeWeekLabel(report){
  const format=value=>{
    const date=new Date(value);
    if(Number.isNaN(date.getTime()))return '';
    const parts=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date);
    const get=type=>parts.find(part=>part.type===type)?.value||'';
    return Number(get('month'))+'月'+Number(get('day'))+'日 '+get('hour')+':'+get('minute');
  };
  if(report?.schedule_slot){
    const slot=format(report.schedule_slot);
    if(slot)return slot+(report.update_mode==='manual_retry'?' 计划 · 手动补更':' 计划更新');
  }
  if(report && report.generated_at){
    const generated=new Date(report.generated_at),label=format(report.generated_at);
    if(!Number.isNaN(generated.getTime())&&label){
      const shanghaiWeekday=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',weekday:'short'}).format(generated);
      const shanghaiHour=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',hour:'2-digit',hourCycle:'h23'}).format(generated);
      return label+(['Mon','Wed','Fri'].includes(shanghaiWeekday)&&shanghaiHour==='08'?' 计划更新':' 手动更新');
    }
  }
  if(report && report.week_start && report.week_end){
    return formatIsoDate(report.week_start)+' - '+formatIsoDate(report.week_end);
  }
  return getWeekRange(0);
}

function formatIsoDate(iso){
  const parts = String(iso || '').split('-');
  if(parts.length >= 3) return Number(parts[1])+'月'+Number(parts[2])+'日';
  return iso || '';
}

function noticePublishedLabel(item){
  const raw=item&&[item.published,item.date,item.published_at].find(value=>String(value||'').trim());
  if(!raw)return '本周';
  const text=String(raw).trim();
  if(/^\d{1,2}月\d{1,2}日$/.test(text))return text;
  const parsed=new Date(text);
  if(!Number.isNaN(parsed.getTime()))return (parsed.getMonth()+1)+'月'+parsed.getDate()+'日';
  return '本周';
}

function cleanNoticeDisplayText(value){
  let text=String(value||'');
  for(let pass=0;pass<2;pass+=1){
    text=text.replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/&nbsp;/gi,' ')
      .replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'")
      .replace(/&#(\d+);/g,(_match,code)=>String.fromCodePoint(Number(code)))
      .replace(/&#x([0-9a-f]+);/gi,(_match,code)=>String.fromCodePoint(parseInt(code,16)))
      .replace(/&amp;/gi,'&');
  }
  return text.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
}

function noticeTextIsChinese(value,minChinese=8){
  const text=cleanNoticeDisplayText(value);
  const chinese=(text.match(/[\u4e00-\u9fff]/g)||[]).length;
  const latin=(text.match(/[A-Za-z]/g)||[]).length;
  return chinese>=minChinese&&chinese>=latin*.25;
}

      const source=new URL(sourceRaw,location.href);
      const sourcePath=source.pathname.replace(/\/+$/,'')||'/';
      sameAsSourceHome=parsed.origin===source.origin&&path===sourcePath&&!/\.(?:rss|xml|atom)$/i.test(path);
    }catch(_error){}
    if(item.link_kind==='source_homepage'||item.link_kind==='unavailable'||listingPaths.has(path)||sameAsSourceHome||/\.(?:rss|xml|atom)$/i.test(path)){
      return {url:'',original:'',localized:false,unavailable:true};
    }
    const localized=item.localized_url||item.zh_url||'';
    if(localized){
      const localizedUrl=new URL(localized,location.href);
      if(/^https?:$/.test(localizedUrl.protocol))return {url:localizedUrl.toString(),original:parsed.toString(),localized:true};
    }
  }catch(_error){}
  return {url:raw,original:raw,localized:false};
}

function noticeNoteFor(key){
  return readNoticeList('cozy_notice_notes').find(item=>item.key===key)||null;
}

function noticeNoteId(key){
  let hash=2166136261;
  for(let i=0;i<key.length;i++){hash^=key.charCodeAt(i);hash=Math.imul(hash,16777619);}
  return 'notice_note_'+(hash>>>0).toString(36);
}

function formatNoticeNoteTime(value){
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return '';
  return (date.getMonth()+1)+'月'+date.getDate()+'日 '+String(date.getHours()).padStart(2,'0')+':'+String(date.getMinutes()).padStart(2,'0');
}

function saveNoticeNote(button){
  const panel=button.closest('.notice-note'),textarea=panel?.querySelector('textarea'),state=panel?.querySelector('.notice-note-state');
  if(!panel||!textarea)return;
  const content=textarea.value.trim();
  if(!content){if(state)state.textContent='先写一点内容再保存';return;}
  const key=panel.dataset.noteKey,title=panel.dataset.noteTitle||'未命名资讯',url=panel.dataset.noteUrl||'',updated_at=new Date().toISOString();
  const notes=readNoticeList('cozy_notice_notes').filter(item=>item.key!==key);
  notes.unshift({key,title,url,content,updated_at});
  writeNoticeList('cozy_notice_notes',notes,200);
  panel.querySelector('summary').textContent='阅读笔记 · 已保存';
  if(state)state.textContent='已保存并同步 · '+formatNoticeNoteTime(updated_at);
  window.CozyMemory?.add({id:noticeNoteId(key),source:'noticeboard',type:'reading_note',layer:'long',weight:2,content:'资讯：'+title+'\n阅读笔记：'+content+(url?'\n原文：'+url:''),summary:'资讯笔记：'+title});
}

function deleteNoticeNote(button){
  const panel=button.closest('.notice-note'),textarea=panel?.querySelector('textarea'),state=panel?.querySelector('.notice-note-state');
  if(!panel)return;
  const notes=readNoticeList('cozy_notice_notes').filter(item=>item.key!==panel.dataset.noteKey);
  writeNoticeList('cozy_notice_notes',notes,200);
  window.CozyMemory?.forget(noticeNoteId(panel.dataset.noteKey));
  if(textarea)textarea.value='';
  panel.querySelector('summary').textContent='阅读笔记';
  if(state)state.textContent='笔记已清空';
}

async function copyNoticeLink(btn){
  const url=btn&&btn.dataset.url||'';
  if(!url)return;
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(url);
    else{const input=document.createElement('textarea');input.value=url;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();document.execCommand('copy');input.remove();}
    const old=btn.textContent;btn.textContent='已复制';setTimeout(()=>{if(btn.isConnected)btn.textContent=old;},1400);
  }catch(error){const status=document.getElementById('notice-status');if(status)status.textContent='复制失败，可以点“查看原文”后复制地址。';}
}

async function extractToolFromNotice(btn){
  if(!btn||btn.disabled)return;
  const url=btn.dataset.url||'',title=btn.dataset.title||'这篇资讯';
  if(!url)return;
  const old=btn.textContent;btn.disabled=true;btn.textContent='解析中';
  const status=document.getElementById('notice-status');
  if(status)status.textContent='阿栗正在读原文，识别其中可直接使用的工具、官网与关键能力。';
  try{
    const source={title,summary:btn.dataset.summary||'',ai_summary:btn.dataset.aiSummary||'',category:btn.dataset.category||'',media:btn.dataset.media||'',url};
    const data=await cozyApi('/api/toolbox/import',{url,source,instruction:'从资讯《'+title+'》提取文中真正可使用的工具；确认官方使用地址、类别、用途、关键能力、适用场景和例子后加入工具箱。'},180000);
    if(data.state)applyButlerServerState(data.state,false);
    btn.textContent='已加入';
    if(status)status.textContent='已加入工具箱：'+((data.item&&data.item.title)||title);
  }catch(error){btn.disabled=false;btn.textContent=old;if(status)status.textContent='工具提取失败：'+error.message;}
}

function isDynamicItem(section, item){
  const name = section.name || '';

function isProductItem(section, item){
  const text = [section.name, item.title, item.summary, item.main_takeaway, (item.watch_points||[]).join(' ')].join(' ');
  if(/基金|融资|估值|暴雷|招聘|职位/.test(text)) return false;
  return /产品相关精选|产品|效率|工作流|PM|经理|体验|工具提高|实践|工具更新|科研|Skills|Claude Science|评测|benchmark|eval|记忆|memory|原型|prototype|Agent|MCP/i.test(text);
}

function curatedNoticeItems(items, limit){
  const usedTags = new Set();
  const out = [];
  items.forEach(item=>{
    const tag = noticeSubcategory(item);
    if(out.length >= limit) return;
    if(usedTags.has(tag) && out.length >= Math.ceil(limit/2)) return;
    out.push(item);
    usedTags.add(tag);
  });
  return out.slice(0, limit);
}

function noticeItemDisplayable(item){
  const title=cleanNoticeDisplayText(item?.title||'').replace(/\s+-\s+[^–—-]{2,50}$/,'').trim();
  if(!preferredNoticeUrl(item).original)return false;
  if(/^(错误码|帮助文档|首页|登录|注册|搜索结果|产品文档)|提示词指南$|服务条款|隐私政策/.test(title))return false;
  const normalize=value=>cleanNoticeDisplayText(value).toLowerCase().replace(/[^0-9a-z\u4e00-\u9fff]+/g,'');
  const titleKey=normalize(title);
  const summaries=[item?.source_summary,item?.original_summary,item?.summary,item?.translation_zh,item?.ai_summary].map(normalize).filter(Boolean);
  if(!summaries.some(value=>value!==titleKey))return false;
  const summary=cleanNoticeDisplayText(item?.ai_summary||'');
  if(/(回应|澄清|辟谣|否认)/.test(title)&&/(这意味着|因此|由此可见).{0,30}(将|会|开始|已经).{0,20}(收费|收取费用|涨价|停服|停止|取消|关闭)/.test(summary))return false;
  return true;
}

function weeklyReportBody(report){
  const hot = Array.isArray(report.hot_items) ? report.hot_items : [];
  const hotKeys = new Set(hot.map(item=>String(item.link||item.url||item.title||'').toLowerCase()));
  const hotBlock = '<section class="report-section hot-report-section"><h3>热点速览</h3>'+
    (hot.length ? hot.map(item=>reportCardHtml(item,item.category)).join('') : (report.quick||[]).map((item,index)=>quickCardHtml(item,index)).join(''))+'</section>';
  const sections = (report.sections||[]).map(section=>{
    const items=(section.items||[]).filter(item=>!hotKeys.has(String(item.link||item.url||item.title||'').toLowerCase()));
    return '<section class="report-section"><h3>'+escapeNotice(section.name||'周报栏目')+'</h3>'+(items.length?items.map(item=>reportCardHtml(item,item.category||section.name)).join(''):'<p class="notice-empty-line">本栏重点已收录到上方热点速览。</p>')+'</section>';
  }).join('');
  const insights = noticeInsightBlock(report);
  const advice = noticeAdviceBlock(report);
  return '<div class="week-report-body">'+hotBlock+sections+insights+advice+'</div>';
}

function noticeInsightBlock(report){
  if(report?.provider==='source-fallback')return '<section class="insight-box notice-error-box"><h3>本版整理状态</h3><p>资讯 AI 整理失败：旧版未保存具体错误；该版仅保留原始资讯。</p></section>';
  const items=report.insights||[];
  return '<section class="insight-box"><h3>案例总结</h3><ul>'+(items.length?items.map(item=>'<li>'+escapeNotice(item)+'</li>').join(''):'<li>阿栗还在整理这批资讯之间的共同变化。</li>')+'</ul></section>';
}

function noticeAdvice(report){
  if(Array.isArray(report.advice)&&report.advice.length)return report.advice;
  const all=(report.hot_items||[]).concat(flattenReportItems(report));
  const text=all.map(item=>[item.title,item.ai_summary,item.summary].join(' ')).join(' ');
  const advice=[];
  if(/GPT|Claude|Gemini|DeepSeek|Kimi|Qwen|模型|API/i.test(text))advice.push('把本期模型更新做成一张“任务质量、响应时间、单次成本、失败恢复”对照表。先拿你正在做的一个真实任务跑小样本，不要用发布分数直接替代产品选型。');
  if(/Agent|MCP|workflow|工作流|智能体/i.test(text))advice.push('观察 Agent 能力时，把演示拆成可恢复的任务链：每一步用了什么工具、需要什么权限、失败后从哪里续跑、哪些动作必须确认。能回答这四件事，才接近可用产品。');
  if(/图像|视频|语音|多模态|Seed|Realtime/i.test(text))advice.push('多模态能力应按“输入约束、生成等待、可编辑性、一致性、素材归属”评估。先选一个高频内容流程建立基准样例，记录返工次数，而不是只比较最好看的一次结果。');
  advice.push('从本期挑一篇最重要的文章，写出它改变了哪项用户任务假设，再为这个假设设计一个可证伪的小实验。下一次黑板题会优先训练这种从资讯到产品判断的转换。');
  return advice.slice(0,4);
}

function setNoticeComposerVisible(show){
  const composer = document.getElementById('notice-composer');
  if(composer) composer.style.display = show ? 'block' : 'none';
}

function escapeNotice(str){
  return String(str || '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function readNoticeList(key){
  try{ return JSON.parse(localStorage.getItem(key) || '[]'); }
  catch(e){ return []; }
}

function writeNoticeList(key, list, limit=50){
  localStorage.setItem(key, JSON.stringify(list.slice(0,limit)));
  if(!applyingButlerState) window.CozyButler?.persistLocal([key]);
  if(['cozy_notice_chest','cozy_notice_links','cozy_butler_watch_topics','cozy_butler_local_sources','cozy_toolbox_local_items','cozy_notice_custom_categories'].includes(key)){
    queueButlerStateSync();
  }
}

function noticeToday(){
  return localCalendarDate();
}

function noticeItemPayload(item, category){
  const preferred=preferredNoticeUrl(item);
  return {
    category: normalizeNoticeCategory(category || item.category,item),
    title: item.title || item.url || '未命名资料',
    summary: item.summary || '',
    translation_zh: item.translation_zh || item.summary_zh || '',
    ai_summary: item.ai_summary || '',
    product_tip: item.product_tip || item.product_manager_tip || '',
    media: item.media || mediaFromUrl(item.link || item.url || '') || '',
    published: noticePublishedLabel(item),
    url: preferred.original || ''
  };
}

function noticePayloadFromButton(btn){
  return {
    category: btn.dataset.category || '资讯',
    notice_tag: btn.dataset.noticeTag || '',
    title: btn.dataset.title || btn.dataset.url || '未命名资料',
    summary: btn.dataset.summary || '',
    translation_zh: btn.dataset.translationZh || '',
    ai_summary: btn.dataset.aiSummary || '',
    product_tip: btn.dataset.productTip || '',
    media: btn.dataset.media || mediaFromUrl(btn.dataset.url || ''),
    published: btn.dataset.published || '',
    url: btn.dataset.url || ''
  };
}

function noticeItemKey(item){
  const url = String(item.url || item.link || '').trim().replace(/#.*$/,'');
  if(url) return 'url:' + url.toLowerCase();
  return ['title', item.title || '', item.media || '', item.published || ''].join('|').toLowerCase();
}

function isNoticeReadLater(item){
  const key = noticeItemKey(item);
  return readNoticeList('cozy_notice_links').some(x=>noticeItemKey(x) === key);
}

function isNoticeChestItem(item){
  const key = noticeItemKey(item);
  return readNoticeList('cozy_notice_chest').some(x=>noticeItemKey(x) === key);
}

function upsertNoticeList(key, item, limit=50){
  const list = readNoticeList(key).filter(x=>noticeItemKey(x) !== noticeItemKey(item));
  list.unshift(Object.assign({date:noticeToday()}, item));
  writeNoticeList(key, list, limit);
  return list;
}

function removeNoticeListItem(key, item){
  const list = readNoticeList(key).filter(x=>noticeItemKey(x) !== noticeItemKey(item));
  writeNoticeList(key, list, 80);
  return list;
}

function saveNoticeItem(category,title,media,published,url='',summary=''){
  const item = {category,title,media,published,url,summary};
  upsertNoticeList('cozy_notice_links', item, 80);
  if(window.CozyMemory){
    CozyMemory.add({
      source:'noticeboard',
      type:'read_later',
      layer:'short',
      weight:1,
      content:[category,title,media,published,url].filter(Boolean).join(' · '),
      summary:'加入待读：'+title+'。用于判断近期关注的信息类型。'
    });
  }
  const status = document.getElementById('notice-status');
  if(status) status.textContent = '已加入待读：' + title;
}

function saveNoticeFromButton(btn){
  toggleNoticeReadLater(btn);
}

function toggleNoticeReadLater(btn){
  const item = noticePayloadFromButton(btn);
  const active = isNoticeReadLater(item);
  if(active){
    removeNoticeListItem('cozy_notice_links', item);
    btn.classList.remove('is-active');
    btn.textContent = '稍后看';
    const status = document.getElementById('notice-status');
    if(status) status.textContent = '已移出待读：' + item.title;
    return;
  }
  saveNoticeItem(item.category, item.title, item.media, item.published, item.url, item.summary);
  btn.classList.add('is-active');
  btn.textContent = '移出稍后看';
}

function saveNoticeChestFromButton(btn){

  if(selected) item.category = selected;

  if(picker) picker.remove();
}

function saveNoticeChestItem(item, reason){
  const payload = noticeItemPayload(item, item.category);
  payload.category = normalizeNoticeCategory(payload.category,item);
  const existed = isNoticeChestItem(payload);
  upsertNoticeList('cozy_notice_chest', payload, 120);
  if(window.CozyMemory && !existed){
    CozyMemory.add({
      source:'noticeboard',
      type:'chest_archive',
      layer:'long',
      weight:2,
      content:[payload.category,payload.title,payload.media,payload.url].filter(Boolean).join(' · '),
      summary:'收入栗夹：'+payload.title+'。作为长期资料归档到 '+payload.category+'。'
    });
  }
  const status = document.getElementById('notice-status');
  if(status) status.textContent = (existed ? '栗夹里已经有：' : '已收入栗夹：') + payload.title + ' · ' + payload.category;

}

function openChestPicker(btn){
  const card = btn.closest('.report-card');
  if(!card) return;
  const old = card.querySelector('.chest-picker');
  if(old){ old.remove(); return; }
  const item = noticePayloadFromButton(btn);

  const options = noticeChestCategories().map(cat=>
    '<option value="'+escapeNotice(cat)+'" '+(cat === selected ? 'selected' : '')+'>'+escapeNotice(cat)+'</option>'
  ).join('');
  const picker = document.createElement('div');
  picker.className = 'chest-picker';
  picker.innerHTML = '<select aria-label="栗夹分类">'+options+'</select>'+
    '<button onclick="createChestCategory(this)">+ 新分类</button>'+
    '<button onclick="confirmChestPicker(this)">收好</button>'+
    '<button onclick="removeChestPickerItem(this)">'+(current ? '移出' : '取消')+'</button>';
  card.appendChild(picker);
}

function noticeChestCategories(){
  return Array.from(new Set(NOTICE_BASE_CATEGORIES.concat(noticeCustomCategories())));
}

function createChestCategory(btn){
  const name = String(window.prompt('新分类名称') || '').trim().slice(0,12);
  if(!name) return;
  const custom = noticeCustomCategories();
  if(!custom.includes(name)){
    custom.push(name);
    writeNoticeList('cozy_notice_custom_categories',custom.map(x=>({name:x})),20);
  }
  const picker = btn.closest('.chest-picker');
  const select = picker ? picker.querySelector('select') : null;
  if(select && !Array.from(select.options).some(option=>option.value === name)){
    const option = document.createElement('option');
    option.value = name;
    option.textContent = name;
    select.appendChild(option);
  }
  if(select) select.value = name;
}

function getNoticeChestItem(item){
  const key = noticeItemKey(item);
  return readNoticeList('cozy_notice_chest').find(x=>noticeItemKey(x) === key);
}

function confirmChestPicker(btn){
  const picker = btn.closest('.chest-picker');
  const card = btn.closest('.report-card');

function removeChestPickerItem(btn){
  const picker = btn.closest('.chest-picker');
  const card = btn.closest('.report-card');

const COZY_API_ORIGIN = location.protocol === 'file:' ? 'http://127.0.0.1:8766' : '';
const NOTICE_VOICE_ENABLED = true;
let noticeRecognition = null;
let noticeDictation = null;
let nativeVoiceActive = false;
let nativeVoiceTimer = null;
let nativeVoiceBase = '';
let butlerServiceOnline = false;
let noticeBusyKind = '';
const NOTICE_JOB_KEY = 'cozy_notice_jobs';
let noticeTaskPollTimer = null;
let applyingButlerState = false;
let butlerStateSyncTimer = null;

async function cozyApi(path, payload, timeout=165000){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeout);
  try{
    const options = payload === undefined ? {signal:controller.signal,cache:'no-store',credentials:'same-origin'} : {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload),
      signal:controller.signal,
      cache:'no-store',
      credentials:'same-origin'
    };
    const response = await fetch(COZY_API_ORIGIN + path, options);
    let data = {};
    try{ data = await response.json(); }catch(e){}
    if(!response.ok || !data.ok) throw new Error(data.error || '本地服务返回错误');
    return data;
  }catch(error){
    if(error && error.name === 'AbortError') throw new Error('阿栗响应超时，请再试一次。');
    if(error instanceof TypeError) throw new Error(location.protocol==='file:'?'没有连接到阿栗本地服务。请双击 start.command，再打开 http://127.0.0.1:8766/。':'阿栗在线服务暂时没有连接，请稍后再试。');
    throw error;
  }finally{
    clearTimeout(timer);
  }
}

async function refreshButlerConnection(){
  const badge = document.getElementById('butler-connection');
  try{
    const data = await cozyApi('/api/status', undefined, 15000);
    butlerServiceOnline = true;
    if(badge){
      badge.className = 'butler-connection online';
      badge.textContent = '阿栗已连接 · '+(data.tools || 0)+' 个工具';
    }
    await syncButlerState();
  }catch(error){
    butlerServiceOnline = false;
    if(badge){
      badge.className = 'butler-connection offline';
      badge.textContent = '阿栗未连接';
      badge.title = error.message;
    }
  }
}

function butlerStateItemKey(item){
  const url = String(item.url || item.link || '').trim().toLowerCase().replace(/#.*$/,'');
  if(url) return 'url:'+url;
  return 'text:'+String(item.title || item.name || item.text || item.id || '').trim().toLowerCase();
}

function mergeButlerItems(primary, secondary){
  const seen = new Set();
  return (primary || []).concat(secondary || []).filter(item=>{
    if(!item || typeof item !== 'object') return false;
    const key = butlerStateItemKey(item);
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function localButlerState(){
  return {
    chest:readNoticeList('cozy_notice_chest'),
    read_later:readNoticeList('cozy_notice_links'),
    watch_topics:readNoticeList('cozy_butler_watch_topics'),
    sources:readNoticeList('cozy_butler_local_sources'),
    toolbox:readNoticeList('cozy_toolbox_local_items'),
    custom_categories:readNoticeList('cozy_notice_custom_categories')
  };
}

function applyButlerServerState(state, merge=false){
  if(!state) return;
  const mappings = {
    chest:'cozy_notice_chest', read_later:'cozy_notice_links', watch_topics:'cozy_butler_watch_topics',
    sources:'cozy_butler_local_sources', toolbox:'cozy_toolbox_local_items', custom_categories:'cozy_notice_custom_categories'
  };
  applyingButlerState = true;
  Object.keys(mappings).forEach(key=>{
    const remote = Array.isArray(state[key]) ? state[key] : [];
    let value = merge ? mergeButlerItems(remote,readNoticeList(mappings[key])) : remote;
    if(key === 'chest') value = value.map(item=>Object.assign({},item,{category:normalizeNoticeCategory(item.category,item)}));
    writeNoticeList(mappings[key],value,150);
  });
  applyingButlerState = false;
}

async function pushButlerState(){
  if(!butlerServiceOnline || applyingButlerState) return;
  try{ await cozyApi('/api/state/sync',{state:localButlerState()},12000); }
  catch(error){ /* 下一次连接时重新同步 */ }
}

function comparableButlerState(state){

function setNoticeBusy(kind, busy){
  const buttons = {
    send:document.getElementById('notice-send-btn'),
    parse:document.getElementById('notice-parse-btn'),
    voice:document.getElementById('notice-mic-btn')
  };
  if(busy){
    noticeBusyKind = kind;
    Object.keys(buttons).forEach(key=>{
      const button = buttons[key];
      if(!button) return;
      button.disabled = key === 'voice' && !NOTICE_VOICE_ENABLED ? true : (kind === 'voice' ? key !== 'voice' : true);
      button.classList.toggle('is-busy',key === kind);
      button.setAttribute('aria-busy',key === kind ? 'true' : 'false');
    });
    return;
  }
  if(noticeBusyKind && noticeBusyKind !== kind) return;
  noticeBusyKind = '';
  Object.keys(buttons).forEach(key=>{
    const button = buttons[key];
    if(!button) return;
    button.disabled = key === 'voice' && !NOTICE_VOICE_ENABLED;
    button.classList.remove('is-busy');
    button.setAttribute('aria-busy','false');
  });
}

async function pollNativeNoticeVoice(){
  if(!nativeVoiceActive) return;
  const status = document.getElementById('notice-status');
  const input = document.getElementById('notice-request');
  try{
    const data = await cozyApi('/api/voice/status',undefined,5000);
    if(data.transcript && input){
      input.value = [nativeVoiceBase,data.transcript].filter(Boolean).join(nativeVoiceBase ? ' ' : '');
      input.dispatchEvent(new Event('input',{bubbles:true}));
      if(status) status.textContent = '正在转成文字。再点一次麦克结束。';
    }else if(data.ready && status){
      status.textContent = '麦克风已打开，正在听。再点一次麦克结束。';
    }
    if(data.error){
      finishNativeNoticeVoice();
      if(status) status.textContent = '语音识别失败：'+data.error;
      return;
    }
    if(!data.active){
      finishNativeNoticeVoice();
      if(status) status.textContent = data.transcript ? '语音已写进留言框，可以点信封发送。' : '没有识别到语音，请再试一次。';
      return;
    }
  }catch(error){
    finishNativeNoticeVoice();
    if(status) status.textContent = '语音连接失败：'+error.message;
    return;
  }
  nativeVoiceTimer = setTimeout(pollNativeNoticeVoice,450);

function renderNoticeJobs(){

function recordCompletedNoticeJob(job){
  const requests=readNoticeList('cozy_notice_requests');
  const index=requests.findIndex(item=>item.task_id===job.task_id||item.id===job.task_id);
  const foundItems=Array.isArray(job.found_items)?job.found_items:[];
  const previous=index>=0?requests[index]:{};
  const record={...previous,id:job.task_id,task_id:job.task_id,text:job.text,mode:job.mode||previous.mode||'text',kind:job.kind||previous.kind||detectButlerTaskKind(job.text),date:job.date||previous.date||noticeToday(),reply:job.reply,updatedAt:new Date().toISOString()};
  if(foundItems.length){
    record.found_items=foundItems;
    record.found_item_keys=Array.from(new Set([...(previous.found_item_keys||[]),...foundItems.map(noticeItemKey).filter(Boolean)])).slice(-80);
    record.found_count=Math.max(Number(previous.found_count||0),foundItems.length);
    record.found_at=job.found_at||record.updatedAt;
    delete record.found_items_seen_at;
  }
  if(index>=0)requests[index]=record;else requests.unshift(record);
  writeNoticeList('cozy_notice_requests',requests,40);
  if(index<0){
    if(window.CozyMemory)CozyMemory.add({
      source:'noticeboard',type:job.mode==='voice'?'voice_notice_request':'notice_request',layer:job.mode==='voice'?'long':'short',
      weight:job.mode==='voice'?2:1,content:job.text,
      summary:(job.mode==='voice'?'语音留言：':'公告板留言：')+buildButlerMemorySummary(job.text)
    });
  }
  return foundItems.length;
}

async function syncNoticeTasks(){
  clearTimeout(noticeTaskPollTimer);noticeTaskPollTimer=null;
  try{
    const data=await cozyApi('/api/tasks',undefined,6000);
    const localById=new Map(readNoticeJobs().map(job=>[job.task_id,job]));
    const serverJobs=(data.tasks||[]).filter(task=>task.kind==='notice_request').sort((a,b)=>noticeJobTime(b)-noticeJobTime(a)).slice(0,20);
    let justCompleted=null;
    const jobs=serverJobs.map(task=>{
      const local=localById.get(task.id)||{};
      const reply=task.result&&task.result.reply?task.result.reply:(task.status==='completed'?task.message:'');
      const foundItems=Array.isArray(task.result?.found_items)?task.result.found_items:(local.found_items||[]);
      const job={...local,task_id:task.id,text:local.text||task.instruction||task.title,title:task.title,status:task.status,message:task.message||'',reply,found_items:foundItems,found_at:task.result?.found_at||'',started_at:task.started_at,updated_at:task.updated_at};
      if(task.status==='completed'&&!job.recorded){job.found_count=recordCompletedNoticeJob(job);job.recorded=true;justCompleted=job;}
      return job;
    });
    writeNoticeJobs(jobs);renderNoticeJobs();
    if(justCompleted){
      showButlerReply(justCompleted.text,justCompleted.reply);syncButlerState().catch(()=>{});
      if(justCompleted.found_count){
        prepareNoticeFoundResults();
        const active=document.querySelector('.notice-tabs button.active');
        if(active?.textContent.includes('最新'))showNoticeView('current',active);
      }
    }
    if(jobs.some(job=>job.status==='running'))noticeTaskPollTimer=setTimeout(syncNoticeTasks,1200);
  }catch(error){
    if(readNoticeJobs().some(job=>job.status==='running'))noticeTaskPollTimer=setTimeout(syncNoticeTasks,2500);
  }
}

function resumeNoticeTasks(){
  renderNoticeJobs();
  syncNoticeTasks();
}

function detectButlerTaskKind(text){
  if(!text) return 'task';
  if(extractMediaSourceFromRequest(text)) return 'media_source';
  if(extractNoticeUrls(text).length) return 'link';
  if(/工具箱|加入工具|学术|Claude Science/i.test(text)) return 'toolbox';
  if(/资讯|关注|明天|下周|总结|方向/.test(text)) return 'watch_topic';
  return 'task';
}

function buildButlerMemorySummary(text){
  const kind = detectButlerTaskKind(text);
  if(kind === 'media_source') return '希望阿栗以后巡逻时参考新的信息来源。';
  if(kind === 'link') return '希望阿栗解析链接并归类到资料架。';
  if(kind === 'toolbox') return '希望阿栗把提到的工具整理进工具箱。';
  if(kind === 'watch_topic') return '希望阿栗调整资讯巡逻方向和总结口径。';
  return '希望阿栗帮忙做一件事。';
}

      parsedItems.forEach(item=>saveNoticeItem(item.category,item.title,item.media,item.published,item.url,item.summary));
      actions.push('已读取链接正文、完成 AI 总结、收入栗夹并加入待读。');
    }else{
      actions.push('已读取链接正文、完成 AI 总结并收入栗夹。');

function extractNoticeUrls(text){
  const match = String(text || '').match(/https?:\/\/[^\s，。；、)）]+/g);
  return match ? match.map(url=>url.replace(/[.,，。；;]+$/,'')) : [];
}

function noticeDomain(url){
  try{ return new URL(url).hostname.replace(/^www\./,''); }
  catch(e){ return ''; }
}

function mediaFromUrl(url){
  const host = noticeDomain(url);
  const map = [
    ['openai.com','OpenAI'],['anthropic.com','Anthropic'],['deepseek.com','DeepSeek'],
    ['moonshot.cn','Kimi'],['kimi.com','Kimi'],['qwen.ai','通义千问'],['tongyi.aliyun.com','通义千问'],
    ['volcengine.com','字节 Seed'],['doubao.com','豆包'],['36kr.com','36氪'],
    ['qbitai.com','量子位'],['jiqizhixin.com','机器之心'],['infoq.cn','InfoQ 中文']
  ];
  const hit = map.find(([domain])=>host.includes(domain));
  return hit ? hit[1] : host;
}

function parseNoticeLink(url, text){
  const cleanText = String(text || '').replace(url,'').replace(/\s+/g,' ').trim();
  const media = mediaFromUrl(url) || '外部链接';
  const title = cleanText && cleanText.length <= 48 ? cleanText : media + ' 资料链接';
  return {
    title,
    summary:'由留言中的链接自动收进来，等接上模型后会抓正文摘要。当前先按链接、关键词和来源归类。',
    media,
    published:noticeToday(),
    url,
    category:inferNoticeCategory({title, summary:cleanText, media, url})
  };
}

function inferNoticeCategory(item){
  return normalizeNoticeCategory(item.category,item);
}

function extractMediaSourceFromRequest(text){
  const raw = String(text || '');
  if(!/(媒体|信息源|来源|网站|以后|下次|也看|也找|加入|新增|添加|纳入|关注)/.test(raw)) return null;
  if(!/(以后|下次|也看|也找|加入|新增|添加|纳入|关注|巡逻)/.test(raw)) return null;
  const urls = extractNoticeUrls(raw);
  const url = urls[0] || '';
  let name = url ? mediaFromUrl(url) : '';
  const patterns = [
    /(?:把|将)?\s*([^，。；\s]{2,28}?)(?:这个媒体|这个网站|这个来源|加入|纳入|也看|也找|作为)/,
    /以后(?:也)?(?:看看|看|找|关注)\s*([^，。；\s]{2,28})/,
    /(?:新增(?!加)|添加|加入)\s*([^，。；\s]{2,28}?)(?:媒体|来源|网站|信息源)?/
  ];
  for(const pattern of patterns){
    const hit = raw.match(pattern);
    if(hit && hit[1] && !/^https?:/i.test(hit[1])){
      name = hit[1].replace(/这个|媒体|网站|来源|信息源/g,'').trim() || name;
      break;
    }
  }
  if(!name && !url) return null;
  const domain = noticeDomain(url);
  return {name:name || domain || '新来源', url, domain};
}

function saveLocalMediaSource(source, text){
  const sources = readNoticeList('cozy_butler_local_sources').filter(x=>

  );
  sources.unshift({
    name:source.name,
    url:source.url,
    domain:source.domain,
    request:text,
    date:noticeToday(),
    enabled:true
  });
  writeNoticeList('cozy_butler_local_sources', sources, 50);
  if(window.CozyMemory){
    CozyMemory.add({
      source:'noticeboard',
      type:'butler_source_hint',
      layer:'long',
      weight:2,
      content:[source.name,source.url,text].filter(Boolean).join(' · '),
      summary:'阿栗新增了一个隐藏巡逻线索：'+source.name+'。'
    });
  }
}

  if(!text){ box.className = 'butler-reply'; box.innerHTML = ''; return; }
  box.className = 'butler-reply show with-dog';
  box.innerHTML = '<span class="reply-dog"></span><span class="reply-text">'+escapeNotice(result || '阿栗记下了。')+'</span>';
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeOverlay(); });

/* ---------- panorama.png 存在时切到实景坐标 ---------- */
function enablePanoramaMode(){
  const stage = document.getElementById('stage');
  const img = document.getElementById('estate-bg');
  if(!stage || !img || !img.naturalWidth) return;
  document.querySelectorAll('.spot[data-pan-x]').forEach(spot=>{
    spot.style.setProperty('--pan-x', spot.dataset.panX);
    spot.style.setProperty('--pan-y', spot.dataset.panY);
    spot.style.setProperty('--pan-w', spot.dataset.panW || 10);
    spot.style.setProperty('--pan-h', spot.dataset.panH || 10);
  });
  stage.classList.add('has-panorama');
  delete stage.dataset.weatherPending;
  stage.classList.add('scene-ready');
}

function initPanorama(){
  const stage = document.getElementById('stage');
  const img = document.getElementById('estate-bg');
  if(!stage || !img) return;
  img.addEventListener('load', enablePanoramaMode);
  img.addEventListener('error', ()=>{
    const fallback=String(img.src||'').replace(/\.webp(?:\?.*)?$/,'.png');
    if(!img.dataset.fallback&&fallback!==img.src){img.dataset.fallback='1';img.src=fallback;return;}
    stage.classList.remove('has-panorama');stage.classList.add('scene-ready');img.remove();
  });
  if(img.complete&&img.getAttribute('src')){
    if(img.naturalWidth) enablePanoramaMode();
    else stage.classList.add('scene-ready');
  }
}

const ESTATE_SCENES = {
  sunny:'assets/estate/panorama.webp',
  morning:'assets/estate/panorama_morning.webp',
  snow:'assets/estate/panorama_snow.webp',
  rain:'assets/estate/panorama_rain.webp',
  thunder:'assets/estate/panorama_rain.webp',
  overcast:'assets/estate/panorama_overcast.webp',
  fog:'assets/estate/panorama_fog.webp'
};

const ESTATE_MOBILE_SCENES = {
  sunny:'assets/estate/panorama_mobile.webp',
  morning:'assets/estate/panorama_morning_mobile.webp',
  snow:'assets/estate/panorama_snow_mobile.webp',
  rain:'assets/estate/panorama_rain_mobile.webp',
  thunder:'assets/estate/panorama_thunder_mobile.webp',
  overcast:'assets/estate/panorama_overcast_mobile.webp',
  fog:'assets/estate/panorama_fog_mobile.webp'
};

function estateSceneSrc(scene){
  const desktop=ESTATE_SCENES[scene]||ESTATE_SCENES.sunny;
  return matchMedia('(max-width:760px)').matches?(ESTATE_MOBILE_SCENES[scene]||ESTATE_MOBILE_SCENES.sunny):desktop;
}

function localTimeScene(){
  const hour = new Date().getHours();
  return hour >= 5 && hour < 10 ? 'morning' : 'sunny';
}

function sceneWeatherTitle(data){
  const location = data && data.location || {};
  const current = data && data.current || {};
  const temperature = current.temperature == null ? '' : ' · '+Math.round(Number(current.temperature))+String(current.temperature_unit || '°C');
  return [location.address||location.city, current.condition].filter(Boolean).join(' · ')+temperature;
}

let estateSceneRequestId = 0;
function applyEstateScene(scene, weatherData){
  const img = document.getElementById('estate-bg');
  const stage = document.getElementById('stage');
  if(/雷/.test(String(weatherData?.current?.condition||''))) scene='thunder';
  const src = estateSceneSrc(scene);
  if(!img || !stage) return;
  const requestId = ++estateSceneRequestId;
  const weatherTitle = sceneWeatherTitle(weatherData);
  updateButlerClock(weatherData);
  stage.dataset.weather = (weatherData && weatherData.current && weatherData.current.condition) || '晴天';
  if(weatherTitle){
    const title = document.querySelector('.title');
    if(title) title.title = weatherTitle+' · 场景会随当地天气自动更新';
  }
  if(img.getAttribute('src') === src){
    stage.dataset.scene = scene;
    localStorage.setItem('cozy_estate_scene',scene);
    return;
  }
  stage.dataset.sceneLoading = scene;
  const preload = new Image();
  preload.onload = ()=>{
    if(requestId !== estateSceneRequestId) return;
    img.style.opacity = '.72';
    img.src = src;
    img.alt = weatherTitle ? '栗壳小院，'+weatherTitle : '栗壳小院';
    stage.dataset.scene = scene;
    delete stage.dataset.sceneLoading;
    localStorage.setItem('cozy_estate_scene',scene);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ img.style.opacity = '1'; }));
  };
  preload.onerror = ()=>{
    if(requestId !== estateSceneRequestId) return;
    delete stage.dataset.sceneLoading;
    delete stage.dataset.weatherPending;
    stage.classList.add('scene-ready');
  };
  preload.src = src;
}

let estatePositionPromise=null;
function estateWeatherPosition(){
  if(estatePositionPromise)return estatePositionPromise;
  if(!navigator.geolocation||location.protocol!=='https:')return Promise.resolve('');
  estatePositionPromise=new Promise(resolve=>navigator.geolocation.getCurrentPosition(position=>{
    const latitude=Number(position.coords.latitude).toFixed(5),longitude=Number(position.coords.longitude).toFixed(5);
    resolve('?latitude='+encodeURIComponent(latitude)+'&longitude='+encodeURIComponent(longitude));
  },()=>resolve(''),{enableHighAccuracy:false,timeout:7000,maximumAge:30*60*1000}));
  return estatePositionPromise;
}

async function refreshEstateWeather(){
  try{
    const positionQuery=await estateWeatherPosition();
    const data = await cozyApi('/api/weather'+positionQuery, undefined, 12000);
    applyEstateScene((data.current && data.current.scene) || 'sunny', data);
  }catch(error){
    applyEstateScene(localTimeScene(), null);
  }
}

let latestEstateWeather=null;
function updateButlerClock(weatherData){
  if(weatherData)latestEstateWeather=weatherData;
  const node=document.getElementById('b-weather');if(!node)return;
  const now=new Date();
  const clock=String(now.getMonth()+1).padStart(2,'0')+'月'+String(now.getDate()).padStart(2,'0')+'日 '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  const data=latestEstateWeather||{};const location=data.location||{};const current=data.current||{};
  const temperature=current.temperature==null?'':Math.round(Number(current.temperature))+'°';
  const weather=[location.address||location.city,current.condition,temperature].filter(Boolean).join(' ');
  node.textContent=clock+(weather?' · '+weather:' · 天气待更新');
}

function initWeatherScene(){
  updateButlerClock(null);
  setInterval(()=>updateButlerClock(null),60*1000);
  if(window.CozyRuntime && window.CozyRuntime.readOnly)return;
  refreshEstateWeather();
  setInterval(refreshEstateWeather, 2 * 60 * 60 * 1000);
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') refreshEstateWeather();
  });
}

function clearDemoBrowserState(){
  const keep = new Set(['cozy_estate_scene']);
  Object.keys(localStorage).forEach(key=>{ if(key.startsWith('cozy_')&&!keep.has(key)) localStorage.removeItem(key); });
}
function setDemoButtonsBusy(active){document.querySelectorAll('.demo-control').forEach(button=>{button.disabled=active;});}
async function refreshDemoActivation(){
  if(window.CozyRuntime?.mode!=='interview')return;
  const button=document.getElementById('demo-ai');
  try{
    const data=await cozyApi('/api/demo/status',undefined,8000),active=Boolean(data.activation?.active);
    button?.classList.toggle('ai-active',active);
    if(button){button.textContent=active?'阿栗已激活':'激活阿栗';button.title=active?'点击输入主人口令，可关闭阿栗':'点击输入主人口令，临时开放阿栗';}
    window.dispatchEvent(new CustomEvent('cozy:demo-activation',{detail:data.activation||{active:false}}));
    return data.activation;
  }catch(_error){if(button)button.textContent='阿栗未连接';return {active:false};}
}
async function resetDemoEstate(){
  const button=document.getElementById('demo-reset');setDemoButtonsBusy(true);if(button)button.textContent='重置中…';
  try{await cozyApi('/api/demo/reset',{},20000);clearDemoBrowserState();location.reload();}
  catch(error){setDemoButtonsBusy(false);if(button)button.textContent='一键重置';openPanel('<h2>重置没有完成</h2><p class="sub">'+escapeNotice(error.message)+'</p>');}
}
async function loadDemoGuide(){
  const button=document.getElementById('demo-guide');setDemoButtonsBusy(true);if(button)button.textContent='准备示例…';
  try{await cozyApi('/api/demo/seed',{},20000);clearDemoBrowserState();sessionStorage.setItem('cozy_demo_show_guide','1');location.reload();}
  catch(error){setDemoButtonsBusy(false);if(button)button.textContent='引导示例';openPanel('<h2>示例没有载入</h2><p class="sub">'+escapeNotice(error.message)+'</p>');}
}
function showDemoGuide(){
  openPanel('<div class="demo-guide"><h2>从这三处认识栗壳小院</h2><p class="sub">示例数据已经装好，你可以自由修改，最后用右上角“一键重置”恢复。</p><div class="demo-guide-list"><div class="demo-guide-step"><b>1</b><span>打开公告板，看阿栗怎样把 AI 动态整理成产品判断。</span></div><div class="demo-guide-step"><b>2</b><span>进入黑板回答一道题，查看批改、参考答案和相关资料。</span></div><div class="demo-guide-step"><b>3</b><span>去智慧果园，把多轮提问沉淀成可以复习的知识专题。</span></div></div><button class="bb-submit" onclick="closeOverlay();openNotice()">从公告板开始</button></div>');
}
function openDemoActivation(){
  const dialog=document.getElementById('demo-dialog'),input=document.getElementById('demo-passcode'),status=document.getElementById('demo-dialog-status');
  if(status)status.textContent='';if(input)input.value='';dialog?.classList.add('show');dialog?.setAttribute('aria-hidden','false');setTimeout(()=>input?.focus(),40);
}
function closeDemoActivation(){const dialog=document.getElementById('demo-dialog');dialog?.classList.remove('show');dialog?.setAttribute('aria-hidden','true');}
function toggleDemoPasscode(){const input=document.getElementById('demo-passcode'),button=document.getElementById('demo-eye');if(!input)return;const visible=input.type==='text';input.type=visible?'password':'text';if(button){button.title=visible?'显示口令':'隐藏口令';button.setAttribute('aria-label',button.title);}input.focus();}
async function setDemoAi(enabled){
  const input=document.getElementById('demo-passcode'),status=document.getElementById('demo-dialog-status'),buttons=document.querySelectorAll('.demo-dialog-actions button'),passcode=input?.value||'';
  if(!passcode){if(status)status.textContent='请先输入主人管理口令。';input?.focus();return;}
  buttons.forEach(button=>{button.disabled=true;});if(status)status.textContent=enabled?'正在开放阿栗…':'正在关闭阿栗…';
  try{const data=await cozyApi('/api/demo/activation',{passcode,enabled,hours:8},12000);if(status)status.textContent=data.activation?.active?'阿栗已开放 8 小时。':'阿栗已经关闭。';await refreshDemoActivation();setTimeout(closeDemoActivation,650);}
  catch(error){if(status)status.textContent=error.message;}
  finally{buttons.forEach(button=>{button.disabled=false;});}
}
function initDemoControls(){
  if(window.CozyRuntime?.mode!=='interview')return;
  const controls=document.getElementById('demo-controls');if(controls)controls.hidden=false;refreshDemoActivation();
  if(sessionStorage.getItem('cozy_demo_show_guide')==='1'){sessionStorage.removeItem('cozy_demo_show_guide');CORE_READY.then(showDemoGuide);}
}
initPanorama();
if(typeof Image !== 'undefined' && typeof setInterval === 'function') initWeatherScene();
initDemoControls();
